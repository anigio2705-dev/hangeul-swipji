<!doctype html><html lang="ko" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한글쉽지 | 실시간 한국어 대화</title><style>body{margin:0;background:#f4f7fb;color:#17334d;font:16px system-ui}header{background:#fff;padding:18px}main{max-width:960px;margin:auto;padding:20px}.hero{background:linear-gradient(110deg,#153f70,#16818a);color:white;padding:28px;border-radius:18px}.card{background:#fff;border:1px solid #dce5f1;border-radius:15px;padding:20px;margin:16px 0}label{display:block;margin-top:12px;font-weight:700}input,select{display:block;box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd6e4;border-radius:9px}button{padding:12px 16px;border:0;border-radius:9px;background:#1768ac;color:white;font-weight:700;cursor:pointer;margin:10px 6px 5px 0}button:disabled{opacity:.4}.hide{display:none}.note{background:#fff6df;padding:14px;border-radius:10px}#video iframe{width:100%;height:460px;border:0}a{color:#1768ac}</style><script src="./speaking-config.js"></script></head><body><header><b>한글쉽지 · LIVE</b>　<a href="./index.html">홈페이지</a></header><main><div class="hero"><h1>한국인과 1:1 한국어 대화</h1><p>회원가입 · 개인 공간 · 실시간 대기와 매칭 · 화상 대화</p></div><p class="note" id="setup">서비스 연결 확인 중</p><section id="auth" class="card"><h2>① 회원가입 · 로그인</h2><label>이메일</label><input id="email" type="email"><label>비밀번호</label><input id="pw" type="password"><button id="signup">회원가입</button><button id="signin">로그인</button></section><section id="app" class="hide"><div class="card"><h2>① 내 개인 공간</h2><p id="who"></p><label>참여 유형</label><select id="role"><option value="learner">외국인 학습자</option><option value="partner">한국인 파트너</option></select><label>이름</label><input id="nick" maxlength="40"><label>한국어 수준</label><select id="level"><option value="beginner">초급</option><option value="intermediate">중급</option><option value="advanced">고급</option></select><label>대화 주제</label><select id="topic"><option value="daily">일상</option><option value="travel">여행</option><option value="food">음식</option><option value="culture">문화</option></select><button id="save">프로필 저장</button><button id="logout">로그아웃</button></div><div class="card" id="partnerBox"><h2>② 한국인 파트너 대기</h2><p id="approved"></p><button id="toggle">대기 시작 / 종료</button><h3>받은 대화 요청</h3><div id="inbox">없음</div></div><div class="card" id="learnerBox"><h2>② 한국인 찾기</h2><button id="refresh">새로고침</button><div id="partners">대기 중인 파트너를 찾는 중</div><h3>내 요청</h3><div id="outbox">없음</div></div><div id="roomBox" class="card hide"><h2>③ 1:1 화상 대화</h2><p class="note">시범 운영: 입장 링크가 알려지면 제3자도 들어올 수 있습니다. 정식 서비스에서는 인증된 전용 화상 서버가 필요합니다.</p><button id="join">화상방 입장</button><button id="finish">대화 종료</button><div id="video"></div></div></section><p id="message" role="status"></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id),c=window.HS_CONFIG||{};let db,u,p,active,timer;
const say=s=>$('message').textContent=s;
const escape=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const action=fn=>async()=>{try{await fn()}catch(e){say(e.message)}};
if(!c.supabaseUrl||!c.supabaseAnonKey){$('setup').textContent='서버 연결 대기: Supabase 프로젝트 URL과 공개 키를 설정해야 회원가입·매칭이 실제로 작동합니다.';$('signup').disabled=$('signin').disabled=true}else{db=createClient(c.supabaseUrl,c.supabaseAnonKey);$('setup').textContent='서비스 서버 설정됨. 파트너는 운영자 승인 후 대기할 수 있습니다.';db.auth.onAuthStateChange(()=>setTimeout(load,0));load()}
async function load(){const r=await db.auth.getUser();u=r.data.user;$('auth').classList.toggle('hide',!!u);$('app').classList.toggle('hide',!u);clearInterval(timer);if(!u)return;$('who').textContent=u.email;const x=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();if(x.error)throw x.error;p=x.data;if(p){$('role').value=p.role;$('nick').value=p.nickname;$('level').value=p.level;$('topic').value=p.topic}$('partnerBox').classList.toggle('hide',p?.role!=='partner');$('learnerBox').classList.toggle('hide',p?.role!=='learner');$('approved').textContent=p?.approved?'승인됨 · '+(p.is_online?'온라인':'오프라인'):'운영자 승인 대기';$('toggle').disabled=!p?.approved;await refresh();timer=setInterval(()=>refresh().catch(e=>say(e.message)),7000)}
$('signup').onclick=action(async()=>{const x=await db.auth.signUp({email:$('email').value,password:$('pw').value});if(x.error)throw x.error;say('가입 요청 완료. 이메일 확인 안내를 확인하세요.')});
$('signin').onclick=action(async()=>{const x=await db.auth.signInWithPassword({email:$('email').value,password:$('pw').value});if(x.error)throw x.error;await load()});
$('logout').onclick=action(async()=>{await db.auth.signOut();location.reload()});
$('save').onclick=action(async()=>{const n=$('nick').value.trim();if(n.length<2)throw Error('이름은 두 글자 이상 입력하세요');const x=await db.from('profiles').upsert({id:u.id,nickname:n,role:$('role').value,level:$('level').value,topic:$('topic').value});if(x.error)throw x.error;say('저장 완료');await load()});
$('toggle').onclick=action(async()=>{const x=await db.rpc('set_availability',{want_online:!p.is_online});if(x.error)throw x.error;await load()});
$('refresh').onclick=action(refresh);
async function refresh(){if(!u||!p)return;const x=await db.from('matches').select('*').or('learner_id.eq.'+u.id+',partner_id.eq.'+u.id).in('status',['requested','accepted']);if(x.error)throw x.error;const a=x.data||[];const pending=a.filter(v=>v.partner_id===u.id&&v.status==='requested');$('inbox').innerHTML=pending.length?pending.map(v=>'<p>대화 요청 <button data-accept="'+v.id+'">수락</button><button data-reject="'+v.id+'">거절</button></p>').join(''):'요청 없음';$('outbox').textContent=a.filter(v=>v.learner_id===u.id).map(v=>v.status==='requested'?'수락 대기 중':'대화 가능').join(', ')||'신청 없음';active=a.find(v=>v.status==='accepted');$('roomBox').classList.toggle('hide',!active);if(!active)$('video').replaceChildren();if(p.role==='learner'){const y=await db.from('online_partners').select('*');if(y.error)throw y.error;$('partners').innerHTML=y.data?.length?y.data.map(v=>'<p><b>'+escape(v.nickname)+'</b> · '+escape(v.topic)+' <button data-request="'+v.id+'">대화 요청</button></p>').join(''):'현재 대기 중인 한국인이 없습니다.'}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const type=b.dataset.request?'request_match':b.dataset.accept||b.dataset.reject?'respond_match':null;if(!type)return;action(async()=>{const args=type==='request_match'?{chosen_partner:b.dataset.request}:{match_id:b.dataset.accept||b.dataset.reject,approve:!!b.dataset.accept};const x=await db.rpc(type,args);if(x.error)throw x.error;say('요청이 처리되었습니다.');await refresh()})()});
$('join').onclick=()=>{if(!active?.room_code)return;const f=document.createElement('iframe');f.src='https://meet.jit.si/HangeulSwipji-'+active.room_code.replace(/[^a-z0-9-]/gi,'');f.allow='camera;microphone;fullscreen;display-capture';$('video').replaceChildren(f)};
$('finish').onclick=action(async()=>{if(!active)return;const x=await db.rpc('finish_match',{match_id:active.id});if(x.error)throw x.error;await refresh()});
</script></body></html>
