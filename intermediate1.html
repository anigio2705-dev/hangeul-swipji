const units=[{"title":["조사","Particles"],"desc":["조사 학습","Practice Particles"],"v":[["주제","topic"],["주어","subject"],["목적어","object"],["학교","school"],["친구","friend"],["책","book"]],"sent":[["저는 학생이에요.","I am a student."],["친구가 와요.","A friend is coming."],["책을 읽어요.","I read a book."]],"grammar":[["은/는은 화제, 이/가는 주어, 을/를은 목적어를 나타냅니다.","은/는 marks topics, 이/가 subjects, 을/를 objects."],["저는 학생이에요.","I am a student."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. A friend is coming. → 친구가 와요.","Self-check: cover the Korean, say this from its meaning, then compare. A friend is coming. → 친구가 와요."]],"quiz":[["'주제'의 뜻은?","What does '주제' mean?",["object","topic","subject","school"],1],["'주어'의 뜻은?","What does '주어' mean?",["object","subject","school","topic"],1],["'I am a student.'의 한국어 표현은?","Which Korean sentence means 'I am a student.'?",["친구","책을 읽어요.","친구가 와요.","저는 학생이에요."],3],["'저는'의 '는'은?","What does 는 in 저는 mark?",["object","destination","topic","past tense"],2],["다음 문장의 뜻은? 저는 학생이에요.","What does this sentence mean? 저는 학생이에요.",["topic","I read a book.","I am a student.","A friend is coming."],2]]},{"title":["과거와 미래","Past and Future"],"desc":["과거와 미래 학습","Practice Past and Future"],"v":[["어제","yesterday"],["내일","tomorrow"],["지난주","last week"],["다음 주","next week"],["계획","plan"],["여행","trip"]],"sent":[["어제 영화를 봤어요.","I watched a movie yesterday."],["내일 공부할 거예요.","I will study tomorrow."],["다음 주에 여행할 거예요.","I will travel next week."]],"grammar":[["과거는 -았/었어요, 미래는 -(으)ㄹ 거예요로 표현합니다.","Use -았/었어요 for the past and -(으)ㄹ 거예요 for future."],["어제 영화를 봤어요.","I watched a movie yesterday."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. I will study tomorrow. → 내일 공부할 거예요.","Self-check: cover the Korean, say this from its meaning, then compare. I will study tomorrow. → 내일 공부할 거예요."]],"quiz":[["'어제'의 뜻은?","What does '어제' mean?",["last week","tomorrow","next week","yesterday"],3],["'내일'의 뜻은?","What does '내일' mean?",["tomorrow","next week","last week","yesterday"],0],["'I watched a movie yesterday.'의 한국어 표현은?","Which Korean sentence means 'I watched a movie yesterday.'?",["계획","어제 영화를 봤어요.","내일 공부할 거예요.","다음 주에 여행할 거예요."],1],["'공부할 거예요'의 시제는?","What tense is 공부할 거예요?",["future","present","past","imperative"],0],["다음 문장의 뜻은? 어제 영화를 봤어요.","What does this sentence mean? 어제 영화를 봤어요.",["I will travel next week.","I will study tomorrow.","yesterday","I watched a movie yesterday."],3]]},{"title":["이유","Reasons"],"desc":["이유 학습","Practice Reasons"],"v":[["비","rain"],["피곤하다","tired"],["늦다","late"],["그래서","therefore"],["때문에","because of"],["쉬다","rest"]],"sent":[["비가 와서 집에 있었어요.","I stayed home because it rained."],["피곤해서 쉬었어요.","I rested because I was tired."],["늦어서 죄송해요.","Sorry I am late."]],"grammar":[["-아서/어서와 -기 때문에는 이유를 나타냅니다.","-아서/어서 and -기 때문에 express reasons."],["비가 와서 집에 있었어요.","I stayed home because it rained."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. I rested because I was tired. → 피곤해서 쉬었어요.","Self-check: cover the Korean, say this from its meaning, then compare. I rested because I was tired. → 피곤해서 쉬었어요."]],"quiz":[["'비'의 뜻은?","What does '비' mean?",["rain","therefore","tired","late"],0],["'피곤하다'의 뜻은?","What does '피곤하다' mean?",["tired","therefore","rain","late"],0],["'I stayed home because it rained.'의 한국어 표현은?","Which Korean sentence means 'I stayed home because it rained.'?",["피곤해서 쉬었어요.","늦어서 죄송해요.","비가 와서 집에 있었어요.","때문에"],2],["'피곤해서'의 '-어서'는?","What does -어서 in 피곤해서 express?",["command","contrast","quotation","reason"],3],["다음 문장의 뜻은? 비가 와서 집에 있었어요.","What does this sentence mean? 비가 와서 집에 있었어요.",["Sorry I am late.","I stayed home because it rained.","rain","I rested because I was tired."],1]]},{"title":["조건","Conditions"],"desc":["조건 학습","Practice Conditions"],"v":[["시간","time"],["가능하다","possible"],["약속","appointment"],["주말","weekend"],["만약","if"],["계획","plan"]],"sent":[["시간이 있으면 만나요.","Let's meet if you have time."],["비가 오면 집에 있을 거예요.","If it rains I will stay home."],["주말에 쉴 거예요.","I will rest this weekend."]],"grammar":[["-(으)면은 조건을 나타냅니다.","-(으)면 introduc
