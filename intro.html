t=idx===q[3]?(lang==="ko"?"정답입니다.":"Correct."):(lang==="ko"?"다시 생각해 보세요.":"Try again.")});wrap.append(b)});const result=document.createElement("p");result.setAttribute("aria-live","polite");wrap.append(result);host.append(wrap)})}};function renderCoach(){const u=units[unit],k=lang==="ko"?0:1,phrase=u.sent?.[0]?.[0]||u.v?.[0]?.[0]||"",translation=u.sent?.[0]?.[1]||u.v?.[0]?.[1]||"";const h=document.getElementById("coachHeading");if(!h)return;h.textContent=lang==="ko"?"오늘의 학습 목표 · 실제 사용":"Today's learning target · Use it in context";document.getElementById("coachGoal").textContent=lang==="ko"?"이번 단원의 핵심 표현을 읽고, 듣고, 의미를 확인한 뒤 자신의 상황에 맞게 바꾸어 말해 보세요. 주제: "+u.title[0]:"Read, listen and understand this unit's target expression. Then adapt it to a real situation. Topic: "+u.title[1];document.getElementById("coachPhrase").textContent=phrase;const t=document.getElementById("coachTranslation");t.textContent=translation;t.hidden=true;document.getElementById("coachChallenge").textContent=lang==="ko"?"연습 과제: 핵심 표현을 소리 내어 3번 읽고, 어휘 하나를 바꾸어 새로운 표현을 만들어 보세요.":"Practice: Say the expression aloud three times. Replace one word to create a new expression.";document.getElementById("coachListen").textContent=lang==="ko"?"🔊 핵심 표현 듣기":"🔊 Hear expression";document.getElementById("coachReveal").textContent=lang==="ko"?"표현 뜻 확인":"Reveal meaning";document.getElementById("coachGo").textContent=lang==="ko"?"실생활 상황에서 연습하기 →":"Try a real-life scenario →";document.getElementById("coachListen").onclick=()=>speak(phrase);document.getElementById("coachReveal").onclick=()=>{t.hidden=!t.hidden}}
function render(){const t=ui[lang],k=lang==="ko"?0:1;document.documentElement.lang=lang;$("lang").value=lang;for(const id of ["back","title","intro","listTitle","warning"])$(id).textContent=t[id];const nav=$("nav");nav.replaceChildren();const lessonFilter=$("filterLessons").value.trim().toLocaleLowerCase();units.forEach((u,i)=>{const label=(i+1)+". "+u.title[k];const item=button((state.done[i]?"✓ ":"")+label,()=>{unit=i;tab=0;reviewMode=false;selected={};render()},""+(unit===i?"active":""));item.style.display=!lessonFilter||label.toLocaleLowerCase().includes(lessonFilter)?"":"none";nav.append(item)});$("progressLabel").textContent=t.progress+": "+Object.keys(state.done).filter(x=>state.done[x]).length+" / "+units.length;$("progressBar").style.width=(Object.keys(state.done).filter(x=>state.done[x]).length/units.length*100)+"%";$("lessonTitle").textContent=units[unit].title[k];$("lessonDesc").textContent=units[unit].desc[k];renderCoach();renderManuscript();const tabs=$("tabs");tabs.replaceChildren();t.tabs.forEach((v,i)=>tabs.append(button(v,()=>{tab=i;reviewMode=false;selected={};render()},""+(tab===i?"active":""))));const content=$("content");content.replaceChildren();if(tab===0||tab===1){for(const pair of (tab===0?units[unit].v:units[unit].sent)){const item=document.createElement("div");item.className="item";const a=document.createElement("div"),b=document.createElement("strong"),c=document.createElement("span");b.textContent=pair[0];c.textContent=pair[1];a.append(b,c);item.append(a,button(t.listen,()=>speak(pair[0]),"listen"));content.append(item)}}else if(tab===2){for(const pair of units[unit].grammar){const p=document.createElement("p");p.className="grammar";p.textContent=pair[k];content.append(p)}}else if(tab===3){renderQuiz(content,units[unit].quiz.map((q,i)=>({u:unit,i,q})),false)}else renderReview(content)}
function renderQuiz(host,items,isReview){const t=ui[lang],k=lang==="ko"?0:1;host.replaceChildren();const note=document.createElement("p");note.className="muted";note.textContent=isReview?t.wrongHint:t.quizHelp;host.append(note);if(!items.length){const p=document.createElement("p");p.className="muted";p.textContent=t.empty;host.append(p);return}items.forEach(({u,i,q},n)=>{const section=document.createElement("div");section.className="mistake";const p=document.createElement("div");p.className="question";p.textContent=(n+1)+". "+q[k];section.append(p);const opts=document.createElement("div");opts.className="choices";q[2].forEach((answer,j)=>{const b=button(answer,()=>{selected[key(u,i)]=j;renderOptions(opts,j)},"choice");b.setAttribute("aria-pressed",String(selected[key(u,i)]===j));opts.append(b)});section.append(opts);host.append(section)});const msg=document.createElement("div");msg.className="feedback";msg.setAttribute("aria-live","polite");host.append(msg);host.append(button(t.submit,()=>{if(items.some(({u,i})=>selected[key(u,i)]===undefined)){msg.textContent=t.choose;return}let good=0;items.forEach(({u,i,q})=>{const id=key(u,i);if(selected[id]===q[3]){good++;delete state.mistakes[id]}else state.mistakes[id]=true});if(!isReview&&good===items.length)state.done[unit]=true;save();msg.textContent=t.result+": "+good+" / "+items.length;const results=document.createElement("div");items.forEach(({u,i,q})=>{const p=document.createElement("p");p.className="mistake";p.textContent=(selected[key(u,i)]===q[3]?"✓ ":"✗ ")+q[k]+" — "+t.correctAnswer+": "+q[2][q[3]];results.append(p)});host.append(results);const row=document.createElement("div");row.className="row";row.append(button(t.retry,()=>{selected={};render()}, "btn secondary"));if(!isReview&&unit<units.length-1)row.append(button(t.next,()=>{unit++;tab=0;selected={};render()}));if(isReview)row.append(button(t.retryWrong,()=>{selected={};render()}));host.append(row);for(const b of host.querySelectorAll(".choice"))b.disabled=true;for(const b of host.querySelectorAll("button"))if(b.textContent===t.submit)b.disabled=true;renderNavOnly()}, "btn"))}
function renderOptions(host,index){[...host.children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i===index)))}
function renderNavOnly(){const t=ui[lang],k=lang==="ko"?0:1;[...$("nav").children].forEach((b,i)=>b.textContent=(state.done[i]?"✓ ":"")+(i+1)+". "+units[i].title[k]);$("progressLabel").textContent=t.progress+": "+Object.keys(state.done).filter(x=>state.done[x]).length+" / "+units.length;$("progressBar").style.width=(Object.keys(state.done).filter(x=>state.done[x]).length/units.length*100)+"%"}
function renderReview(host){const items=[];for(const id of Object.keys(state.mistakes)){const [u,i]=id.split("-").map(Number);if(u===unit&&units[u]&&units[u].quiz[i])items.push({u,i,q:units[u].quiz[i]})}renderQuiz(host,items,true)}
$("filterLessons").addEventListener("input",()=>{const q=$("filterLessons").value.trim().toLocaleLowerCase();[...$("nav").children].forEach((b,i)=>{b.style.display=!q||((i+1)+". "+units[i].title[lang==="ko"?0:1]).toLocaleLowerCase().includes(q)?"":"none"})});$("lang").onchange=e=>{lang=e.target.value;localStorage.setItem("hs-language",lang);selected={};render()};if(new URLSearchParams(location.search).has("review")){tab=4;const first=Object.keys(state.mistakes||{}).find(id=>state.mistakes[id]&&/^\d+-\d+$/.test(id));if(first)unit=Math.min(units.length-1,Number(first.split("-")[0]))}render();
