const curriculum=[
{key:"basic",icon:"🌱",name:["기초 과정","Beginner"],desc:["한글 읽기부터 기본 회화까지","From Hangul to basic conversation"],lessons:[
{title:["한글 자음","Hangul Consonants"],desc:["기본 자음을 보고 소리를 들어보세요.","Learn the basic consonants and listen to their sounds."],examples:[["ㄱ","기역 / giyeok"],["ㄴ","니은 / nieun"],["ㄷ","디귿 / digeut"],["ㅁ","미음 / mieum"]],question:["'ㄴ'의 이름은 무엇인가요?","What is the name of 'ㄴ'?"],answers:["기역","니은","미음","디귿"],correct:1},
{title:["한글 모음","Hangul Vowels"],desc:["기본 모음을 익히고 발음해 보세요.","Practice the core Korean vowels."],examples:[["ㅏ","아 / a"],["ㅓ","어 / eo"],["ㅗ","오 / o"],["ㅜ","우 / u"]],question:["'ㅏ'를 어떻게 읽나요?","How do you pronounce 'ㅏ'?"],answers:["어","우","아","오"],correct:2},
{title:["글자 만들기","Building Syllables"],desc:["자음과 모음을 합쳐 한 글자를 만들어 보세요.","Combine consonants and vowels to make syllables."],examples:[["가","ㄱ + ㅏ / ga"],["나","ㄴ + ㅏ / na"],["고","ㄱ + ㅗ / go"],["무","ㅁ + ㅜ / mu"]],question:["ㄱ + ㅏ = ?","ㄱ + ㅏ = ?"],answers:["고","나","가","무"],correct:2},
{title:["기본 인사","Basic Greetings"],desc:["일상에서 쓰는 기본 인사말을 익혀보세요.","Learn greetings used in everyday situations."],examples:[["안녕하세요","Hello"],["감사합니다","Thank you"],["안녕히 가세요","Goodbye (to someone leaving)"],["네","Yes"]],question:["'Thank you'는 한국어로 무엇인가요?","How do you say 'Thank you' in Korean?"],answers:["안녕하세요","감사합니다","네","아니요"],correct:1},
{title:["자기소개","Introducing Yourself"],desc:["자신의 이름을 말하는 연습을 해보세요.","Practice saying your name."],examples:[["저는 민수예요.","I am Minsu."],["제 이름은 수지예요.","My name is Suji."],["만나서 반가워요.","Nice to meet you."],["저는 학생이에요.","I am a student."]],question:["'Nice to meet you.'는?","Which means 'Nice to meet you.'?"],answers:["감사합니다.","만나서 반가워요.","안녕히 가세요.","잘 먹겠습니다."],correct:1}]},
{key:"intermediate",icon:"🌿",name:["중급 과정","Intermediate"],desc:["문장 확장과 실생활 회화","Expand sentences and daily conversation"],lessons:[
{title:["주제 조사 은/는","Topic Markers 은/는"],desc:["받침에 따라 주제 조사를 선택합니다.","Choose the topic marker based on the final consonant."],examples:[["저는 학생이에요.","I am a student."],["책은 재미있어요.","The book is interesting."],["친구는 친절해요.","My friend is kind."]],question:["'저___ 학생이에요.'에 알맞은 조사는?","Choose the correct particle: '저___ 학생이에요.'"],answers:["은","는","을","이"],correct:1},
{title:["과거 시제","Past Tense"],desc:["이미 일어난 일을 말하는 연습입니다.","Talk about things that happened in the past."],examples:[["어제 영화를 봤어요.","I watched a movie yesterday."],["밥을 먹었어요.","I ate."],["학교에 갔어요.","I went to school."]],question:["'가요'의 과거형은?","What is the past form of '가요'?"],answers:["갔어요","갈 거예요","가세요","가고"],correct:0},
{title:["이유 말하기","Giving Reasons"],desc:["'-아서/어서'를 사용해 이유를 표현합니다.","Use -아서/어서 to explain a reason."],examples:[["배가 아파서 쉬었어요.","I rested because my stomach hurt."],["비가 와서 집에 있었어요.","I stayed home because it rained."],["피곤해서 일찍 잤어요.","I slept early because I was tired."]],question:["'피곤___ 일찍 잤어요.'에 알맞은 표현은?","Complete: '피곤___ 일찍 잤어요.'"],answers:["해서","에서","에게","부터"],correct:0},
{title:["미래 계획","Future Plans"],desc:["'-(으)ㄹ 거예요'로 계획을 말합니다.","Express future plans with -(으)ㄹ 거예요."],examples:[["내일 공부할 거예요.","I will study tomorrow."],["주말에 쉴 거예요.","I will rest on the weekend."],["친구를 만날 거예요.","I will meet a friend."]],question:["'내일 공부___.'의 자연스러운 완성은?","Complete: '내일 공부___.'"],answers:["했어요","할 거예요","하고 있어요","하세요"],correct:1},
{title:["부탁과 요청","Requests"],desc:["정중하게 도움을 요청하는 표현을 익힙니다.","Practice polite requests."],examples:[["도와주세요.","Please help me."],["천천히 말해 주세요.","Please speak slowly."],["사진을 찍어 주세요.","Please take a picture."]],question:["'Please speak slowly.'에 해당하는 문장은?","Which means 'Please speak slowly.'?"],answers:["빨리 오세요.","천천히 말해 주세요.","문을 닫으세요.","기다리지 마세요."],correct:1}]},
{key:"advanced",icon:"🌳",name:["고급 과정","Advanced"],desc:["논리적 표현과 고급 독해","Reasoning, nuanced expression and reading"],lessons:[
{title:["대조와 양보","Contrast & Concession"],desc:["'-지만', '-더라도'로 대조와 양보를 표현합니다.","Express contrast and concession with -지만 and -더라도."],examples:[["비싸지만 품질이 좋아요.","It is expensive, but the quality is good."],["비가 오더라도 갈 거예요.","I will go even if it rains."],["힘들지만 포기하지 않아요.","It is difficult, but I will not give up."]],question:["'비가 오___ 갈 거예요.'에 알맞은 말은?","Complete: '비가 오___ 갈 거예요.'"],answers:["더라도","면서","자마자","기 전에"],correct:0},
{title:["추측과 가능성","Inference & Possibility"],desc:["가능성을 조심스럽게 표현하는 방법을 배웁니다.","Practice nuanced expressions of possibility."],examples:[["늦을 수도 있어요.","It is possible that they will be late."],["이미 떠났을지도 몰라요.","They might have already left."],["그럴 가능성이 높아요.","That is highly likely."]],question:["'might have already left'에 가장 가까운 표현은?","Which means 'might have already left'?"],answers:["이미 떠났을지도 몰라요.","반드시 떠났어요.","지금 떠나세요.","떠나지 마세요."],correct:0},
{title:["의견과 근거","Opinions & Evidence"],desc:["의견을 제시하고 근거를 덧붙여 보세요.","Present a view and support it with reasons."],examples:[["제 생각에는 교육이 중요합니다.","In my opinion, education is important."],["그 이유는 다음과 같습니다.","The reasons are as follows."],["이 자료는 주장을 뒷받침합니다.","This evidence supports the claim."]],question:["'In my opinion'에 해당하는 표현은?","Which expression means 'In my opinion'?"],answers:["그럼에도 불구하고","제 생각에는","반면에","예를 들어"],correct:1},
{title:["뉴스 문장 읽기","Reading News Language"],desc:["보도문에 자주 나오는 표현을 익힙니다.","Explore common expressions in news reports."],examples:[["정부는 새 정책을 발표했습니다.","The government announced a new policy."],["전문가들은 변화를 전망했습니다.","Experts predicted changes."],["조사 결과가 공개됐습니다.","The survey results were released."]],question:["'발표했습니다'의 뜻은?","What does '발표했습니다' mean?"],answers:["announced","forgot","delayed","rejected"],correct:0},
{title:["격식 있는 표현","Formal Korean"],desc:["발표와 글쓰기에서 사용하는 격식체를 연습합니다.","Practice formal Korean for presentations and writing."],examples:[["검토해 주시기 바랍니다.","Please review it."],["의견을 말씀드리겠습니다.","I will share my opinion."],["협조해 주셔서 감사합니다.","Thank you for your cooperation."]],question:["가장 격식 있는 요청은?","Which is the most formal request?"],answers:["봐 줘.","좀 봐.","검토해 주시기 바랍니다.","봐 줄래?"],correct:2}]}];

{key:"beginner2",icon:"🌼",name:["초급 2","Beginner 2"],desc:["자기소개와 기본 회화","Introductions and everyday Korean"],lessons:originalBasic.lessons.slice(3)},

{key:"intermediate2",icon:"🍀",name:["중급 2","Intermediate 2"],desc:["이유·미래·요청 표현","Reasons, future plans, and requests"],lessons:originalMid.lessons.slice(2)},

const ui={ko:{roadTitle:"한국어 학습 로드맵 · 7단계",roadDesc:"국내 한국어 교육과정의 단계 구분을 참고해 입문부터 고급까지 이어지는 학습 체계를 설계했습니다. 아래 기초·중급·고급 카드를 선택하면 현재 제공되는 실습 단원으로 이동합니다.",roadSteps:["입문","초급 1","초급 2","중급 1","중급 2","고급 1","고급 2"],roadNote:"현재는 각 수준별 핵심 실습 단원을 제공하는 시제품입니다. 각 단계의 핵심 체험 단원이 제공됩니다. 전체 정규 교재와 강의는 순차적으로 확장할 예정입니다.",back:"← 메인 홈페이지",heroTitle:"한국어, 단계별로 제대로 배우세요",heroDesc:"기초부터 고급까지, 한국어 문장과 발음을 듣고 직접 문제를 풀며 연습하는 학습 공간입니다.",curriculum:"학습 목차",progress:"이 과정에서 완료한 학습",listen:"🔊 듣기",quiz:"학습 확인 문제",correct:"정답입니다! 잘했어요.",wrong:"다시 생각해 보세요.",next:"다음 학습 →",finish:"과정의 마지막 학습입니다",note:"이 페이지는 1차 학습 시제품입니다. 발음은 기기의 한국어 음성 합성 기능을 사용하며, 음성 품질은 기기마다 다를 수 있습니다. 진도는 이 브라우저에만 저장됩니다.",unit:"단원",done:"완료"},en:{roadTitle:"Korean Learning Roadmap · 7 Stages",roadDesc:"Inspired by Korean-language proficiency frameworks, this roadmap runs from Hangul foundations to advanced Korean. Select Beginner, Intermediate, or Advanced below to try the available lessons.",roadSteps:["Intro","Beginner 1","Beginner 2","Intermediate 1","Intermediate 2","Advanced 1","Advanced 2"],roadNote:"This is a working lesson prototype, a seven-stage starter course, with additional full-length lessons planned.",back:"← Main Website",heroTitle:"Learn Korean, Step by Step",heroDesc:"From beginner to advanced: listen to Korean, study practical expressions, and test your understanding.",curriculum:"Your Lessons",progress:"Lessons completed in this level",listen:"🔊 Listen",quiz:"Quick Check",correct:"Correct! Great job.",wrong:"Not quite. Try again.",next:"Next Lesson →",finish:"You've reached the final lesson",note:"This is an initial learning prototype. Audio uses your device's Korean text-to-speech voice, which may vary by device. Progress is saved only in this browser.",unit:"Lesson",done:"Done"}};
const $=id=>document.getElementById(id);
let lang=localStorage.getItem("hs-language")==="en"?"en":"ko",level=0,lesson=0,answered=false;
let completed;try{completed=JSON.parse(localStorage.getItem("hs-study-progress")||"{}")}catch(e){completed={}}
function speak(word){if(!("speechSynthesis" in window)){alert(lang==="ko"?"이 기기는 음성 재생을 지원하지 않습니다.":"Speech is not supported on this device.");return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(word);utter.lang="ko-KR";utter.rate=.82;speechSynthesis.speak(utter)}
function render(){const t=ui[lang];document.documentElement.lang=lang;$("lang").value=lang;$("back").textContent=t.back;$("heroTitle").textContent=t.heroTitle;$("heroDesc").textContent=t.heroDesc;$("roadTitle").textContent=t.roadTitle;$("roadDesc").textContent=t.roadDesc;$("roadNote").textContent=t.roadNote;const road=$("roadSteps");road.replaceChildren();t.roadSteps.forEach((v,i)=>{const x=document.createElement("div");x.className="roadstep";x.textContent=v;const sm=document.createElement("small");sm.textContent=i===0?"Hangul":i<3?"Basic":i<5?"Practical":"Advanced";x.append(sm);road.append(x)});$("curriculumTitle").textContent=t.curriculum;$("quizHeading").textContent=t.quiz;$("note").textContent=t.note;const levels=$("levels");levels.replaceChildren();curriculum.forEach((l,i)=>{const b=document.createElement("button");b.className="level"+(level===i?" active":"");b.innerHTML='<div class="symbol">'+l.icon+'</div><h2></h2><p></p><span class="pill"></span>';b.querySelector("h2").textContent=l.name[lang==="ko"?0:1];b.querySelector("p").textContent=l.desc[lang==="ko"?0:1];b.querySelector(".pill").textContent=l.lessons.length+" "+(lang==="ko"?"개 단원":"lessons");b.onclick=()=>{level=i;lesson=0;render();$("study").scrollIntoView({behavior:"smooth",block:"start"})};levels.append(b)});const l=curriculum[level],list=$("lessons");list.replaceChildren();let done=0;l.lessons.forEach((item,i)=>{if(completed[l.key+"-"+i])done++;const b=document.createElement("button");b.className="lessonbtn"+(lesson===i?" active":"");b.textContent=(i+1)+". "+item.title[lang==="ko"?0:1]+(completed[l.key+"-"+i]?" ✓":"");b.onclick=()=>{lesson=i;renderLesson();[...list.children].forEach((node,j)=>node.classList.toggle("active",j===lesson))};list.append(b)});$("progressLabel").textContent=t.progress+": "+done+"/"+l.lessons.length;$("progressBar").style.width=(100*done/l.lessons.length)+"%";renderLesson()}
function renderLesson(){const t=ui[lang],l=curriculum[level],item=l.lessons[lesson],k=lang==="ko"?0:1;[...$("lessons").children].forEach((node,j)=>node.classList.toggle("active",j===lesson));$("lessonTag").textContent=l.name[k].toUpperCase()+" · "+t.unit+" "+(lesson+1);$("lessonTitle").textContent=item.title[k];$("lessonDesc").textContent=item.desc[k];$("question").textContent=item.question[k];$("feedback").textContent="";$("next").textContent=lesson===l.lessons.length-1?t.finish:t.next;$("next").disabled=true;answered=false;const examples=$("examples");examples.replaceChildren();item.examples.forEach(pair=>{const e=document.createElement("div");e.className="example";const w=document.createElement("div");w.innerHTML='<div class="word"></div><div class="meaning"></div>';w.querySelector(".word").textContent=pair[0];w.querySelector(".meaning").textContent=pair[1];const b=document.createElement("button");b.className="speak";b.textContent=t.listen;b.onclick=()=>speak(pair[0]);e.append(w,b);examples.append(e)});const answers=$("answers");answers.replaceChildren();item.answers.forEach((a,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=a;b.onclick=()=>{if(answered)return;if(i===item.correct){answered=true;b.classList.add("correct");$("feedback").textContent=t.correct;completed[l.key+"-"+lesson]=true;try{localStorage.setItem("hs-study-progress",JSON.stringify(completed))}catch(e){}$("next").disabled=lesson===l.lessons.length-1;refreshProgress()}else{b.classList.add("wrong");$("feedback").textContent=t.wrong;setTimeout(()=>{b.classList.remove("wrong")},700)}};answers.append(b)})}
function refreshProgress(){const l=curriculum[level];let done=0;[...$("lessons").children].forEach((b,i)=>{if(completed[l.key+"-"+i]){done++;if(!b.textContent.endsWith(" ✓"))b.textContent+=" ✓"}});$("progressLabel").textContent=ui[lang].progress+": "+done+"/"+l.lessons.length;$("progressBar").style.width=(100*done/l.lessons.length)+"%"}
$("next").onclick=()=>{if(lesson<curriculum[level].lessons.length-1){lesson++;renderLesson();$("study").scrollIntoView({behavior:"smooth"})}};
$("lang").onchange=e=>{lang=e.target.value;localStorage.setItem("hs-language",lang);render()};
render();
</script></body></html>
