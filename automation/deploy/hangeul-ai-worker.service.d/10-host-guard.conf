[Unit]
RequiresMountsFor=/var/lib/hangeul-swipji
AssertPathIsMountPoint=/var/lib/hangeul-swipji

[Service]
Environment=HOME=/var/lib/hangeul-swipji/home
Environment=XDG_CONFIG_HOME=/var/lib/hangeul-swipji/home/.config
# Both the preflight guard AND the controller runner must be root-owned,
# non-writable host copies. The Codex agent may edit only HS_WORKTREE.
ExecStartPre=/usr/bin/bash /usr/local/libexec/hangeul-swipji/host-preflight.sh
WorkingDirectory=/opt/hangeul-swipji-controller
Environment=PYTHONPATH=/opt/hangeul-swipji-controller/automation
ExecStart=
ExecStart=/usr/bin/python3 -u /opt/hangeul-swipji-controller/automation/ai_agent_runner.py
