name: Team16 eight-language regression
on:
  push:
    branches:
      - team16/eight-language-ui-20261030
  workflow_dispatch:
jobs:
  language-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site-language.js
      - run: node growth/team16/test-site-language.cjs
