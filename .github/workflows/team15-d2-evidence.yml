name: Team15 D2 independent QA and evidence gates
on:
  push:
    branches: [qa/team15-d2-evidence-gates-20261028]
  workflow_dispatch:
jobs:
  evidence-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evidence gate unit tests
        run: python -m unittest discover -s scripts -p test_team15_d2_evidence_gate.py -v
      - name: Validate six-team D2 evidence inventory
        run: python scripts/team15_d2_evidence_gate.py qa/team15-d2-evidence.json
      - name: Checkout pinned team sources in isolated paths
        shell: bash
        run: |
          mkdir -p team11 team12 team13 team14
          for spec in \
            "team11 a2abc3c08ec0c4d245ae0be0670a1b47148f2e00" \
            "team12 edbf1d614e58f391ce2d63e3b3f0229370047c17" \
            "team13 2cf0cf1ed9bb33a2f22d3487dde33ba5c86091b2" \
            "team14 f40a925d6711b725cc0bc20e1ca3c7a68b3fa2c9"; do
            read -r dir sha <<< "$spec"
            git fetch origin "$sha"
            git archive "$sha" | tar -x -C "$dir"
          done
      - name: Verify pinned Team14 recovery and actual product contract modules
        run: |
          test -f team14/phase3/team14_recovery.py
          test -f team14/phase3/team14_initial_products.py
          test -f team14/phase3/test_team14_d2_catalog_http.py
          test -f team13/phase3/instant_matching.py
      - name: Existing Team15 continuous real HTTP SQLite regression
        env:
          PYTHONPATH: team11/phase3:team13/phase3:team14/phase3
        run: python scripts/test_team15_continuous_instant_e2e.py
      - name: Team12 education progress HTTP regression
        if: success() || failure()
        env:
          PYTHONPATH: team11/phase3
        run: |
          python - <<'PY'
          import server
          import sys, unittest
          sys.path.append("team12/phase3")
          suite = unittest.defaultTestLoader.loadTestsFromName("test_team12_progress_http.FreeProgressHTTPTests")
          outcome = unittest.TextTestRunner(verbosity=2).run(suite)
          if not outcome.wasSuccessful():
              sys.exit(1)
          PY
      - name: Team12 audio behavior and recording/TTS regression
        if: success() || failure()
        env:
          PYTHONPATH: team12/phase3
        run: |
          python team12/scripts/team12_content_regression.py
          node team12/scripts/team12_resume.test.js
      - name: Team13 immediate matching regression
        if: success() || failure()
        env:
          PYTHONPATH: team13/phase3
        run: python -m unittest discover -s team13/phase3 -p test_instant_matching.py -v
      - name: Team14 server product catalog and verified settlement contract
        if: success() || failure()
        env:
          PYTHONPATH: team13/phase3:team14/phase3
        run: |
          python -m unittest discover -s team14/phase3 -p test_team14_d2_catalog_http.py -v
          python -m unittest discover -s team14/phase3 -p test_team14_crash_recovery.py -v
