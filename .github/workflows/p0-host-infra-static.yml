name: P0 isolated host infrastructure static checks
on:
  pull_request:
    paths:
      - 'automation/deploy/**'
      - 'docs/P0_DURABLE_HOST_HANDOFF_20261031.md'
      - '.github/workflows/p0-host-infra-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-infra-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify shell syntax
        run: bash -n automation/deploy/host-preflight.sh
      - name: Verify systemd units
        run: systemd-analyze verify automation/deploy/hangeul-queue-sync.service automation/deploy/hangeul-queue-sync.timer
      - name: Verify trusted guard and effective push destination checks
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'AssertPathIsMountPoint=/var/lib/hangeul-swipji' automation/deploy/hangeul-queue-sync.service
          grep -F 'EnvironmentFile=/etc/hangeul-swipji/queue-sync.env' automation/deploy/hangeul-queue-sync.service
          grep -F 'ExecStart=/usr/bin/python3 -u /opt/hangeul-swipji-controller/automation/work_request_worker.py' automation/deploy/hangeul-queue-sync.service
          grep -F 'ExecStartPre=/usr/bin/bash /usr/local/libexec/hangeul-swipji/host-preflight.sh' automation/deploy/hangeul-ai-worker.service.d/10-host-guard.conf
          grep -F 'trusted=/usr/local/libexec/hangeul-swipji/host-preflight.sh' automation/deploy/host-preflight.sh
          grep -F '/usr/bin/env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY' automation/deploy/host-preflight.sh
          grep -F 'remote get-url --push --all origin' automation/deploy/host-preflight.sh
          grep -F 'remote get-url --all origin' automation/deploy/host-preflight.sh
          grep -F 'fetch_urls" == "$push_urls' automation/deploy/host-preflight.sh
          ! grep -R -E 'systemctl[[:space:]]+enable|systemctl[[:space:]]+start' automation/deploy --include='*.sh'
