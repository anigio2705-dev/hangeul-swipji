name: Save Korean Photo to Repository
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/save-korean-photo.yml'
permissions:
  contents: write
jobs:
  save-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Korean culture photo into repository
        run: |
          mkdir -p assets
          curl -fL --retry 3 --connect-timeout 20 'https://images.unsplash.com/photo-1517154421773-0529f29ea451?auto=format&fit=crop&w=2000&q=90' -o assets/korea-hero-photo.jpg
          file assets/korea-hero-photo.jpg
          test $(stat -c%s assets/korea-hero-photo.jpg) -gt 10000
      - name: Commit photo to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/korea-hero-photo.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Store Korean culture photo asset in repository"
            git push
          fi
