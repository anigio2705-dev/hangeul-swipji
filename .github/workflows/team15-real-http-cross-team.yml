name: Team15 nonproduction HTTP SQLite cross-team gate
on:
  push:
    branches:
      - integration/team15-e2e-run-20261028
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-http-and-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
      - uses: actions/checkout@v4
        with:
          ref: e39b9b0d205bf59bd1fe4fd430bd1732e05a5034
          path: team11
      - uses: actions/checkout@v4
        with:
          ref: edbf1d614e58f391ce2d63e3b3f0229370047c17
          path: team12
      - uses: actions/checkout@v4
        with:
          ref: fb5eb3a546a052d4043cbf75316abdc7f490eeae
          path: team13
      - uses: actions/checkout@v4
        with:
          ref: d40b197a7c9b9448e2b09cfd3de87f90b99f8cf4
          path: team14
      - uses: actions/checkout@v4
        with:
          ref: integration/team15-nonproduction-25th-20261028
          path: prior-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Real HTTP and SQLite signup progress teacher booking and completion gate
        run: python3 qa/scripts/test_team15_real_http_booking_boundary.py
      - name: Team12 browser-to-HTTP progress client regression
        run: |
          cd team12
          node --check scripts/team12_server_progress.js
          node scripts/team12_server_progress.test.js
      - name: Team13 backend regression
        run: python3 -m unittest discover -s team13/phase3 -p 'test_*.py' -v
      - name: Team11-Team14 real verified-event mock ledger and restart
        run: python3 prior-qa/scripts/test_team15_real_bridge.py
