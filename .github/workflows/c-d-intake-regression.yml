name: C D intake contract isolated regression
on:
  pull_request:
    paths:
      - 'automation/deploy/hub_request_intake.py'
      - 'automation/deploy/test_hub_intake_d_contract.py'
      - '.github/workflows/c-d-intake-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: D request parser, spoof and restart regression
        env:
          PYTHONPATH: automation/deploy
        run: python3 -m unittest discover -s automation/deploy -p 'test_hub_intake_d_contract.py' -v
