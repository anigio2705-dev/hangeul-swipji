name: Phase 3 isolated test platform
on:
  push:
    branches: ['phase3/**']
    paths: ['phase3/**', 'scripts/*ci*evidence.py', '.github/workflows/phase3-isolated-tests.yml']
  pull_request:
    paths: ['phase3/**', 'scripts/*ci*evidence.py', '.github/workflows/phase3-isolated-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_ci_evidence.py' -v
      - name: Prepare fresh CI evidence
        run: python scripts/ci-evidence.py prepare phase3 --output "$RUNNER_TEMP/phase3-evidence"
      - run: python -m unittest discover -s phase3 -p 'test_*.py' -v
      - run: node --check phase3/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: phase3/package-lock.json
      - run: npm ci --prefix phase3 --ignore-scripts
      - run: node phase3/postgres-test.cjs
      - run: ./phase3/node_modules/.bin/playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node phase3/browser-test.cjs
      - name: Collect this job's evidence
        if: always()
        run: python scripts/ci-evidence.py collect phase3 --output "$RUNNER_TEMP/phase3-evidence" --status "${{ job.status }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase3-evidence
          if-no-files-found: error
