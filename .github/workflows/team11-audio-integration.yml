name: Team11 audio integration regression (isolated)
on:
  push:
    branches:
      - team11/audio-gesture-20261030
      - audit/team15-tts-timeout-20261030-1233
    paths:
      - 'docs/team11/AUDIO_MOBILE_FAILURE_CASES_20261030.md'
      - 'docs/AI_TEAM_KNOWLEDGE/FAILURE/TEAM15_TTS_TIMEOUT_20261030.md'
      - 'docs/AI_TEAM_KNOWLEDGE/INDEX.md'
      - 'hangul-core.js'
      - 'hangul-board.js'
      - 'hangul-basics.html'
      - 'hangul-week.js'
      - 'hangul-week.html'
      - 'tests/team11_audio_user_activation.test.cjs'
      - '.github/workflows/team11-audio-integration.yml'
      - 'tests/team11_audio_surface_integration.test.cjs'
      - 'tests/team11_week_progress_storage.test.cjs'
      - 'scripts/check-audio-runtime.cjs'
      - 'scripts/check-foundations.cjs'
      - '.github/workflows/team11-audio-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 11-team persistent failure checkpoint
        run: test -s docs/team11/AUDIO_MOBILE_FAILURE_CASES_20261030.md
      - name: Validate Team15 independent RED/GREEN failure evidence
        run: |
          test -s docs/AI_TEAM_KNOWLEDGE/FAILURE/TEAM15_TTS_TIMEOUT_20261030.md
          grep -q '40998155238' docs/AI_TEAM_KNOWLEDGE/FAILURE/TEAM15_TTS_TIMEOUT_20261030.md
          grep -q '40998196056' docs/AI_TEAM_KNOWLEDGE/FAILURE/TEAM15_TTS_TIMEOUT_20261030.md
          grep -q 'TEAM15_TTS_TIMEOUT_20261030.md' docs/AI_TEAM_KNOWLEDGE/INDEX.md
      - name: Validate JavaScript syntax
        run: |
          node --check hangul-core.js
          node --check hangul-board.js
          node --check hangul-week.js
          node --check tests/team11_audio_user_activation.test.cjs
          node --check tests/team11_audio_surface_integration.test.cjs
          node --check tests/team11_week_progress_storage.test.cjs
      - name: Run 11-team opt-in and user gesture tests
        run: node --test tests/team11_audio_user_activation.test.cjs tests/team11_audio_surface_integration.test.cjs
      - name: Verify seven-day quiz progress persistence
        run: node --test tests/team11_week_progress_storage.test.cjs
      - name: Run legacy human audio runtime regression
        run: node scripts/check-audio-runtime.cjs
      - name: Run course and physical inventory regression
        run: node scripts/check-foundations.cjs
      - name: Save verification limitations
        if: always()
        run: |
          echo 'CI does not certify human pronunciation quality, real-device sound output, or staging99 deployment.' >> "$GITHUB_STEP_SUMMARY"
