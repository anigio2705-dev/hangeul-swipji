name: HQ2 READY shared read-only context regression (isolated)
on:
  push:
    branches:
      - audit/hq2-ready-shared-context-20261029-2100
    paths:
      - 'automation/hq_traffic_lights.py'
      - 'automation/test_hq_traffic_lights.py'
      - '.github/workflows/hq2-ready-shared-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-ready-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and independently exercise READY/collision regression
        run: |
          python -m py_compile automation/hq_traffic_lights.py automation/hq_160_task_cycle.py automation/test_hq_traffic_lights.py
          python -m unittest discover -s automation -p 'test_hq_traffic_lights.py' -v
          python -m unittest discover -s automation -p 'test_hq_160_task_cycle.py' -v
