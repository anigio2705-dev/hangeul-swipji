name: Phase 2 curriculum and page checks
on:
  push:
    branches: [main]
    paths:
      - 'intro.html'
      - 'beginner*.html'
      - 'intermediate*.html'
      - 'advanced*.html'
      - 'learn.html'
      - 'reading.html'
      - 'reading-curriculum.js'
      - 'hangul-core.js'
      - 'hangul-audio-manifest.json'
      - 'assets/hangul-audio/**'
      - 'scripts/check-audio-runtime.cjs'
      - 'hangul-*.html'
      - 'scripts/audit-350-lessons.cjs'
      - 'scripts/check-phase2-pages.cjs'
      - 'scripts/browser-smoke-phase2.cjs'
      - 'scripts/browser-audit-reading-600.cjs'
      - 'scripts/audit-phase2-content.cjs'
      - 'scripts/curriculum-source.cjs'
      - 'scripts/browser-audit-lessons.cjs'
      - '.github/workflows/phase2-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit 350 lessons and 1758 questions
        run: node scripts/audit-350-lessons.cjs
      - name: Verify audio failure and cancellation handling
        run: node scripts/check-audio-runtime.cjs
      - name: Check source pairs, all reading entries and preservation
        run: node scripts/audit-phase2-content.cjs
      - name: Check page structures and navigation shells
        run: node scripts/check-phase2-pages.cjs
      - name: Verify original curriculum and 7-day materials
        run: node scripts/check-foundations.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Desktop and mobile Chromium smoke test
        run: node scripts/browser-smoke-phase2.cjs
      - name: Audit all 600 reading entries and quizzes in Chromium
        run: node scripts/browser-audit-reading-600.cjs
      - name: Render every course unit in Korean and English
        run: node scripts/browser-audit-lessons.cjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-lesson-audit
          path: |
            phase2-lesson-audit.json
            audit/*.json
          if-no-files-found: ignore
