name: Team13 integration branch regression verification
on:
  push:
    branches:
      - integration/team13-instant-entry-20261030
    paths:
      - '.github/workflows/team13-regression.yml'
      - 'phase3/**'
      - 'index.html'
      - 'docs/team13/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original content commit is available
        run: git cat-file -e 7418e32^{commit} && git cat-file -e 7418e32:phase3/content.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run actual checkout Python tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s phase3 -p 'test_*.py' -q 2>&1 | tee team13-python.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team13-python-log
          path: team13-python.log
  original-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose baseline differences without weakening preservation gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, hashlib, json, pathlib
          base='7418e325f0833604249e5170c2531a103b31ff1c'
          paths=['intro.html','beginner1.html','beginner2.html','intermediate1.html','intermediate2.html','advanced1.html','advanced2.html','reading.html','reading-curriculum.js','reading-alternates.js','hangul-audio-manifest.json','index.html','phase3/content.json','phase3/content-expansion.json']
          result=[]
          for p in paths:
              before=subprocess.check_output(['git','show',base+':'+p])
              after=pathlib.Path(p).read_bytes()
              result.append({'path':p,'preserved':before==after,'baseline_sha256':hashlib.sha256(before).hexdigest(),'current_sha256':hashlib.sha256(after).hexdigest()})
          pathlib.Path('original-source-audit.json').write_text(json.dumps(result,indent=2)+'\\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: team13-original-source-diff
          path: original-source-audit.json
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned browser dependencies
        working-directory: phase3
        run: npm ci
      - name: Install Chromium
        working-directory: phase3
        run: npx playwright install --with-deps chromium
      - name: Run actual checkout instant browser tests
        run: |
          set -o pipefail
          node phase3/instant-browser-test.cjs 2>&1 | tee team13-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team13-browser-log
          path: |
            team13-browser.log
            audit/staging9-instant-results.json
