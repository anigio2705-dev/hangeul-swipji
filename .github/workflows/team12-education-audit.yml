name: Team12 education audit (read only)
on:
  workflow_dispatch:
  push:
    branches:
      - team12/education-audit-20261028
    paths:
      - 'scripts/team12_audio_inventory.py'
      - 'scripts/team12_content_regression.py'
      - 'hangul-core.js'
      - 'phase3/app.js'
      - 'index.html'
      - 'scripts/team12_learning_handoff.js'
      - 'scripts/team12_provider_links.js'
      - 'scripts/team12_provider_links.test.js'
      - 'learn.html'
      - 'dashboard.html'
      - 'scripts/team12_resume.js'
      - 'scripts/team12_resume.test.js'
      - 'scripts/team12_server_progress.js'
      - 'scripts/team12_server_progress.test.js'
      - 'phase3/test_team12_progress_http.py'
      - 'phase3/server.py'
      - 'phase3/test_server.py'
      - 'intro.html'
      - 'beginner1.html'
      - 'beginner2.html'
      - 'intermediate1.html'
      - 'intermediate2.html'
      - 'advanced1.html'
      - 'advanced2.html'
      - '.github/workflows/team12-education-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install audio decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check Python syntax
        run: python3 -m py_compile scripts/team12_audio_inventory.py
      - name: Check learner handoff JavaScript syntax
        run: |
          node --check scripts/team12_learning_handoff.js
          node --check scripts/team12_provider_links.js
          node scripts/team12_provider_links.test.js
          node --check scripts/team12_resume.js
          node scripts/team12_resume.test.js
          node --check scripts/team12_server_progress.js
          node scripts/team12_server_progress.test.js
          node --check phase3/app.js
          node --check hangul-core.js
      - name: Verify real HTTP and SQLite learner progress
        run: cd phase3 && python3 -m unittest test_team12_progress_http -v
      - name: Verify educational content structure
        run: python3 -m unittest discover -s scripts -p 'team12_content_regression.py' -v
      - name: Run physical audio audit
        run: |
          python3 scripts/team12_audio_inventory.py --root . --output audit/team12-recording-inventory.json
      - name: Save results without modifying repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team12-audio-inventory
          path: audit/team12-recording-inventory.json
          if-no-files-found: warn
