name: Team11 exact-source contract tests
on:
  push:
    branches:
      - team11/common-foundation-20261028
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual checkout and execute 31 contract and adapter tests
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          python -m unittest discover -s phase3 -p 'test_common_*.py' -v
