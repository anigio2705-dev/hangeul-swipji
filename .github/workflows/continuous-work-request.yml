name: Continuous work-request watchdog (pilot)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: hs-continuous-watchdog
  cancel-in-progress: false
jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify watchdog and durable worker handoff contracts
        run: PYTHONPATH=automation python -m unittest automation/test_continuous_dispatcher.py automation/test_work_request_worker.py automation/test_ai_agent_runner.py -v
      - name: Verify agent syntax
        run: python -m py_compile automation/ai_agent_runner.py automation/work_request_worker.py
      - name: Enqueue one outstanding work request
        env:
          GH_TOKEN: ${{ github.token }}
          # Manual dispatch remains dry-run. Scheduled execution only after default-branch merge.
          APPLY_QUEUE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: python automation/continuous_dispatcher.py
