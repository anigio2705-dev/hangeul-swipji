name: Team15 nonproduction executable integration (16th)
on:
  push:
    branches:
      - integration/team15-nonproduction-16th-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
      - uses: actions/checkout@v4
        with:
          ref: 7782200d58b28a35d3b5c1edb263f45452018863
          path: team11
      - uses: actions/checkout@v4
        with:
          ref: 8ba857591ba6c3ba9d892d5ec9c543c3b25a5939
          path: team12
      - uses: actions/checkout@v4
        with:
          ref: f6028d934d615f27d733b6fb7b8299ac1befc240
          path: team13
      - uses: actions/checkout@v4
        with:
          ref: da8933691d27dc50586a8b76a09d93c54fc08754
          path: team14
      - name: Independently rerun Team11 booking HTTP regression and full common suite
        run: |
          python3 -m unittest discover -s team11/phase3 -p 'test_common*.py' -v
      - name: Execute cross-team real functions and SQLite restart
        run: python3 qa/scripts/test_team15_real_bridge.py
      - name: Execute cross-team contract regression
        run: python3 qa/scripts/test_team15_boundaries.py
      - name: Execute source interface smoke
        run: python3 qa/scripts/team15_cross_team_smoke.py
