      - uses: actions/checkout@v4
        with:
          ref: 3b6bb3a0b2c033e626e959a8d216c48d2f14d428
          path: team12
      - uses: actions/checkout@v4
        with:
          ref: d74272a5fe4af87875e371a746d7a76f617e7ede
