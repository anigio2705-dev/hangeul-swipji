name: HQ 160 contract owner consistency
on:
  pull_request:
    branches:
      - automation/hq-pilot-13-14-15-20261029
    paths:
      - docs/HQ_160_DEVELOPMENT_CONTRACTS_20261029.md
      - automation/test_hq_contract_owner_consistency.py
      - .github/workflows/hq-owner-consistency.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 160 task owner IDs and negative cases
        run: python -m unittest automation/test_hq_contract_owner_consistency.py -v
      - name: State narrow evidence scope
        run: echo 'Owner metadata only. No READY promotion, AI calls, test99 deploy, or representative approval.' >> "$GITHUB_STEP_SUMMARY"
