name: HQ team12 board inventory independent gate
on:
  push:
    branches:
      - automation/hq-pilot-13-14-15-20261029
    paths:
      - scripts/team12_recording_plan.py
      - docs/team12/recording-plan-399.json
      - docs/team12/consonant-name-plan-19.json
      - scripts/team12_consonant_names.py
      - scripts/team12_missing_recording_script.py
      - docs/team12/missing-recording-script-359.json
      - automation/verify_task54.py
      - automation/verify_task43.cjs
      - automation/test_hq_160_task_cycle.py
      - hangul-core.js
      - hangul-board.js
      - hangul-audio-manifest.json
      - scripts/team12_content_regression.py
      - automation/hq_semantic_contract_paths.json
      - docs/HQ_160_DEVELOPMENT_CONTRACTS_20261029.md
      - .github/workflows/hq-team12-board-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hq-team12-board-inventory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-board-audit:
    if: github.ref == 'refs/heads/automation/hq-pilot-13-14-15-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check actual Hangul code syntax
        run: |
          node --check hangul-core.js
          node --check hangul-board.js
      - name: Independently reconcile live board and manifest
        run: python scripts/team12_recording_plan.py --check
      - name: Verify all 19 consonant-name buttons against actual manifest
        run: python scripts/team12_consonant_names.py --check
      - name: Reconcile missing 359 human recording prompts
        run: python scripts/team12_missing_recording_script.py --check
      - name: Independently exercise task 43 full alphabet board and click controls
        run: node automation/verify_task43.cjs
      - name: Independently verify task 54 semantics against live board
        run: python automation/verify_task54.py
      - name: Run existing education and audio inventory regression
        run: python scripts/team12_content_regression.py
      - name: Validate numbered contracts remain unchanged
        run: python -m unittest discover -s automation -p 'test_hq_160_task_cycle.py' -v
      - name: Distinguish code checks from listening approval
        if: always()
        run: |
          echo 'Board inventory CI is NOT human listening approval, mobile playback, public deployment, or 160-item final approval.' >> "$GITHUB_STEP_SUMMARY"
