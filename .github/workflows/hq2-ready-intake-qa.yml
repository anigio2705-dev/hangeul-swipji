name: HQ2 READY intake independent QA
on:
  push:
    branches:
      - audit/hq2-ready-intake-provenance-20261030-0057
  pull_request:
    paths:
      - 'automation/hq_traffic_lights.py'
      - 'automation/test_hq_traffic_lights.py'
      - '.github/workflows/hq2-ready-intake-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run queue intake and trusted runner regressions
        run: |
          set -euo pipefail
          python -m unittest discover -s automation -p 'test_hq_traffic_lights.py' -v
          python -m unittest discover -s automation -p 'test_hq_160_task_cycle.py' -v
          python -m unittest discover -s automation -p 'test_hq_six_developers.py' -v
          python -m py_compile automation/hq_traffic_lights.py automation/hq_160_task_cycle.py
          python automation/hq_traffic_lights.py --output /tmp/hq-ready-intake.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/hq-ready-intake.json'))
          ready = report['dispatch_readiness']
          assert ready['mapped_total'] >= 24
          assert set(ready['candidate_supply']) == {'11','12','13','14','15','16'}
          assert all(item['state'] == 'CANDIDATE' for entries in ready['candidate_supply'].values() for item in entries)
          print('mapped=', ready['mapped_total'], 'READY=', ready['dispatchable_total'])
          print('next candidates=', ready['candidate_supply_next'])
          PY
