name: HQ team11 isolated checkout preflight gate
on:
  push:
    branches: [automation/hq-team11-preflight-20261029]
    paths:
      - 'automation/hq_six_developers.py'
      - 'automation/test_hq_six_developers.py'
      - '.github/workflows/hq-team11-preflight.yml'
      - '.gitignore'
permissions:
  contents: read
jobs:
  preflight-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test dirty, stale and concurrent checkout rejection
        run: |
          python -m unittest discover -s automation -p 'test_hq_six_developers.py' -v
          python -m unittest discover -s automation -p 'test_hq_160_task_cycle.py' -v
      - name: Compile the trusted runner
        run: python -m py_compile automation/hq_six_developers.py
      - name: Verify real isolated checkout HEAD and clean worktree
        run: |
          git status --short --untracked-files=all
          python - <<'PY'
          import sys
          sys.path.insert(0, "automation")
          import hq_six_developers as runner
          # The same trusted check is exercised against the actual isolated
          # CI branch; production HQ_REF remains unchanged in source code.
          runner.HQ_REF = "automation/hq-team11-preflight-20261029"
          runner.require_clean_hq_checkout()
          print("Real git checkout clean and exact remote HEAD verified")
          PY
