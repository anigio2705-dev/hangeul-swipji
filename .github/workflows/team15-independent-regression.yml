name: Team15 independent regression (no deployment)
on:
  workflow_dispatch:
  push:
    branches:
      - team15/quality-operations-20261028
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout team15 QA
        uses: actions/checkout@v4
        with:
          path: qa
      - name: Checkout integration baseline
        uses: actions/checkout@v4
        with:
          ref: integration/phase2-phase3-20261027
          path: integration
      - name: Checkout Team11
        uses: actions/checkout@v4
        with:
          ref: team11/common-foundation-20261028
          path: team11
      - name: Checkout Team12
        uses: actions/checkout@v4
        with:
          ref: team12/education-audit-20261028
          path: team12
      - name: Checkout Team13
        uses: actions/checkout@v4
        with:
          ref: team13/platform-bfcache-reconnect-20261028
          path: team13
      - name: Checkout Team14
        uses: actions/checkout@v4
        with:
          ref: team14/business-systems-audit-20261028
          path: team14
      - name: Print exact SHA evidence
        run: |
          for d in qa integration team11 team12 team13 team14; do echo "$d $(git -C "$d" rev-parse HEAD)"; done
      - name: Run independent source gate
        run: python3 qa/scripts/team15_independent_gate.py
      - name: Team11 contract tests
        run: cd team11 && python3 -m unittest discover -s phase3 -p 'test_common_*.py' -v
      - name: Team12 inventory
        run: cd team12 && python3 scripts/team12_audio_inventory.py --root . --output /tmp/team12-inventory.json
      - name: Team13 matching tests
        run: cd team13 && python3 -m unittest discover -s phase3 -p 'test_instant_matching.py' -v
      - name: Team14 monthly mock tests
        run: cd team14 && python3 -m unittest discover -s phase3 -p 'test_team14_monthly*.py' -v
      - name: Integration baseline regressions
        run: cd integration && python3 -m unittest discover -s phase3 -p 'test_*.py' -v
      - name: Upload test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team15-inventory
          path: /tmp/team12-inventory.json
          if-no-files-found: ignore
