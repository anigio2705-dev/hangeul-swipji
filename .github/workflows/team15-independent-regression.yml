name: Team15 independent pinned regression (no deployment)
on:
  push:
    branches:
      - team15/quality-operations-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
      - uses: actions/checkout@v4
        with:
          ref: 2ca95fa1aa8206ec8763443d8256ab54ac789017
          path: integration
      - uses: actions/checkout@v4
        with:
          ref: 6c273e57f17db7baef265896b0019a2a3beaf338
          path: team11
      - uses: actions/checkout@v4
        with:
          ref: 3aed30eb9611f3e65a923c808605c6642f4d518e
          path: team12
      - uses: actions/checkout@v4
        with:
          ref: b0f39ef7a49dd34c7293a454980d79277a92c6e0
          path: team13
      - uses: actions/checkout@v4
        with:
          ref: b6a1b14638afb13d4fb1cf4863b8f93e2334fa43
          path: team14
      - name: Print pinned checkout SHAs
        run: for d in integration team11 team12 team13 team14; do echo "$d $(git -C "$d" rev-parse HEAD)"; done
      - name: Run independent source gate
        run: python3 qa/scripts/team15_independent_gate.py
      - name: Run cross-team interface smoke gate
        run: python3 qa/scripts/team15_cross_team_smoke.py
      - name: Run refund and team boundary contract checks
        run: python3 qa/scripts/test_team15_boundaries.py
      - name: Execute real Team11-Team14 mock ledger integration with SQLite persistence
        run: python3 qa/scripts/test_team15_real_bridge.py
  team11-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c273e57f17db7baef265896b0019a2a3beaf338
      - run: git rev-parse HEAD
      - run: python3 -m unittest discover -s phase3 -p 'test_common_*.py' -v
  team12-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3aed30eb9611f3e65a923c808605c6642f4d518e
      - run: git rev-parse HEAD
      - run: python3 -m py_compile scripts/team12_audio_inventory.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 scripts/team12_audio_inventory.py --root . --output audit/team12-recording-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team15-team12-audio-inventory
          path: audit/team12-recording-inventory.json
          if-no-files-found: warn
  team13-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b0f39ef7a49dd34c7293a454980d79277a92c6e0
          fetch-depth: 0
      - run: git rev-parse HEAD && git cat-file -e 7418e32:phase3/content.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -o pipefail
          python3 -m unittest discover -s phase3 -p 'test_*.py' -v 2>&1 | tee team13-python.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team15-team13-python-log
          path: team13-python.log
  team13-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b0f39ef7a49dd34c7293a454980d79277a92c6e0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: phase3
      - run: npx playwright install --with-deps chromium
        working-directory: phase3
      - run: |
          set -o pipefail
          node phase3/instant-browser-test.cjs 2>&1 | tee team13-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team15-team13-browser-log
          path: |
            team13-browser.log
            audit/staging9-instant-results.json
  team14-monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6a1b14638afb13d4fb1cf4863b8f93e2334fa43
      - run: git rev-parse HEAD
      - run: python3 -m unittest discover -s phase3 -p 'test_team14*.py' -v
  integration-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ca95fa1aa8206ec8763443d8256ab54ac789017
          fetch-depth: 0
      - run: git rev-parse HEAD
      - run: python3 -m unittest discover -s phase3 -p 'test_*.py' -v
