name: Team15 independent Issue34 receiver receipt-binding security
on:
  push:
    branches:
      - audit/team15-issue34-receipt-binding-20261030-1740
    paths:
      - 'automation/hq_issue34_receiver.py'
      - 'automation/test_hq_issue34_receiver.py'
      - 'automation/test_hq_issue34_receipt_binding.py'
      - '.github/workflows/team15-issue34-receipt-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-receiver-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing receiver contract and new receipt-binding regressions
        run: |
          python -m unittest discover -s automation -p 'test_hq_issue34_receiver.py' -v
          python -m unittest discover -s automation -p 'test_hq_issue34_receipt_binding.py' -v
      - name: Verify read-only permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/team15-issue34-receipt-binding.yml').read_text()
          assert '  contents: read' in workflow
          assert not any(line.strip() == 'issues: write' for line in workflow.splitlines())
          assert not any(line.strip().startswith('OPENAI_API_KEY:') for line in workflow.splitlines())
          print('Independent CI read-only; no model dispatch, READY promotion or deploy')
          PY
