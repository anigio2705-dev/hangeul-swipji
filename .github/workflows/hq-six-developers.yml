name: HQ six parallel AI developers (isolated)
on:
  push:
    branches:
      - automation/hq-pilot-13-14-15-20261029
    paths:
      - 'automation/hq_semantic_contract_paths.json'
  workflow_dispatch:
    inputs:
      chain_depth:
        description: 'Bounded autonomous continuation depth (0-23)'
        required: false
        default: '0'
      repair_instructions_json:
        description: 'Bounded team-specific repair feedback JSON'
        required: false
        default: '{}'
      teams_json:
        description: 'Only run eligible team IDs; avoid repeat spending on idle teams'
        required: false
        default: '["11","12","13","14","15","16"]'
concurrency:
  group: hq-160-single-dispatch-lane
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  develop:
    if: github.ref == 'refs/heads/automation/hq-pilot-13-14-15-20261029'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        team: ${{ fromJSON(inputs.teams_json || '["11","12","13","14","15","16"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: hq-ai-pilot
    concurrency:
      group: hq-team-${{ matrix.team }}-isolated-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Validate numbered backlog contracts before spending API
        run: |
          python -m unittest discover -s automation -p 'test_hq_160_task_cycle.py' -v
          python -m unittest discover -s automation -p 'test_hq_six_developers.py' -v
      - name: Copy trusted runner and canonical task contracts outside working tree
        run: |
          cp automation/hq_six_developers.py /tmp/hq_six_developers.py
          cp automation/hq_160_task_cycle.py /tmp/hq_160_task_cycle.py
          cp automation/hq_traffic_lights.py /tmp/hq_traffic_lights.py
          cp automation/hq_semantic_contract_paths.json /tmp/hq_semantic_contract_paths.json
          cp automation/hq_backlog_160.md /tmp/hq_backlog_160.md
          cp automation/task-evidence.json /tmp/hq-task-evidence.json
      - name: Run isolated AI developer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HQ_TEAM: ${{ matrix.team }}
          HQ_MAX_CALLS: '2'
          HQ_REPAIR_INSTRUCTIONS: ${{ inputs.repair_instructions_json || '{}' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, time
          deadline = time.monotonic() + 45 * 60
          history = []
          for round_no in range(1, 3):
              if time.monotonic() >= deadline:
                  break
              result_file = pathlib.Path("/tmp/team-result.json")
              result_file.unlink(missing_ok=True)
              run = subprocess.run(["python", "/tmp/hq_six_developers.py"])
              if run.returncode or not result_file.exists():
                  history.append({"team": os.environ.get("HQ_TEAM", "unknown"), "calls": 0,
                                  "tasks": [], "status": "BLOCKED",
                                  "reason": "runner_failed_or_result_missing", "round": round_no})
                  print("Runner BLOCKED; preserving evidence for supervisor", flush=True)
                  break
              result = json.loads(result_file.read_text())
              result["round"] = round_no
              history.append(result)
              committed = sum(t.get("status") == "committed" for t in result.get("tasks", []))
              print(f"Round {round_no}: committed={committed}, calls={result.get('calls')}", flush=True)
              if committed == 0:
                  print("No verified progress; stop this team to prevent repeated spending", flush=True)
                  break
          pathlib.Path("/tmp/team-result.json").write_text(json.dumps({
              "team": history[0]["team"] if history else "unknown",
              "rounds": history,
              "tasks": [t for x in history for t in x.get("tasks", [])],
              "calls": sum(x.get("calls", 0) for x in history),
              "team_runner_elapsed_seconds": round(sum(float(x.get("elapsed_seconds", 0)) for x in history), 1),
              "manual_site_review_seconds": None,
              "manual_representative_review_seconds": None,
              "committed": sum(t.get("status") == "committed" for x in history for t in x.get("tasks", []))
          }, indent=2))
          PY
      - name: Save team result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-${{ matrix.team }}-development
          path: /tmp/team-result.json
          if-no-files-found: ignore
          retention-days: 7

  supervise:
    needs: develop
    if: always() && github.ref == 'refs/heads/automation/hq-pilot-13-14-15-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: hq-six-cycle-supervisor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all six submitted team results
        uses: actions/download-artifact@v4
        with:
          pattern: team-*-development
          path: ${{ runner.temp }}/team-results
          merge-multiple: false
      - name: Test actual supervisor dispatch/repair gates
        run: python -m unittest discover -s automation -p 'test_hq_six_cycle_supervisor.py' -v
      - name: Independently verify actual commits and dispatch only on progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          HQ_DEPTH: ${{ inputs.chain_depth || '0' }}
          HQ_REPAIR: ${{ inputs.repair_instructions_json || '{}' }}
        run: |
          python automation/hq_six_cycle_supervisor.py \
            --root "$RUNNER_TEMP/team-results" \
            --depth "$HQ_DEPTH" \
            --repairs "$HQ_REPAIR" \
            --output "$RUNNER_TEMP/hq-six-cycle-verdict.json"
      - name: Evaluate HQ traffic lights across all 160 tasks
        if: always()
        run: |
          python automation/hq_traffic_lights.py --output "$RUNNER_TEMP/hq-traffic-lights.json"
          cat "$RUNNER_TEMP/hq-traffic-lights.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish timestamped numbered verdicts in GitHub Actions summary
        if: always()
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "hq-six-cycle-verdict.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Six-team HQ verified cycle\n\n")
              f.write("Checked UTC: " + datetime.datetime.now(datetime.timezone.utc).isoformat() + "\n\n")
              if not p.exists():
                  f.write("Supervisor report missing: FAIL, no completion credit.\n")
              else:
                  report = json.loads(p.read_text())
                  for team, verdicts in report["team_verdicts"].items():
                      if not verdicts:
                          f.write(f"- Team {team}: no submitted numbered change\n")
                      for v in verdicts:
                          f.write(f"- Team {team}, #{v.get('task_number')}: {v['verdict']} — {v['reason']}\n")
                  f.write(f"\nStaged pending CI: {report['staged_pending_CI']}\n")
                  f.write(f"Promoted code-verified: {report['promoted_code_verified']}\n")
                  f.write(f"Next dispatched: {report['dispatched_next']} — {report['next_reason']}\n")
                  f.write("Final 160-item completion: NOT established by this run.\n")
          PY
      - name: Save real six-team verification and next action
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq-six-cycle-verdict
          path: ${{ runner.temp }}/hq-six-cycle-verdict.json
          if-no-files-found: warn
          retention-days: 14
