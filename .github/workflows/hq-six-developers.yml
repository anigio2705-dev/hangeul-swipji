name: HQ six parallel AI developers (isolated)
on:
  push:
    branches: [automation/hq-pilot-13-14-15-20261029]
    paths:
      - 'automation/hq_six_developers.py'
      - '.github/workflows/hq-six-developers.yml'
  workflow_dispatch:
    inputs:
      chain_depth:
        description: 'Bounded autonomous continuation depth (0-2)'
        required: false
        default: '0'
permissions:
  contents: write
  actions: write
jobs:
  develop:
    if: github.ref == 'refs/heads/automation/hq-pilot-13-14-15-20261029'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        team: ['11','12','13','14','15','16']
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: hq-ai-pilot
    concurrency:
      group: hq-team-${{ matrix.team }}-isolated-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Copy trusted runner outside working tree
        run: cp automation/hq_six_developers.py /tmp/hq_six_developers.py
      - name: Run isolated AI developer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HQ_TEAM: ${{ matrix.team }}
          HQ_MAX_CALLS: '4'
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python /tmp/hq_six_developers.py
      - name: Save team result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-${{ matrix.team }}-development
          path: /tmp/team-result.json
          if-no-files-found: ignore
          retention-days: 7
  continue_if_progress:
    needs: develop
    if: ${{ always() && needs.develop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve six independent team reports
        uses: actions/download-artifact@v4
        with:
          pattern: team-*-development
          path: reports
      - name: Continue automatically only after real progress
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPTH: ${{ inputs.chain_depth || '0' }}
          REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          depth = int(os.environ["DEPTH"])
          if depth < 0 or depth >= 2:
              print("Chain limit reached; no further API spending")
              raise SystemExit(0)
          reports = list(pathlib.Path("reports").rglob("team-result.json"))
          if len(reports) != 6:
              print("Incomplete evidence; refusing automatic continuation")
              raise SystemExit(0)
          completed = sum(sum(t.get("status") == "committed" for t in json.loads(p.read_text()).get("tasks", [])) for p in reports)
          print(f"Verified committed tasks: {completed}; chain depth: {depth}")
          if completed == 0:
              print("No progress; stop to avoid waste")
              raise SystemExit(0)
          if os.environ["REF"] != "automation/hq-pilot-13-14-15-20261029":
              raise SystemExit("Unauthorized ref")
          payload = json.dumps({"ref": os.environ["REF"], "inputs": {"chain_depth": str(depth+1)}})
          subprocess.run(["gh", "api", "--method", "POST",
              f"repos/{os.environ['GH_REPO']}/actions/workflows/hq-six-developers.yml/dispatches",
              "--input", "-"], input=payload, text=True, check=True)
          print("Next six-team development round dispatched automatically")
          PY
