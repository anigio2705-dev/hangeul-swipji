name: HQ isolated autonomous development (bounded)
on:
  push:
    branches: [automation/hq-pilot-13-14-15-20261029]
    paths:
      - 'automation/hq_developer.py'
      - '.github/workflows/hq-developer.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hq-isolated-developer
  cancel-in-progress: false
jobs:
  develop:
    if: github.ref == 'refs/heads/automation/hq-pilot-13-14-15-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: hq-ai-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure isolated bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run real bounded development tasks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python automation/hq_developer.py --max-seconds 3000 --max-calls 2
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq-developer-evidence
          path: automation/developer-result.json
          if-no-files-found: ignore
          retention-days: 7
