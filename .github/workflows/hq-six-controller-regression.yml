name: HQ six-team controller regression (isolated)
on:
  push:
    branches:
      - automation/hq-pilot-13-14-15-20261029
    paths:
      - automation/hq_160_task_cycle.py
      - automation/hq_six_cycle_supervisor.py
      - automation/test_hq_160_task_cycle.py
      - automation/test_hq_six_cycle_supervisor.py
      - .github/workflows/hq-six-developers.yml
      - .github/workflows/hq-six-controller-regression.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hq-six-controller-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controller-tests:
    if: github.ref == 'refs/heads/automation/hq-pilot-13-14-15-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile controller modules
        run: python -m py_compile automation/hq_160_task_cycle.py automation/hq_six_cycle_supervisor.py automation/hq_six_developers.py
      - name: Verify all 160 contracts and pending CI guard
        run: python -m unittest discover -s automation -p 'test_hq_160_task_cycle.py' -v
      - name: Verify six-team targeted retry and dispatch gates
        run: python -m unittest discover -s automation -p 'test_hq_six_cycle_supervisor.py' -v
      - name: Verify bounded AI patch safety
        run: python -m unittest discover -s automation -p 'test_hq_six_developers.py' -v

      - name: Independently verify team15 gate rejects every cross-team overlap
        run: |
          git fetch --depth=1 origin refs/heads/automation/hq-team-15-autodev-20261029
          git show FETCH_HEAD:scripts/team15_independent_gate.py > /tmp/team15_independent_gate.py
          python -m py_compile /tmp/team15_independent_gate.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("/tmp/team15_independent_gate.py").read_text()
          tree = ast.parse(source)
          checks = [n for n in ast.walk(tree) if isinstance(n, ast.If)
                    and isinstance(n.test, ast.Name) and n.test.id == "common"]
          if len(checks) != 1:
              raise SystemExit("Expected exactly one overlap decision")
          body = checks[0].body
          direct_failure = any(
              isinstance(n, ast.Expr) and isinstance(n.value, ast.Call)
              and isinstance(n.value.func, ast.Attribute)
              and isinstance(n.value.func.value, ast.Name)
              and n.value.func.value.id == "failures"
              and n.value.func.attr == "append"
              for n in body)
          if not direct_failure:
              raise SystemExit("FAIL: overlap detection can be bypassed by an inner filter")
          snippet = ast.fix_missing_locations(ast.Module(body=[checks[0]], type_ignores=[]))
          for files, expected in [(["unlisted/shared.py"], 1), ([], 0)]:
              scope = {"common": files, "left": "11", "right": "13", "failures": []}
              exec(compile(snippet, "<team15-overlap>", "exec"), scope)
              if len(scope["failures"]) != expected:
                  raise SystemExit("FAIL: overlapping edits were not rejected")
          print("PASS: all overlapping changes rejected, including unlisted files")
          PY

      - name: Publish actual controller test verdict to isolated branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HQ_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import base64, datetime, json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          url = "https://api.github.com/repos/anigio2705-dev/hangeul-swipji/contents/automation/hq-controller-regression-result.json"
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "Content-Type": "application/json"}
          ref = "automation/hq-pilot-13-14-15-20261029"
          result = {
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_url": "https://github.com/anigio2705-dev/hangeul-swipji/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "source_sha": os.environ["GITHUB_SHA"],
              "test_status": os.environ["HQ_JOB_STATUS"],
              "checked_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "note": "Controller unit/compile tests only; not real website verification or 160-item completion"
          }
          for attempt in range(3):
              try:
                  with urlopen(Request(url + "?ref=" + ref.replace("/", "%2F"), headers=headers), timeout=20) as response:
                      existing = json.load(response)
                  sha = existing["sha"]
              except HTTPError as exc:
                  if exc.code != 404:
                      raise
                  sha = None
              payload = {"branch": ref, "message": "ci(hq): record isolated controller regression verdict",
                         "content": base64.b64encode((json.dumps(result, indent=2) + "\\n").encode()).decode()}
              if sha:
                  payload["sha"] = sha
              try:
                  with urlopen(Request(url, data=json.dumps(payload).encode(), method="PUT", headers=headers), timeout=30):
                      print("Published controller test status and run ID")
                  break
              except HTTPError as exc:
                  if exc.code not in (409, 422) or attempt == 2:
                      raise
          PY
