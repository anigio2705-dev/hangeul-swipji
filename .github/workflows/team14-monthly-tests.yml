name: Team14 isolated monthly tests
on:
  push:
    branches:
      - team14/business-systems-audit-20261028
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check first (fail fast)
        run: |
          python -m compileall -q phase3/team14_monthly_sim.py phase3/test_team14_monthly_sim.py phase3/test_team14_monthly_boundaries.py phase3/team14_persistent.py phase3/test_team14_persistent.py phase3/team14_booking_events.py phase3/test_team14_booking_events.py phase3/team14_referral_scenarios.py phase3/test_team14_referral_scenarios.py phase3/test_team14_ninth_pass.py phase3/team14_verified_bridge.py phase3/test_team14_verified_bridge.py phase3/test_team14_completed_refunds.py phase3/test_team14_refund_event_validation.py phase3/team14_statements.py phase3/team14_referral_eligibility.py phase3/test_team14_statements_referral.py phase3/team14_referral_store.py phase3/test_team14_referral_store.py phase3/team14_internal_event_consumer.py phase3/test_team14_internal_event_consumer.py phase3/team14_settlement_coordinator.py phase3/test_team14_settlement_coordinator.py phase3/team14_event_reconciliation.py phase3/test_team14_event_reconciliation.py phase3/team14_team11_db_adapter.py phase3/test_team14_team11_db_adapter.py phase3/team14_server_db_wiring.py phase3/test_team14_server_db_wiring.py phase3/test_team14_actual_schema_integration.py
      - name: Run all original and new Team14 tests
        run: |
          git rev-parse HEAD
          python -m unittest discover -s phase3 -p 'test_team14_monthly*.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_persistent.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_booking_events.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_referral_scenarios.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_ninth_pass.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_verified_bridge.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_completed_refunds.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_refund_event_validation.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_statements_referral.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_referral_store.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_internal_event_consumer.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_settlement_coordinator.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_event_reconciliation.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_team11_db_adapter.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_server_db_wiring.py' -v
          python -m unittest discover -s phase3 -p 'test_team14_actual_schema_integration.py' -v
