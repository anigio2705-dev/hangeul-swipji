name: HQ2 isolated referral graph complexity QA
on:
  push:
    branches:
      - audit/hq2-referral-linear-20261029-2305
    paths:
      - phase3/team14_referral_scenarios.py
      - phase3/test_team14_referral_scenarios.py
      - .github/workflows/hq2-referral-linear-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  referral-linear:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run actual scenario and referral store regression suite
        run: python -m unittest discover -s phase3 -p 'test_team14_referral*.py' -v
