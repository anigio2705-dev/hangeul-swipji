name: HQ dynamic READY dispatch regression (isolated)
on:
  push:
    branches: [automation/hq-pilot-13-14-15-20261029]
    paths:
      - 'automation/hq_160_task_cycle.py'
      - 'automation/hq_traffic_lights.py'
      - 'automation/test_hq_160_task_cycle.py'
      - 'automation/test_task143_language_contract.py'
      - 'automation/test_hq_traffic_lights.py'
      - 'automation/hq_semantic_contract_paths.json'
      - '.github/workflows/hq-ready-dispatch-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ready-dispatch:
    if: github.ref == 'refs/heads/automation/hq-pilot-13-14-15-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 160-contract dispatcher and independent readiness gate
        run: |
          python -m unittest discover -s automation -p 'test_hq_160_task_cycle.py' -v
          python -m unittest discover -s automation -p 'test_hq_traffic_lights.py' -v
          python -m unittest discover -s automation -p 'test_task143_language_contract.py' -v
      - name: Reconcile actual READY inventory without promoting any task
        run: |
          python automation/hq_traffic_lights.py --output /tmp/hq-ready-audit.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/hq-ready-audit.json'))
          q=data['dispatch_readiness']
          print('READY dispatchable:',q['dispatchable_total'])
          print('CODE_VERIFIED:',data['code_verified'],'FINAL:',data['final_complete'])
          assert data['final_complete'] <= data['code_verified'] <= 160
          PY
      - name: Preserve acceptance limits
        if: always()
        run: |
          echo 'Passing a synthetic READY dispatcher test is not a real AI call, a bot commit, a new READY task, a deployed feature, or final owner approval.' >> "$GITHUB_STEP_SUMMARY"
