name: HQ Hangul human-audio runtime tests (isolated)
on:
  push:
    branches: [automation/hq-pilot-13-14-15-20261029]
    paths:
      - 'hangul-core.js'
      - 'hangul-audio-review.js'
      - 'hangul-audio-audit.json'
      - 'scripts/check-audio-review.cjs'
      - 'hangul-audio-manifest.json'
      - 'hangul-audio-human-only.json'
      - 'hangul-week-data.js'
      - 'assets/hangul-audio/**'
      - 'hangul-board.js'
      - 'hangul-week.js'
      - 'hangul-basics.html'
      - 'hangul-week.html'
      - 'scripts/check-audio-runtime.cjs'
      - 'scripts/team12_audio_inventory.py'
      - 'scripts/test_team12_audio_inventory.py'
      - 'scripts/check-human-audio.cjs'
      - 'scripts/check-week-human-audio.cjs'
      - 'scripts/check-foundations.cjs'
      - '.github/workflows/hq-audio-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-runtime:
    if: github.ref == 'refs/heads/automation/hq-pilot-13-14-15-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test human-only audio playback, failures and manifest refresh
        run: |
          node scripts/check-audio-runtime.cjs
          node scripts/check-audio-review.cjs
          node scripts/check-human-audio.cjs
          node scripts/check-week-human-audio.cjs
      - name: Test physical recording integrity and quarantine classification
        run: python3 -m unittest discover -s scripts -p 'test_team12_audio_inventory.py' -v
      - name: Ensure physical MP3 decoder is available
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Audit real recording files, hashes and human provenance
        run: python3 scripts/team12_audio_inventory.py --root . --output "$RUNNER_TEMP/hq-audio-inventory.json"
      - name: Save physical recording inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq-audio-inventory
          path: ${{ runner.temp }}/hq-audio-inventory.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Test 350 lessons and seven-day curriculum regression
        run: node scripts/check-foundations.cjs
      - name: State validation limits
        run: |
          echo 'Runtime and content tests only; no missing human recordings were generated.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No browser audio listening approval, production deployment, or mobile test was performed.' >> "$GITHUB_STEP_SUMMARY"
