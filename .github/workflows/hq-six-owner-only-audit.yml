name: HQ six owner-only dispatch regression (isolated)
on:
  push:
    branches:
      - audit/hq-six-owner-only-dispatch-20261030-0334
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile automation/hq_six_developers.py automation/test_hq_six_developers.py
      - name: Run bounded runner regressions
        run: python -m unittest discover -s automation -p 'test_hq_six_developers.py' -v
      - name: Run 160-task owner and READY regressions
        run: python -m unittest discover -s automation -p 'test_hq_160_task_cycle.py' -v
