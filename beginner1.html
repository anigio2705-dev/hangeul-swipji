<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초급 1 집중 학습 | 한글쉽지</title><style>
:root{--blue:#315de5;--ink:#172944;--line:#dfe7f3}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #91b7ff;outline-offset:2px}a{text-decoration:none;color:inherit}.wrap{max-width:1000px;margin:auto;padding:0 20px}header{background:white;border-bottom:1px solid var(--line)}header .wrap{display:flex;gap:20px;align-items:center;min-height:75px}.logo{font-size:23px;font-weight:900;color:var(--blue)}.back{margin-left:auto;color:var(--blue);font-weight:750;font-size:13px}select{border:1px solid var(--line);background:white;padding:9px;border-radius:9px}.hero{margin:26px 0;background:linear-gradient(110deg,#142c5a,#315de5);color:white;border-radius:19px;padding:30px}.hero h1{font-size:32px;margin:8px 0}.hero p{color:#dce6ff;line-height:1.7}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;margin:20px 0}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:23px;margin-bottom:20px}.nav{display:grid;gap:8px}.nav button{border:1px solid var(--line);background:#fff;text-align:left;padding:13px;border-radius:10px}.nav button.active{background:#eaf0ff;border-color:var(--blue);color:#244bbd;font-weight:850}.bar{height:8px;background:#e6edfa;border-radius:20px;overflow:hidden;margin:13px 0}.bar div{height:100%;background:var(--blue)}.muted{color:#63758d;font-size:13px;line-height:1.7}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.tabs button{padding:10px 12px;background:#f0f3fa;border:0;border-radius:9px;color:#435a7a}.tabs button.active{background:#315de5;color:white;font-weight:850}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;border:1px solid var(--line);background:#fbfcff;border-radius:11px;padding:13px;margin:9px 0}.item strong{display:block;font-size:18px}.item span{display:block;color:#64758a;font-size:13px;margin-top:4px}.listen{background:#eaf0ff;color:#315de5;border:1px solid #cedbf9;border-radius:9px;padding:9px 12px;font-weight:750}.grammar{padding:15px;border-left:4px solid var(--blue);background:#f2f6ff;border-radius:8px;line-height:1.8}.question{font-size:18px;font-weight:800;line-height:1.6;margin:17px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#fff;border:1px solid #dbe4f3;border-radius:10px;padding:13px;text-align:left;line-height:1.6}.choice[aria-pressed=true]{background:#e9efff;border:2px solid #315de5}.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:12px 17px;font-weight:800}.btn:disabled{background:#aab8d0;cursor:not-allowed}.secondary{background:#fff;color:#315de5;border:1px solid #bacdf2}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:18px}.feedback{min-height:25px;font-weight:750;font-size:13px;margin-top:13px}.mistake{border-bottom:1px solid var(--line);padding:13px 0;line-height:1.7;font-size:14px}.warning{font-size:12px;color:#7d6940;background:#fff9e8;padding:14px;border-radius:10px;margin:20px 0 50px}@media(max-width:720px){.layout{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style></head><body><header><div class="wrap"><a class="logo" href="./">한글쉽지</a><a class="back" href="./learn.html?level=1" id="back"></a><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></div></header><main class="wrap"><div class="hero"><small>BEGINNER 1 · LEARNING LAB</small><h1 id="title"></h1><p id="intro"></p></div><div class="layout"><aside class="panel"><h3 id="listTitle"></h3><div class="muted" id="progressLabel"></div><div class="bar"><div id="progressBar"></div></div><div class="nav" id="nav"></div></aside><div><section class="panel"><h2 id="lessonTitle"></h2><p class="muted" id="lessonDesc"></p><div class="tabs" id="tabs"></div><div id="content"></div></section></div></div><p class="warning" id="warning"></p></main><script>
"use strict";
const units=[
{title:["인사와 소개","Greetings and Introductions"],desc:["첫 만남에서 쓰는 기본 표현","Useful expressions when meeting someone"],v:[["안녕하세요","Hello"],["감사합니다","Thank you"],["이름","Name"],["학생","Student"],["선생님","Teacher"],["반갑습니다","Nice to meet you"]],sent:[["안녕하세요. 저는 민수예요.","Hello. I am Minsu."],["제 이름은 수지예요.","My name is Suji."],["만나서 반갑습니다.","Nice to meet you."]],grammar:[["'저는'의 '는'은 화제를 나타내는 조사입니다. 받침이 없는 명사 뒤에는 '는', 받침이 있는 명사 뒤에는 '은'을 씁니다.","The topic marker '는' follows nouns without a final consonant, while '은' follows nouns with a final consonant."],["저는 학생이에요. / 책은 재미있어요.","I am a student. / The book is interesting."]],quiz:[["'Thank you'는 한국어로?","How do you say 'Thank you'?",["안녕하세요","감사합니다","안녕히 가세요","괜찮아요"],1],["'저___ 학생이에요.' 알맞은 조사는?","Choose the correct particle: '저___ 학생이에요.'",["은","는","을","이"],1],["'Nice to meet you.'에 맞는 표현은?","Which expression means 'Nice to meet you'?",["잘 먹겠습니다","만나서 반갑습니다","안녕히 가세요","죄송합니다"],1]]},
{title:["가족과 사람","Family and People"],desc:["가족 구성원과 사람을 소개하기","Describe family members and people"],v:[["가족","Family"],["어머니","Mother"],["아버지","Father"],["형","Older brother (male speaker)"],["언니","Older sister (female speaker)"],["친구","Friend"]],sent:[["우리 가족은 네 명이에요.","There are four people in my family."],["이분은 제 어머니예요.","This is my mother."],["저 사람은 제 친구예요.","That person is my friend."]],grammar:[["'이에요/예요'는 명사를 설명하거나 정체를 밝힐 때 씁니다. 받침이 있으면 '이에요', 없으면 '예요'입니다.","Use '이에요/예요' to identify someone or something. Use '이에요' after a final consonant and '예요' otherwise."],["학생이에요. / 친구예요.","(I am) a student. / (They are) a friend."]],quiz:[["'어머니'의 뜻은?","What does '어머니' mean?",["Father","Mother","Friend","Teacher"],1],["'친구___.' 알맞은 말은?","Complete '친구___.'",["이에요","예요","을","에서"],1],["'This is my mother.'에 해당하는 문장은?","Which means 'This is my mother'?",["이분은 제 어머니예요.","이분은 제 친구예요.","저는 학생이에요.","우리 가족은 세 명이에요."],0]]},
{title:["장소와 물건","Places and Objects"],desc:["주변 사물과 위치 표현하기","Name objects and describe locations"],v:[["학교","School"],["집","Home"],["책","Book"],["가방","Bag"],["교실","Classroom"],["여기","Here"]],sent:[["책이 책상 위에 있어요.","The book is on the desk."],["여기는 학교예요.","This is a school."],["가방이 교실에 있어요.","The bag is in the classroom."]],grammar:[["'이/가'는 주어를 나타냅니다. 받침이 있으면 '이', 없으면 '가'를 씁니다. 위치를 나타낼 때 '에 있어요'를 쓸 수 있습니다.","'이/가' marks the subject: '이' after a final consonant, '가' otherwise. '에 있어요' indicates where something is."],["책이 있어요. / 가방이 학교에 있어요.","There is a book. / The bag is at school."]],quiz:[["'가방'의 뜻은?","What does '가방' mean?",["Book","Bag","School","Room"],1],["'책___ 있어요.' 알맞은 조사는?","Complete '책___ 있어요.'",["가","는","이","를"],2],["'The bag is in the classroom.'에 맞는 문장은?","Which means 'The bag is in the classroom'?",["가방이 교실에 있어요.","책이 학교에 있어요.","교실이 가방에 있어요.","가방은 없어요."],0]]},
{title:["일상 동작","Daily Activities"],desc:["자주 하는 행동을 말하기","Talk about common daily actions"],v:[["먹다","To eat"],["마시다","To drink"],["가다","To go"],["오다","To come"],["읽다","To read"],["공부하다","To study"]],sent:[["저는 밥을 먹어요.","I eat rice/a meal."],["물을 마셔요.","I drink water."],["한국어를 공부해요.","I study Korean."]],grammar:[["동사 어간 뒤에 '-아요/어요'를 붙여 일상적인 현재 행동을 말합니다. 목적어는 보통 '을/를'로 표시합니다.","Attach '-아요/어요' to a verb stem for a polite everyday present-tense statement. Mark a direct object with '을/를'."],["먹다 → 먹어요 / 가다 → 가요 / 물을 마셔요.","Eat → 먹어요 / Go → 가요 / I drink water."]],quiz:[["'마시다'의 뜻은?","What does '마시다' mean?",["To go","To drink","To study","To read"],1],["'저는 밥___ 먹어요.' 알맞은 조사는?","Choose the particle: '저는 밥___ 먹어요.'",["이","가","을","는"],2],["'I study Korean.'에 맞는 문장은?","Which means 'I study Korean'?",["저는 물을 마셔요.","한국어를 공부해요.","학교에 가요.","책을 읽어요."],1]]},
{title:["숫자와 쇼핑","Numbers and Shopping"],desc:["기본 수량과 가격 묻기","Count items and ask about prices"],v:[["하나","One (native Korean)"],["둘","Two (native Korean)"],["셋","Three (native Korean)"],["얼마","How much"],["원","Won (currency)"],["주세요","Please give me"]],sent:[["사과 두 개 주세요.","Please give me two apples."],["이거 얼마예요?","How much is this?"],["오천 원이에요.","It is 5,000 won."]],grammar:[["물건 수량을 말할 때 '한 개, 두 개, 세 개'처럼 고유어 수사가 바뀝니다. 가격은 보통 한자어 수사를 사용합니다.","Native Korean numerals change before counters: 한 개, 두 개, 세 개. Prices typically use Sino-Korean numerals."],["하나 → 한 개 / 둘 → 두 개 / 셋 → 세 개","One item / Two items / Three items"]],quiz:[["'두 개'는 몇 개일까요?","How many is '두 개'?",["1","2","3","4"],1],["'How much is this?'에 맞는 문장은?","Which means 'How much is this'?",["이거 얼마예요?","이거 주세요.","이거 어디예요?","이거 누구예요?"],0],["'Please give me two apples.'에 맞는 문장은?","Which means 'Please give me two apples'?",["사과 세 개 주세요.","사과 한 개 주세요.","사과 두 개 주세요.","사과를 먹어요."],2]]}
];
const ui={ko:{back:"← 7단계 학습관",title:"초급 1 · 집중 학습",intro:"5개 단원에서 단어 → 문장 → 문법 → 연습문제 → 오답 복습 순서로 학습하세요.",listTitle:"학습 목차",progress:"완료한 단원",tabs:["단어","문장","문법","연습문제","오답 복습"],listen:"🔊 듣기",quizHelp:"각 문항에 답한 뒤 채점하세요. 오답은 복습함에 저장됩니다.",submit:"채점하기",retry:"다시 풀기",next:"다음 단원 →",complete:"정답",incorrect:"오답",correctAnswer:"정답",result:"점수",empty:"아직 저장된 오답이 없습니다.",retryWrong:"오답만 다시 풀기",wrongHint:"오답을 다시 풀어 정답을 맞히면 복습함에서 제거됩니다.",warning:"진도와 오답은 현재 브라우저에만 저장됩니다. 기기나 브라우저를 변경하거나 데이터를 삭제하면 기록이 사라질 수 있습니다. 발음은 기기의 한국어 음성 합성 기능을 사용합니다.",noSpeech:"이 기기는 음성 재생을 지원하지 않습니다.",choose:"모든 문항에 답을 선택해 주세요.",done:"복습 완료",all:"전체"},en:{back:"← Seven-Stage Academy",title:"Beginner 1 · Learning Lab",intro:"Study five units in order: Vocabulary → Sentences → Grammar → Practice → Mistake Review.",listTitle:"Course Units",progress:"Units completed",tabs:["Vocabulary","Sentences","Grammar","Practice","Mistake Review"],listen:"🔊 Listen",quizHelp:"Answer every question, then check your score. Incorrect answers are saved for review.",submit:"Check Answers",retry:"Try Again",next:"Next Unit →",complete:"Correct",incorrect:"Incorrect",correctAnswer:"Answer",result:"Score",empty:"No mistakes saved yet.",retryWrong:"Practice My Mistakes",wrongHint:"Correctly answering a review question removes it from your mistake list.",warning:"Progress and mistakes are stored only in this browser. Changing devices, browsers, or clearing data may erase them. Audio uses your device's Korean text-to-speech.",noSpeech:"Speech playback is not available on this device.",choose:"Please answer every question.",done:"Review complete",all:"All"}};
const $=id=>document.getElementById(id);let lang=localStorage.getItem("hs-language")==="en"?"en":"ko",unit=0,tab=0,selected={},reviewMode=false;
let state;try{state=JSON.parse(localStorage.getItem("hs-beginner1-v1")||"{}")}catch(e){state={}}if(!state.done)state.done={};if(!state.mistakes)state.mistakes={};
const key=(u,q)=>u+"-"+q;const save=()=>{try{localStorage.setItem("hs-beginner1-v1",JSON.stringify(state))}catch(e){}};
function speak(s){if(!("speechSynthesis" in window)){alert(ui[lang].noSpeech);return}speechSynthesis.cancel();const a=new SpeechSynthesisUtterance(s);a.lang="ko-KR";a.rate=.82;speechSynthesis.speak(a)}
function button(label,fn,cls="btn"){const b=document.createElement("button");b.className=cls;b.textContent=label;b.onclick=fn;return b}
function render(){const t=ui[lang],k=lang==="ko"?0:1;document.documentElement.lang=lang;$("lang").value=lang;for(const id of ["back","title","intro","listTitle","warning"])$(id).textContent=t[id];const nav=$("nav");nav.replaceChildren();units.forEach((u,i)=>nav.append(button((state.done[i]?"✓ ":"")+(i+1)+". "+u.title[k],()=>{unit=i;tab=0;reviewMode=false;selected={};render()},""+(unit===i?"active":""))));$("progressLabel").textContent=t.progress+": "+Object.keys(state.done).filter(x=>state.done[x]).length+" / "+units.length;$("progressBar").style.width=(Object.keys(state.done).filter(x=>state.done[x]).length/units.length*100)+"%";$("lessonTitle").textContent=units[unit].title[k];$("lessonDesc").textContent=units[unit].desc[k];const tabs=$("tabs");tabs.replaceChildren();t.tabs.forEach((v,i)=>tabs.append(button(v,()=>{tab=i;reviewMode=false;selected={};render()},""+(tab===i?"active":""))));const content=$("content");content.replaceChildren();if(tab===0||tab===1){for(const pair of (tab===0?units[unit].v:units[unit].sent)){const item=document.createElement("div");item.className="item";const a=document.createElement("div"),b=document.createElement("strong"),c=document.createElement("span");b.textContent=pair[0];c.textContent=pair[1];a.append(b,c);item.append(a,button(t.listen,()=>speak(pair[0]),"listen"));content.append(item)}}else if(tab===2){for(const pair of units[unit].grammar){const p=document.createElement("p");p.className="grammar";p.textContent=pair[k];content.append(p)}}else if(tab===3){renderQuiz(content,units[unit].quiz.map((q,i)=>({u:unit,i,q})),false)}else renderReview(content)}
function renderQuiz(host,items,isReview){const t=ui[lang],k=lang==="ko"?0:1;host.replaceChildren();const note=document.createElement("p");note.className="muted";note.textContent=isReview?t.wrongHint:t.quizHelp;host.append(note);if(!items.length){const p=document.createElement("p");p.className="muted";p.textContent=t.empty;host.append(p);return}items.forEach(({u,i,q},n)=>{const section=document.createElement("div");section.className="mistake";const p=document.createElement("div");p.className="question";p.textContent=(n+1)+". "+q[k];section.append(p);const opts=document.createElement("div");opts.className="choices";q[2].forEach((answer,j)=>{const b=button(answer,()=>{selected[key(u,i)]=j;renderOptions(opts,j)},"choice");b.setAttribute("aria-pressed",String(selected[key(u,i)]===j));opts.append(b)});section.append(opts);host.append(section)});const msg=document.createElement("div");msg.className="feedback";msg.setAttribute("aria-live","polite");host.append(msg);host.append(button(t.submit,()=>{if(items.some(({u,i})=>selected[key(u,i)]===undefined)){msg.textContent=t.choose;return}let good=0;items.forEach(({u,i,q})=>{const id=key(u,i);if(selected[id]===q[3]){good++;delete state.mistakes[id]}else state.mistakes[id]=true});if(!isReview&&good===items.length)state.done[unit]=true;save();msg.textContent=t.result+": "+good+" / "+items.length;const results=document.createElement("div");items.forEach(({u,i,q})=>{const p=document.createElement("p");p.className="mistake";p.textContent=(selected[key(u,i)]===q[3]?"✓ ":"✗ ")+q[k]+" — "+t.correctAnswer+": "+q[2][q[3]];results.append(p)});host.append(results);const row=document.createElement("div");row.className="row";row.append(button(t.retry,()=>{selected={};render()}, "btn secondary"));if(!isReview&&unit<units.length-1)row.append(button(t.next,()=>{unit++;tab=0;selected={};render()}));if(isReview)row.append(button(t.retryWrong,()=>{selected={};render()}));host.append(row);for(const b of host.querySelectorAll(".choice"))b.disabled=true;for(const b of host.querySelectorAll("button"))if(b.textContent===t.submit)b.disabled=true;renderNavOnly()}, "btn"))}
function renderOptions(host,index){[...host.children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i===index)))}
function renderNavOnly(){const t=ui[lang],k=lang==="ko"?0:1;[...$("nav").children].forEach((b,i)=>b.textContent=(state.done[i]?"✓ ":"")+(i+1)+". "+units[i].title[k]);$("progressLabel").textContent=t.progress+": "+Object.keys(state.done).filter(x=>state.done[x]).length+" / "+units.length;$("progressBar").style.width=(Object.keys(state.done).filter(x=>state.done[x]).length/units.length*100)+"%"}
function renderReview(host){const items=[];for(const id of Object.keys(state.mistakes)){const [u,i]=id.split("-").map(Number);if(u===unit&&units[u]&&units[u].quiz[i])items.push({u,i,q:units[u].quiz[i]})}renderQuiz(host,items,true)}
$("lang").onchange=e=>{lang=e.target.value;localStorage.setItem("hs-language",lang);selected={};render()};render();
</script></body></html>
