const units=[{"title":["인사와 소개","Greetings and Introductions"],"desc":["첫 만남에서 쓰는 기본 표현","Useful expressions when meeting someone"],"v":[["안녕하세요","Hello"],["감사합니다","Thank you"],["이름","Name"],["학생","Student"],["선생님","Teacher"],["반갑습니다","Nice to meet you"]],"sent":[["안녕하세요. 저는 민수예요.","Hello. I am Minsu."],["제 이름은 수지예요.","My name is Suji."],["만나서 반갑습니다.","Nice to meet you."]],"grammar":[["'저는'의 '는'은 화제를 나타내는 조사입니다. 받침이 없는 명사 뒤에는 '는', 받침이 있는 명사 뒤에는 '은'을 씁니다.","The topic marker '는' follows nouns without a final consonant, while '은' follows nouns with a final consonant."],["저는 학생이에요. / 책은 재미있어요.","I am a student. / The book is interesting."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. My name is Suji. → 제 이름은 수지예요.","Self-check: cover the Korean, say this from its meaning, then compare. My name is Suji. → 제 이름은 수지예요."]],"quiz":[["'Thank you'는 한국어로?","How do you say 'Thank you'?",["안녕하세요","안녕히 가세요","감사합니다","괜찮아요"],2],["'저___ 학생이에요.' 알맞은 조사는?","Choose the correct particle: '저___ 학생이에요.'",["은","이","을","는"],3],["'Nice to meet you.'에 맞는 표현은?","Which expression means 'Nice to meet you'?",["만나서 반갑습니다","죄송합니다","잘 먹겠습니다","안녕히 가세요"],0],["'저는'에서 화제 조사는?","Which particle marks the topic in 저는?",["에","가","를","는"],3],["다음 문장의 뜻은? 안녕하세요. 저는 민수예요.","What does this sentence mean? 안녕하세요. 저는 민수예요.",["Hello","Hello. I am Minsu.","My name is Suji.","Nice to meet you."],1]]},{"title":["가족과 사람","Family and People"],"desc":["가족 구성원과 사람을 소개하기","Describe family members and people"],"v":[["가족","Family"],["어머니","Mother"],["아버지","Father"],["형","Older brother (male speaker)"],["언니","Older sister (female speaker)"],["친구","Friend"]],"sent":[["우리 가족은 네 명이에요.","There are four people in my family."],["이분은 제 어머니예요.","This is my mother."],["저 사람은 제 친구예요.","That person is my friend."]],"grammar":[["'이에요/예요'는 명사를 설명하거나 정체를 밝힐 때 씁니다. 받침이 있으면 '이에요', 없으면 '예요'입니다.","Use '이에요/예요' to identify someone or something. Use '이에요' after a final consonant and '예요' otherwise."],["학생이에요. / 친구예요.","(I am) a student. / (They are) a friend."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. This is my mother. → 이분은 제 어머니예요.","Self-check: cover the Korean, say this from its meaning, then compare. This is my mother. → 이분은 제 어머니예요."]],"quiz":[["'어머니'의 뜻은?","What does '어머니' mean?",["Father","Teacher","Mother","Friend"],2],["'친구___.' 알맞은 말은?","Complete '친구___.'",["이에요","에서","을","예요"],3],["'This is my mother.'에 해당하는 문장은?","Which means 'This is my mother'?",["우리 가족은 세 명이에요.","이분은 제 친구예요.","이분은 제 어머니예요.","저는 학생이에요."],2],["'친구가'에서 주어 조사는?","Which particle marks the subject in 친구가?",["가","도","는","를"],0],["다음 문장의 뜻은? 우리 가족은 네 명이에요.","What does this sentence mean? 우리 가족은 네 명이에요.",["There are four people in my family.","Family","This is my mother.","That person is my friend."],0]]},{"title":["장소와 물건","Places and Objects"],"desc":["주변 사물과 위치 표현하기","Name objects and describe locations"],"v":[["학교","School"],["집","Home"],["책","Book"],["가방","Bag"],["교실","Classroom"],["여기","Here"]],"sent":[["책이 책상 위에 있어요.","The book is on the desk."],["여기는 학교예요.","This is a school."],["가방이 교실에 있어요.","The bag is in the classroom."]],"grammar":[["'이/가'는 주어를 나타냅니다. 받침이 있으면 '이', 없으면 '가'를 씁니다. 위치를 나타낼 때 '에 있어요'를 쓸 수 있습니다.","'이/가' marks the subject: '이' after a final consonant, '가' otherwise. '에 있어요' indicates where something is."],["책이 있어요. / 가방이 학교에 있어요.","There is a book. / The bag is at school."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. This is a school. → 여기는 학교예요.","Self-check: cover the Korean, say this from its meaning, then compare. This is a school. → 여기는 학교예요."]],"quiz":[["'가방'의 뜻은?","What does '가방' mean?",["School","Room","Book","Bag"],3],["'책___ 있어요.' 알맞은 조사는?","Complete '책___ 있어요.'",["를","가","이","는"],2],["'The bag is in the classroom.'에 맞는 문장은?","Which means 'The bag is in the classroom'?",["가방이 교실에 있어요.","교실이 가방에 있어요.","책이 학교에 있어요.","가방은 없어요."],0],["'책을'에서 목적격 조사는?","Which marks the object in 책을?",["는","을","이","에"],1],["다음 문장의 뜻은? 책이 책상 위에 있어요.","What does this sentence mean? 책이 책상 위에 있어요.",["The book is on the desk.","School","Thi const authoredManuscripts=[{"scene":["처음 만난 동료에게 인사하기","Meeting a new colleague"],"dialogue":[{"speaker":"A","ko":"안녕하세요. 저는 소피아예요.","en":"Hello. I'm Sofia."},{"speaker":"B","ko":"안녕하세요. 저는 민준이에요.","en":"Hello. I'm Minjun."},{"speaker":"A","ko":"여기에서 일하세요?","en":"Do you work here?"},{"speaker":"B","ko":"네, 오늘부터 일해요.","en":"Yes, I start working here today."},{"speaker":"A","ko":"만나서 반가워요.","en":"Nice to meet you."},{"speaker":"B","ko":"저도 반가워요. 잘 부탁드려요.","en":"Nice to meet you too. I look forward to working with you."}],"focus":["‘저는’은 자신을 화제로 소개합니다. ‘소피아예요’처럼 받침이 없는 이름에는 ‘예요’를, ‘민준이에요’처럼 받침이 있는 이름에는 ‘이에요’를 붙입니다. ‘잘 부탁드려요’는 앞으로 관계를 이어 갈 사람에게 자연스럽게 쓰는 인사입니다.","저는 marks the speaker as the topic. Use 예요 after a noun without a final consonant (소피아예요), and 이에요 after one with a final consonant (민준이에요). 잘 부탁드려요 is a polite greeting when beginning an ongoing relationship."],"task":["자신의 이름을 넣어 인사한 뒤, 상대방에게 ‘여기에서 일하세요?’라고 질문하세요.","Introduce yourself with your own name, then ask whether the other person works here."],"checks":[["‘민준___’에 알맞은 표현은?","Which ending completes 민준___?",["예요","이에요","에서","를"],1]]},{"scene":["새 친구에게 가족 소개하기","Introducing family to a new friend"],"dialogue":[{"speaker":"A","ko":"가족이 몇 명이에요?","en":"How many people are in your family?"},{"speaker":"B","ko":"저를 포함해서 네 명이에요.","en":"Four, including me."},{"speaker":"A","ko":"형제나 자매가 있어요?","en":"Do you have any siblings?"},{"speaker":"B","ko":"네, 여동생이 한 명 있어요.","en":"Yes, I have one younger sister."},{"speaker":"A","ko":"여동생은 학생이에요?","en":"Is your younger sister a student?"},{"speaker":"B","ko":"네, 지금 고등학생이에요.","en":"Yes, she's in high school now."}],"focus":["‘저를 포함해서’는 자신도 수에 넣는다는 뜻입니다. ‘한 명’은 사람을 셀 때 쓰며, ‘한 개’는 물건을 셀 때 씁니다. ‘있어요’는 존재를 나타내고, ‘이에요’는 신분을 설명합니다.","저를 포함해서 means including me. Use 명 to count people, not 개. 있어요 expresses existence or possession, while 이에요 identifies someone's role or status."],"task":["자신의 실제 가족 구성에 맞게 숫자와 관계를 바꾸어 세 문장으로 소개하세요.","Change the number and relationships to describe your own family in three sentences."],"checks":[["사람 두 사람을 셀 때 알맞은 말은?","Which counter is used for two people?",["두 개","두 명","두 장","두 잔"],1]]},{"scene":["잃어버린 가방 찾기","Finding a misplaced bag"],"dialogue":[{"speaker":"A","ko":"제 가방이 어디에 있어요?","en":"Where is my bag?"},{"speaker":"B","ko":"의자 옆에 있는 가방이에요?","en":"Do you mean the bag next to the chair?"},{"speaker":"A","ko":"아니요, 검은색 가방이에요.","en":"No, it's a black bag."},{"speaker":"B","ko":"그럼 책상 아래를 보세요.","en":"Then look under the desk."},{"speaker":"A","ko":"아, 여기 있네요!","en":"Oh, here it is!"},{"speaker":"B","ko":"찾아서 다행이에요.","en":"I'm glad you found it."}],"focus":["‘에’는 물건이 있는 위치를 나타냅니다. ‘아래’와 ‘옆’은 위치 명사이므로 ‘책상 아래에’, ‘의자 옆에’처럼 씁니다. ‘검은색 가방’에서는 색을 나타내는 말이 명사를 꾸밉니다.","에 marks a location. Position nouns such as 아래 (under) and 옆 (beside) form expressions like 책상 아래에. 검은색 modifies 가방 to specify which bag."],"task":["책상 위·의자 아래·문 옆 중 한 위치를 골라 물건을 찾는 대화를 만드세요.","Create a lost-item dialogue using one of: on the desk, under the chair, or beside the door."],"checks":[["‘책상 ___에 가방이 있어요.’ 알맞은 위치는?","Complete: The bag is under the desk.",["아래","오늘","어제","빨리"],0]]},{"scene":["아침 생활 이야기하기","Talking about morning routines"],"dialogue":[{"speaker":"A","ko":"아침에 보통 뭐 해요?","en":"What do you usually do in the morning?"},{"speaker":"B","ko":"일곱 시에 일어나요.","en":"I get up at seven."},{"speaker":"A","ko":"일어나서 바로 밥을 먹어요?","en":"Do you eat right after getting up?"},{"speaker":"B","ko":"아니요, 먼저 물을 마셔요.","en":"No, first I drink water."},{"speaker":"A","ko":"그다음에는요?","en":"And after that?"},{"speaker":"B","ko":"간단히 운동하고 아침을 먹어요.","en":"I exercise briefly and eat breakfast."}],"focus":["‘일어나요’는 ‘일어나다’의 해요체입니다. ‘마시다 → 마셔요’, ‘먹다 → 먹어요’처럼 동사의 끝을 바꿉니다. ‘먼저’와 ‘그다음에’는 행동의 순서를 나타냅니다.","일어나요 is the polite present form of 일어나다. Other forms include 마시다 → 마셔요 and 먹다 → 먹어요. 먼저 and 그다음에 organize actions in sequence."],"task":["자신의 아침 활동 세 가지를 ‘먼저’와 ‘그다음에’를 사용해 설명하세요.","Describe three morning activities using 먼저 and 그다음에."],"checks":[["‘마시다’의 자연스러운 해요체는?","Which is the polite present form of 마시다?",["마시어요","마셔요","마셨어","마실"],1]]},{"scene":["과일 가게에서 계산하기","Buying fruit at a market"],"dialogue":[{"speaker":"A","ko":"사과가 얼마예요?","en":"How much are the apples?"},{"speaker":"B","ko":"한 개에 천오백 원이에요.","en":"They're 1,500 won each."},{"speaker":"A","ko":"그럼 두 개 주세요.","en":"Then two, please."},{"speaker":"B","ko":"네, 모두 삼천 원이에요.","en":"Sure, that's 3,000 won altogether."},{"speaker":"A","ko":"카드로 계산해도 돼요?","en":"Can I pay by card?"},{"speaker":"B","ko":"네, 가능합니다.","en":"Yes, you can."}],"focus":["물건을 셀 때 ‘하나·둘·셋’은 ‘한 개·두 개·세 개’로 바뀝니다. 가격을 읽을 때는 한자어 수사를 써서 ‘천오백 원’, ‘삼천 원’이라고 합니다. ‘-아/어도 돼요?’는 허락을 구하는 표현입니다.","Native Korean numbers change before counters: 하나→한, 둘→두, 셋→세. Prices use Sino-Korean numbers: 천오백 원 and 삼천 원. -아/어도 돼요? asks for permission."],"task":["사과 대신 바나나를 사고, 가격과 수량을 바꾸어 계산까지 말해 보세요.","Buy bananas instead, changing the price and quantity before asking to pay."],"checks":[["‘사과 2개’의 자연스러운 표현은?","How do you say two apples?",["둘 개","두 개","이 개","둘이 개"],1]]},{"scene":["이름을 정확하게 확인하기","Confirming someone's name"],"dialogue":[{"speaker":"A","ko":"실례지만 이름이 어떻게 되세요?","en":"Excuse me, may I ask your name?"},{"speaker":"B","ko":"제 이름은 지수예요.","en":"My name is Jisu."},{"speaker":"A","ko":"지수 씨, 맞으세요?","en":"Jisu, is that correct?"},{"speaker":"B","ko":"네, 맞아요.","en":"Yes, that's right."},{"speaker":"A","ko":"이름을 여기 적어 주세요.","en":"Please write your name here."},{"speaker":"B","ko":"네, 알겠습니다.","en":"Okay, understood."}],"focus":["‘이름이 뭐예요?’보다 ‘이름이 어떻게 되세요?’가 상대방에게 더 공손합니다. ‘-씨’는 이름 뒤에 붙이는 호칭입니다. ‘적어 주세요’는 ‘적다’에 정중한 부탁 ‘-어 주세요’를 붙인 표현입니다.","이름이 어떻게 되세요? is more polite than 이름이 뭐예요? The suffix 씨 is a polite title after a name. 적어 주세요 is a polite request to write something down."],"task":["접수 담당자와 방문객 역할을 번갈아 맡아 이름을 묻고 확인하세요.","Role-play a receptionist and visitor, asking for and confirming a name."],"checks":[["처음 만난 성인에게 가장 공손한 질문은?","Which is the most polite way to ask an adult's name?",["너 이름 뭐야?","이름이 어떻게 되세요?","이름 적어.","누구야?"],1]]},{"scene":["출신 국가와 사는 곳 말하기","Talking about hometown and residence"],"dialogue":[{"speaker":"A","ko":"어느 나라에서 왔어요?","en":"Which country are you from?"},{"speaker":"B","ko":"베트남에서 왔어요.","en":"I'm from Vietnam."},{"speaker":"A","ko":"지금도 베트남에 살아요?","en":"Do you still live in Vietnam?"},{"speaker":"B","ko":"아니요, 지금은 서울에 살아요.","en":"No, I live in Seoul now."},{"speaker":"A","ko":"서울 생활은 어때요?","en":"How is life in Seoul?"},{"speaker":"B","ko":"편리하지만 사람이 많아요.","en":"It's convenient, but crowded."}],"focus":["출발점이나 출신을 말할 때는 ‘베트남에서 왔어요’처럼 ‘에서’를 씁니다. 거주지를 말할 때는 ‘서울에 살아요’처럼 ‘에’를 씁니다. 같은 장소라도 동사에 따라 조사가 달라집니다.","Use 에서 with 오다 to mark origin (베트남에서 왔어요), but 에 with 살다 to mark where someone lives (서울에 살아요). The particle depends on the verb."],"task":["출신 국가와 현재 사는 도시를 서로 다른 조사로 소개하세요.","Introduce your home country and current city using the appropriate particles."],"checks":[["‘서울___ 살아요.’ 알맞은 조사는?","Which particle completes 서울___ 살아요?",["에서","에","을","와"],1]]},{"scene":["처음 만난 사람에게 직업 묻기","Asking about someone's job"],"dialogue":[{"speaker":"A","ko":"무슨 일을 하세요?","en":"What do you do for work?"},{"speaker":"B","ko":"저는 디자이너예요.","en":"I'm a designer."},{"speaker":"A","ko":"어디에서 일하세요?","en":"Where do you work?"},{"speaker":"B","ko":"작은 회사에서 일해요.","en":"I work at a small company."},{"speaker":"A","ko":"주로 어떤 일을 해요?","en":"What do you mainly do?"},{"speaker":"B","ko":"웹사이트를 디자인해요.","en":"I design websites."}],"focus":["‘무슨 일을 하세요?’는 직업을 묻는 자연스러운 질문입니다. ‘디자이너예요’는 직업의 정체를 설명하고, ‘회사에서 일해요’의 ‘에서’는 행동이 이루어지는 장소를 나타냅니다.","무슨 일을 하세요? naturally asks about occupation. 디자이너예요 identifies a profession; 에서 in 회사에서 일해요 marks the place where an action occurs."],"task":["자신의 직업 또는 공부하는 분야를 말하고, 일하거나 공부하는 장소를 덧붙이세요.","State your job or field of study and add where you work or study."],"checks":[["행동이 이루어지는 장소를 나타내는 조사는?","Which particle marks where an action happens?",["에서","까지","만","보다"],0]]},{"scene":["학생인지 직장인인지 설명하기","Explaining whether you study or work"],"dialogue":[{"speaker":"A","ko":"지금 대학생이에요?","en":"Are you a university student now?"},{"speaker":"B","ko":"아니요, 회사원이에요.","en":"No, I'm an office worker."},{"speaker":"A","ko":"그럼 한국어는 왜 배워요?","en":"Then why are you learning Korean?"},{"speaker":"B","ko":"한국 친구들과 이야기하고 싶어요.","en":"I want to talk with Korean friends."},{"speaker":"A","ko":"한국어 수업은 재미있어요?","en":"Are your Korean classes fun?"},{"speaker":"B","ko":"네, 어려워도 재미있어요.","en":"Yes, they're fun even though they're difficult."}],"focus":["‘아니요’로 부정한 뒤 올바른 정보를 ‘회사원이에요’처럼 이어 말하면 자연스럽습니다. ‘-고 싶어요’는 자신의 바람을 나타냅니다. ‘이야기하고 싶어요’는 ‘이야기하다’와 결합한 표현입니다.","After 아니요, provide the correct information. -고 싶어요 expresses the speaker's desire: 이야기하고 싶어요 means I want to talk."],"task":["자신의 현재 신분과 한국어를 배우는 이유를 ‘-고 싶어요’로 연결하세요.","Describe your current status and why you study Korean using -고 싶어요."],"checks":[["‘친구를 만나___’에 알맞은 말은?","Complete: I want to meet a friend.",["고 싶어요","에 있어요","고 있어요?","지 않아요"],0]]},{"scene":["새 직장 첫날 인사하기","Greetings on the first day at work"],"dialogue":[{"speaker":"A","ko":"안녕하세요. 오늘부터 일하게 됐어요.","en":"Hello. I'm starting work today."},{"speaker":"B","ko":"반갑습니다. 저는 같은 팀의 유나예요.","en":"Nice to meet you. I'm Yuna from the same team."},{"speaker":"A","ko":"잘 부탁드립니다.","en":"I look forward to working with you."},{"speaker":"B","ko":"저도 잘 부탁드립니다.","en":"Likewise, I look forward to working with you."},{"speaker":"A","ko":"회의실은 어디에 있나요?","en":"Where is the meeting room?"},{"speaker":"B","ko":"복도 끝에 있어요. 제가 안내할게요.","en":"It's at the end of the hall. I'll show you."}],"focus":["‘잘 부탁드립니다’는 직장이나 공식적인 자리에서 처음 인사할 때 쓰는 격식 있는 표현입니다. ‘잘 부탁드려요’보다 더 격식적입니다. ‘안내할게요’의 ‘-(으)ㄹ게요’는 말하는 사람의 의지나 약속을 나타냅니다.","잘 부탁드립니다 is a formal greeting for a new professional relationship, more formal than 잘 부탁드려요. -(으)ㄹ게요 in 안내할게요 expresses the speaker's intention or promise."],"task":["새 직장 첫날이라고 가정하고 자기소개, 인사, 장소 질문을 이어 말하세요.","Role-play your first day at a new job: introduce yourself, greet a colleague, and ask for a location."],"checks":[["격식 있는 첫 직장 인사에 알맞은 말은?","Which expression suits a formal first day at work?",["잘 부탁드립니다.","잘 가.","뭐 해?","나중에 봐."],0]]},{"scene":["퇴근 후 가족에게 전화하기","Calling a family member after work"],"dialogue":[{"speaker":"A","ko":"아버지, 저 지금 퇴근했어요.","en":"Dad, I just got off work."},{"speaker":"B","ko":"오늘 회사에서 많이 바빴니?","en":"Were you very busy at work today?"},{"speaker":"A","ko":"네, 회의가 두 번 있었어요.","en":"Yes, I had two meetings."},{"speaker":"B","ko":"저녁은 먹었어?","en":"Have you had dinner?"},{"speaker":"A","ko":"아직 안 먹었어요. 집에 가서 먹을 거예요.","en":"Not yet. I'll eat when I get home."},{"speaker":"B","ko":"그래, 조심해서 와.","en":"Okay. Come home safely."}],"focus":["‘퇴근했어요’는 일을 마치고 직장에서 나왔다는 뜻입니다. ‘아직 안 먹었어요’는 지금까지 식사를 하지 않았다는 뜻이며, ‘먹을 거예요’는 앞으로의 계획을 나타냅니다. 가족끼리는 친밀도에 따라 반말과 높임말을 다르게 사용할 수 있습니다.","퇴근했어요 means finished work and left the workplace. 아직 안 먹었어요 means not yet eaten, and -(으)ㄹ 거예요 expresses a future plan. Family members may use different speech levels depending on age and relationship."],"task":["직장이나 학교에서 돌아오는 상황을 정해 가족에게 전화하는 대화를 여섯 문장으로 만들어 보세요.","Role-play a six-line phone call with a family member after work or school."],"checks":[["‘아직 안 먹었어요’와 의미가 같은 것은?","Which sentence means 'I haven't eaten yet'?",["벌써 먹었어요.","아직 식사하지 않았어요.","지금 먹고 있어요.","매일 먹어요."],1]]},{"scene":["엄마와 주말 장보기 계획 세우기","Planning weekend groceries with Mom"],"dialogue":[{"speaker":"A","ko":"어머니, 토요일에 같이 장 보러 갈까요?","en":"Mom, shall we go grocery shopping together on Saturday?"},{"speaker":"B","ko":"좋지. 냉장고에 뭐가 없니?","en":"Sure. What are we out of in the fridge?"},{"speaker":"A","ko":"우유하고 달걀이 없어요.","en":"We're out of milk and eggs."},{"speaker":"B","ko":"과일도 조금 사자.","en":"Let's buy some fruit too."},{"speaker":"A","ko":"그럼 오전 열 시에 출발해요.","en":"Then let's leave at ten in the morning."},{"speaker":"B","ko":"그래, 장바구니도 챙겨 줘.","en":"Okay, please bring a shopping bag too."}],"focus":["‘장 보러 가다’는 물건, 특히 식료품을 사러 간다는 뜻입니다. ‘우유하고 달걀’의 ‘하고’는 명사를 연결합니다. ‘갈까요?’는 상대방에게 제안하거나 의견을 묻고, ‘사자’는 친한 사람에게 함께 행동하자고 권하는 반말입니다.","장 보러 가다 means to go shopping, often for groceries. 하고 connects nouns. -(으)ㄹ까요? makes a suggestion or asks for agreement, while -자 is an informal invitation to act together."],"task":["구매할 물건 세 가지와 출발 시간을 정해 가족과 장보기 계획을 말해 보세요.","Choose three groceries and a departure time, then plan a shopping trip with a family member."],"checks":[["함께 가자고 정중하게 제안하는 문장은?","Which sentence politely suggests going together?",["같이 갈까요?","같이 갔어요.","같이 가고 있어요.","같이 안 갔어요."],0]]},{"scene":["동생의 시험 준비 도와주기","Helping a younger sibling study"],"dialogue":[{"speaker":"A","ko":"동생아, 내일 시험이지?","en":"You have an exam tomorrow, right?"},{"speaker":"B","ko":"응, 수학 시험이야.","en":"Yeah, it's a math exam."},{"speaker":"A","ko":"어려운 문제가 있으면 물어봐.","en":"Ask me if there's a difficult problem."},{"speaker":"B","ko":"이 문제를 잘 모르겠어.","en":"I don't understand this problem very well."},{"speaker":"A","ko":"먼저 문제를 천천히 읽어 봐.","en":"First, try reading the problem slowly."},{"speaker":"B","ko":"알겠어. 같이 풀어 줘서 고마워.","en":"Okay. Thanks for solving it with me."}],"focus":["‘문제가 있으면’의 ‘-(으)면’은 조건을 나타냅니다. ‘읽어 봐’는 ‘읽다’에 ‘-어 보다’를 붙여 시도를 권하는 표현입니다. ‘물어봐’는 ‘물어보다’의 친근한 명령형으로, 모르는 것을 질문하라는 뜻입니다.","-(으)면 introduces a condition: if there is a problem. -아/어 보다 suggests trying an action. 물어봐 is an informal request to ask a question."],"task":["모르는 문제가 있는 친구를 돕는 역할극을 하며 ‘-(으)면’과 ‘-아/어 보다’를 각각 한 번 사용하세요.","Role-play helping someone study, using -(으)면 and -아/어 보다 at least once each."],"checks":[["‘시간이 있___ 같이 공부해요’의 알맞은 말은?","Complete: 'If you have time, let's study together.'",["어서","으면","지만","는데"],1]]},{"scene":["가족 4 · 언니 — 실생활 대화 연습","Family 4 · older sister — practical conversation"],"dialogue":[{"speaker":"A","ko":"오늘은 ‘가족 4 · 언니’에 대해 연습해요.","en":"Let's practice Family 4 · older sister today."},{"speaker":"B","ko":"아버지는 회사원이에요.","en":"My father is an office worker."},{"speaker":"A","ko":"다른 표현도 말해 볼래요?","en":"Can you try another expression?"},{"speaker":"B","ko":"가족이 보고 싶어요.","en":"I miss my family."},{"speaker":"A","ko":"좋아요. 마지막 문장도 말해 보세요.","en":"Good. Please say the last sentence too."},{"speaker":"B","ko":"우리 가족은 네 명이에요.","en":"There are four people in my family."}],"focus":["[가족 4 · 언니] 핵심 표현 '언니'을 문맥 속에서 익히고 문장 '아버지는 회사원이에요.'에 적용하세요. 아버지는 회사원이에요. 예문: ‘아버지는 회사원이에요.’.","[Family 4 · older sister] Study '언니' in context and apply it to '아버지는 회사원이에요.'. My father is an office worker. Example: \"My father is an office worker.\"."],"task":["‘아버지는 회사원이에요.’을 소리 내어 읽고, ‘가족이 보고 싶어요.’과 ‘우리 가족은 네 명이에요.’을 사용해 두 사람이 대화해 보세요.","Read \"My father is an office worker.\" aloud, then role-play a conversation using \"I miss my family.\" and \"There are four people in my family.\"."],"checks":[["다음 표현의 뜻은? 언니","What does this expression mean? 언니",["older brother","older sister","family","father"],1],["다음 문장을 이해한 내용으로 맞는 것은? 아버지는 회사원이에요.","Which interpretation matches this sentence? 아버지는 회사원이에요.",["I miss my family.","There are four people in my family.","My father is an office worker.","My mother is a teacher."],2]]},{"scene":["가족 5 · 형 — 실생활 대화 연습","Family 5 · older brother — practical conversation"],"dialogue":[{"speaker":"A","ko":"오늘은 ‘가족 5 · 형’에 대해 연습해요.","en":"Let's practice Family 5 · older brother today."},{"speaker":"B","ko":"가족이 보고 싶어요.","en":"I miss my family."},{"speaker":"A","ko":"다른 표현도 말해 볼래요?","en":"Can you try another expression?"},{"speaker":"B","ko":"우리 가족은 네 명이에요.","en":"There are four people in my family."},{"speaker":"A","ko":"좋아요. 마지막 문장도 말해 보세요.","en":"Good. Please say the last sentence too."},{"speaker":"B","ko":"어머니는 선생님이에요.","en":"My mother is a teacher."}],"focus":["[가족 5 · 형] 핵심 표현 '형'을 문맥 속에서 익히고 문장 '가족이 보고 싶어요.'에 적용하세요. 가족이 보고 싶어요. 예문: ‘가족이 보고 싶어요.’.","[Family 5 · older brother] Study '형' in context and apply it to '가족이 보고 싶어요.'. I miss my family. Example: \"I miss my family.\"."],"task":["‘가족이 보고 싶어요.’을 소리 내어 읽고, ‘우리 가족은 네 명이에요.’과 ‘어머니는 선생님이에요.’을 사용해 두 사람이 대화해 보세요.","Read \"I miss my family.\" aloud, then role-play a conversation using \"There are four people in my family.\" and \"My mother is a teacher.\"."],"checks":[
