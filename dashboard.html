<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 한국어 학습 | 한글쉽지</title><style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#172944;background:#f6f8fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#142e3c,#126e73);color:white;padding:28px max(20px,calc((100vw - 1100px)/2))}header a{color:white}main{max-width:1100px;margin:auto;padding:24px 16px 70px}h1{margin:8px 0}h2{margin:28px 0 14px}.muted{color:#60708b}.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:white;border:1px solid #dce5f4;border-radius:16px;padding:18px;min-width:0}.card a{display:inline-block;margin-top:12px;text-decoration:none;background:#315de5;color:white;padding:10px 14px;border-radius:10px}.card small{color:#61718b}.bar{height:10px;background:#e7edf8;border-radius:20px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#315de5}.actions{display:flex;flex-wrap:wrap;gap:10px}.actions button,.actions label{background:#315de5;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit}.actions label{display:inline-block}input[type=file]{position:absolute;width:1px;height:1px;opacity:0}button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #8baafc}.question{padding:12px;border-top:1px solid #e4eaf4}.question strong{display:block;margin-bottom:8px}.question button{border:1px solid #b6c8e8;border-radius:9px;padding:8px 12px;margin:4px;background:white;cursor:pointer}.status{min-height:22px;white-space:pre-wrap}.stat{font-size:24px;font-weight:750}footer{padding:22px;text-align:center;color:#63748c}@media(max-width:600px){header{padding:20px}main{padding:16px 12px}.actions button,.actions label{width:100%;text-align:center}}</style></head><body>
<header><div class="top"><a href="./learn.html" id="back">← 7단계 학습관</a><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></div><h1 id="heading">나의 학습 대시보드</h1><p id="subheading">7단계 전체 학습 진행률과 오답을 한곳에서 확인하세요.</p></header>
<main><div class="grid" id="stats"></div><h2 id="courseHeading"></h2><div class="grid" id="courses"></div><section class="reading-overview"><h2 id="readingHeading">15단계 리딩 · 독서 진도</h2><div class="card"><div class="top"><div><div class="stat" id="readingStat">0 / 600</div><p class="muted" id="readingNotice">읽기 연습을 완료하고 기록을 쌓아보세요.</p></div><a href="./reading.html" id="readingLink" style="display:inline-block;background:#087d77;color:white;border-radius:10px;padding:12px 17px;text-decoration:none;font-weight:800">리딩 도서관 →</a></div><div class="bar"><div id="readingBar" style="width:0%;background:#087d77"></div></div></div></section><section><h2 id="experienceHeading">실생활 한국어 연습</h2><div class="card"><div class="top"><div><div class="stat" id="experienceStat">0 / 6</div><p class="muted" id="experienceNotice">카페·교통·식당 등 상황별 회화 문제</p></div><a href="./experience.html" id="experienceLink" style="display:inline-block;background:#7454e8;color:white;border-radius:10px;padding:12px 17px;text-decoration:none;font-weight:800">실생활 연습 →</a></div><div class="bar"><div id="experienceBar" style="width:0%;background:linear-gradient(90deg,#7454e8,#0bb5a5)"></div></div></div></section><h2 id="mistakeHeading"></h2><div class="card"><p class="muted" id="mistakeIntro"></p><div id="mistakes"></div></div><h2 id="dataHeading"></h2><div class="card"><p class="muted" id="dataNotice"></p><div class="actions"><button id="exportBtn"></button><label for="importFile" id="importLabel"></label><input type="file" id="importFile" accept="application/json,.json"><button id="resetBtn"></button></div><p id="status" class="status" role="status"></p></div></main><footer id="footer"></footer>
<script>
"use strict";
const stages=[["입문","Hangul Foundations","intro.html","hs-intro-v1"],["초급 1","Beginner 1","beginner1.html","hs-beginner1-v1"],["초급 2","Beginner 2","beginner2.html","hs-beginner2-v1"],["중급 1","Intermediate 1","intermediate1.html","hs-intermediate1-v1"],["중급 2","Intermediate 2","intermediate2.html","hs-intermediate2-v1"],["고급 1","Advanced 1","advanced1.html","hs-advanced1-v1"],["고급 2","Advanced 2","advanced2.html","hs-advanced2-v1"]];
const strings={ko:{back:"← 7단계 학습관",heading:"나의 학습 대시보드",subheading:"7단계 전체 학습 진행률과 오답을 한곳에서 확인하세요.",courseHeading:"단계별 학습",mistakeHeading:"전체 오답 복습",mistakeIntro:"오답이 있는 단원으로 바로 이동해 다시 풀어보세요. 기존 기록은 그대로 유지됩니다.",dataHeading:"학습 기록 백업 · 복원",dataNotice:"학습 기록은 현재 브라우저에만 저장됩니다. 기기를 바꾸기 전에 JSON 파일로 백업하세요. 복원은 현재 기록과 합치지 않고 파일의 기록으로 덮어씁니다.",exportBtn:"기록 내보내기",importLabel:"백업 파일 가져오기",resetBtn:"전체 기록 삭제",resetConfirm:"이 브라우저에 저장된 한글쉽지 학습 기록을 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.",importConfirm:"현재 학습 기록을 백업 파일 내용으로 덮어쓸까요?",invalid:"백업 파일 형식이 올바르지 않습니다.",saved:"학습 기록을 복원했습니다.",deleted:"학습 기록을 삭제했습니다.",exported:"백업 파일을 만들었습니다.",none:"저장된 오답이 없습니다.",completed:"완료한 단원",mistakes:"남은 오답",practice:"영역별 추가 연습",open:"학습하기 →",review:"오답 복습하기 →",progress:"단원 완료",all:"전체",note:"본 서비스의 단계는 자체 학습 단계이며 공식 TOPIK 등급이나 세종학당 인증이 아닙니다."},en:{back:"← Seven-stage academy",heading:"My Learning Dashboard",subheading:"Review progress and mistakes across all seven stages.",courseHeading:"Learning Stages",mistakeHeading:"Mistake Review Across Stages",mistakeIntro:"Open the relevant stage to retry mistakes. Existing records are preserved.",dataHeading:"Back Up and Restore Progress",dataNotice:"Progress is stored only in this browser. Export a JSON backup before changing devices. Import replaces the current progress rather than merging.",exportBtn:"Export Progress",importLabel:"Import Backup",resetBtn:"Delete All Progress",resetConfirm:"Delete all Hangeul Swipji progress saved in this browser? This cannot be undone.",importConfirm:"Replace current progress with the backup file?",invalid:"Invalid backup file.",saved:"Progress restored.",deleted:"Progress deleted.",exported:"Backup file created.",none:"No saved mistakes.",completed:"Units Completed",mistakes:"Remaining Mistakes",practice:"Extra Skills Completed",open:"Study →",review:"Review Mistakes →",progress:"Units completed",all:"Total",note:"These are internal learning stages, not official TOPIK levels or King Sejong Institute certification."}};
const $=id=>document.getElementById(id);
let lang=localStorage.getItem("hs-language")==="en"?"en":"ko";
function get(key){try{const value=JSON.parse(localStorage.getItem(key)||"{}");return value&&typeof value==="object"&&!Array.isArray(value)?value:{}}catch(e){return {}}}
function keys(){return [...stages.map(s=>s[3]),...stages.map(s=>s[2]+"-skills-v1"),"hs-study-progress","hs-reading-v1","hs-realworld-v1"]}
function render(){const t=strings[lang];document.documentElement.lang=lang;$("language").value=lang;for(const k of ["back","heading","subheading","courseHeading","mistakeHeading","mistakeIntro","dataHeading","dataNotice","exportBtn","importLabel","resetBtn","footer"])$(k).textContent=t[k]||t.note;const course=$("courses"),stats=$("stats"),mistakes=$("mistakes");const real=get("hs-realworld-v1");const realCount=Array.from({length:6},(_,i)=>real[i]===true).filter(Boolean).length;$("experienceStat").textContent=realCount+" / 6";$("experienceBar").style.width=(realCount/6*100)+"%";$("experienceHeading").textContent=lang==="ko"?"실생활 한국어 연습":"Real-life Korean Practice";$("experienceNotice").textContent=lang==="ko"?"6개 상황에서 정답을 맞힌 횟수가 아닌 완료한 상황 수입니다.":"Different scenarios answered correctly out of six.";$("experienceLink").textContent=lang==="ko"?"실생활 연습 →":"Practice scenarios →";const reading=get("hs-reading-v1");const readingCount=Object.entries(reading).filter(([id,x])=>/^([1-9]|1[0-5])-([1-9]|[1-3][0-9]|40)$/.test(id)&&x&&x.done).length;$("readingStat").textContent=readingCount+" / 600";$("readingBar").style.width=(readingCount/6)+"%";$("readingHeading").textContent=lang==="ko"?"15단계 리딩 · 독서 진도":"15-level Reading · Progress";$("readingNotice").textContent=lang==="ko"?"읽기 평가에서 3문항을 모두 맞힌 책만 완료로 기록됩니다.":"A book is completed when all three reading questions are answered correctly.";$("readingLink").textContent=lang==="ko"?"리딩 도서관 →":"Reading library →";course.replaceChildren();stats.replaceChildren();mistakes.replaceChildren();let done=0,wrong=0,skills=0;
stages.forEach((s,i)=>{const state=get(s[3]),skill=get(s[2]+"-skills-v1");const count=Object.keys(state.done||{}).filter(x=>state.done[x]).length;const errors=Object.keys(state.mistakes||{}).filter(x=>state.mistakes[x]);const practiced=Object.keys(skill).filter(x=>skill[x]).length;done+=count;wrong+=errors.length;skills+=practiced;const card=document.createElement("article");card.className="card";const title=document.createElement("h3");title.textContent=s[lang==="ko"?0:1];const desc=document.createElement("p");desc.className="muted";desc.textContent=t.progress+": "+count+"/50 · "+t.mistakes+": "+errors.length;const bar=document.createElement("div");bar.className="bar";const fill=document.createElement("div");fill.style.width=Math.min(100,count*2)+"%";bar.append(fill);const link=document.createElement("a");link.href="./"+s[2];link.textContent=t.open;card.append(title,desc,bar,link);course.append(card);if(errors.length){const row=document.createElement("div");row.className="question";const strong=document.createElement("strong");strong.textContent=s[lang==="ko"?0:1]+" · "+errors.length+" "+t.mistakes;const go=document.createElement("a");go.href="./"+s[2]+"?review=1";go.textContent=t.review;row.append(strong,go);mistakes.append(row)}});
if(!wrong){const p=document.createElement("p");p.className="muted";p.textContent=t.none;mistakes.append(p)}
[[t.completed,done+"/350"],[t.mistakes,wrong],[t.practice,skills+"/1400"]].forEach(([name,value])=>{const c=document.createElement("div");c.className="card";const a=document.createElement("div");a.className="stat";a.textContent=value;const b=document.createElement("div");b.className="muted";b.textContent=name;c.append(a,b);stats.append(c)})}
$("language").onchange=e=>{lang=e.target.value;localStorage.setItem("hs-language",lang);render()};
$("exportBtn").onclick=()=>{const data={format:"hangeul-swipji-progress",version:1,exportedAt:new Date().toISOString(),records:{}};for(const key of keys()){const raw=localStorage.getItem(key);if(raw!==null){try{data.records[key]=JSON.parse(raw)}catch(e){}}}const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="hangeul-swipji-progress.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);$("status").textContent=strings[lang].exported};
$("importFile").onchange=async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;try{if(file.size>2_000_000)throw Error("large");const data=JSON.parse(await file.text());if(data.format!=="hangeul-swipji-progress"||data.version!==1||!data.records||typeof data.records!=="object"||Array.isArray(data.records))throw Error("format");for(const [k,v] of Object.entries(data.records)){if(!keys().includes(k)||v===null||typeof v!=="object"||Array.isArray(v))throw Error("record")}if(!confirm(strings[lang].importConfirm))return;for(const k of keys())localStorage.removeItem(k);for(const [k,v] of Object.entries(data.records))localStorage.setItem(k,JSON.stringify(v));$("status").textContent=strings[lang].saved;render()}catch(err){$("status").textContent=strings[lang].invalid}};
$("resetBtn").onclick=()=>{if(!confirm(strings[lang].resetConfirm))return;for(const k of keys())localStorage.removeItem(k);render();$("status").textContent=strings[lang].deleted};
render();
</script></body></html>
