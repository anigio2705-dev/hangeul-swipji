const units=[{"title":["음식 주문과 식당 회화","Ordering Food"],"desc":["메뉴를 고르고 음식을 주문하기","Choose dishes and order politely"],"v":[["메뉴","Menu"],["주문하다","To order"],["비빔밥","Bibimbap"],["물","Water"],["맛있다","To be delicious"],["계산하다","To pay the bill"]],"sent":[["비빔밥 하나 주세요.","One bibimbap, please."],["물도 주세요.","Please bring water, too."],["계산해 주세요.","The bill, please."]],"grammar":[["'주세요'는 물건이나 서비스를 정중하게 요청할 때 사용합니다. '도'는 'also/too'를 나타내는 보조사입니다.","Use '주세요' to make a polite request. The particle '도' means 'also/too'."],["비빔밥 하나 주세요. / 물도 주세요.","One bibimbap, please. / Water, too, please."]],"quiz":[["'계산해 주세요.'의 뜻은?","What does '계산해 주세요.' mean?",["Please sit down.","The bill, please.","Please come tomorrow.","Where is the menu?"],1],["'물___ 주세요.'에서 'also'의 의미를 더하는 조사는?","Which particle adds 'also' in '물___ 주세요.'?",["만","를","도","에"],2],["'One bibimbap, please.'에 맞는 문장은?","Which means 'One bibimbap, please.'?",["비빔밥 하나 주세요.","비빔밥이 맛있어요.","비빔밥을 먹었어요.","비빔밥이 없어요."],0],["'물도 주세요'에서 '도'의 뜻은?","What does 도 mean in 물도 주세요?",["only","also","from","until"],1],["다음 문장의 뜻은? 비빔밥 하나 주세요.","What does this sentence mean? 비빔밥 하나 주세요.",["Please bring water, too.","The bill, please.","One bibimbap, please.","Menu"],2]]},{"title":["날짜·시간·약속","Dates, Time and Appointments"],"desc":["약속 시간을 정하고 일정 이야기하기","Make plans and arrange a meeting"],"v":[["오늘","Today"],["내일","Tomorrow"],["어제","Yesterday"],["시간","Time"],["약속","Appointment"],["만나다","To meet"]],"sent":[["내일 세 시에 만나요.","Let's meet at three tomorrow."],["토요일에 시간이 있어요?","Are you free on Saturday?"],["약속이 있어서 못 가요.","I can't go because I have an appointment."]],"grammar":[["시간과 요일을 나타내는 말 뒤에는 보통 '에'를 붙입니다. 단, '오늘·내일·어제'에는 보통 붙이지 않습니다.","The time particle '에' commonly follows clock times and days, but is generally not added to 오늘, 내일, or 어제."],["세 시에 만나요. / 토요일에 만나요. / 내일 만나요.","Meet at three. / Meet on Saturday. / Meet tomorrow."]],"quiz":[["'내일'의 뜻은?","What does '내일' mean?",["Yesterday","Tomorrow","Today","Next year"],1],["'세 시___ 만나요.'에 알맞은 조사는?","Choose the particle: '세 시___ 만나요.'",["를","에서","에","은"],2],["'Are you free on Saturday?'에 맞는 문장은?","Which means 'Are you free on Saturday?'",["토요일에 시간이 있어요?","오늘 몇 시예요?","어제 만났어요?","내일 학교에 가요?"],0],["'세 시에'에서 시간 조사는?","Which particle marks time in 세 시에?",["은","에","을","도"],1],["다음 문장의 뜻은? 내일 세 시에 만나요.","What does this sentence mean? 내일 세 시에 만나요.",["Are you free on Saturday?","I can't go because I have an appointment.","Let's meet at three tomorrow.","Today"],2]]},{"title":["길 묻기와 교통수단","Directions and Transportation"],"desc":["장소의 위치를 묻고 이동하기","Ask for directions and use transportation"],"v":[["지하철","Subway"],["버스","Bus"],["정류장","Bus stop"],["오른쪽","Right"],["왼쪽","Left"],["곧장","Straight ahead"]],"sent":[["지하철역이 어디에 있어요?","Where is the subway station?"],["곧장 가다가 오른쪽으로 도세요.","Go straight, then turn right."],["버스로 학교에 가요.","I go to school by bus."]],"grammar":[["이동 방향에는 '으로/로'를 사용합니다. 일반적으로 받침이 있으면 '으로', 없으면 '로'를 씁니다. 받침 'ㄹ' 뒤에도 '로'를 씁니다.","Use '(으)로' for direction or means. Usually use '으로' after a final consonant, '로' after a vowel or a final ㄹ."],["오른쪽으로 가세요. / 버스로 가요. / 서울로 가요.","Go to the right. / Go by bus. / Go to Seoul."]],"quiz":[["'왼쪽'의 뜻은?","What does '왼쪽' mean?",["Right","Left","Straight","Behind"],1],["'버스___ 가요.' 알맞은 조사는?","Choose the particle: '버스___ 가요.'",["으로","로","에","를"],1],["'Go straight, then turn right.'에 맞는 문장은?","Which means 'Go straight, then turn right'?",["왼쪽으로 도세요.","버스를 타세요.","곧장 가다가 오른쪽으로 도세요.","지하철역이 어디예요?"],2],["'버스로'에서 수단을 나타내는 조사는?","Which particle marks means in 버스로?",["가","로","를","는"],1],["다음 문장의 뜻은? 지하철역이 어디에 있어요?","What does this sentence mean? 지하철역이 어디에 있어요?",["Go straight, then turn right.","I go to school by bus.","Where is the subway station?","Subway"],2]]},{"title":["과거 경험과 일상 이야기","Past Experiences"],"desc":["지난 일과 경험을 말하기","Talk about past events and experiences"],"v":[["여행","Travel"],["지난주","Last week"],["방문하다","To visit"],["보다","To see/watch"],["재미있다","To be interesting/fun"],["사진","Photo"]],"sent":[["지난주에 부산에 갔어요.","I went to Busan last week."],["친구와 영화를 봤어요.","I watched a movie with a friend."],["여행이 정말 재미있었어요.","The trip was really fun."]],"grammar":[["동사의 과거형은 보통 어간에 '-았/었어요'를 붙입니다. '가다 → 갔어요', '먹다 → 먹었어요'처럼 바뀝니다.","The polite past tense usually uses '-았/었어요': 가다 → 갔어요, 먹다 → 먹었어요."],["어제 영화를 봤어요. / 지난주에 여행했어요.","I watched a movie yesterday. / I traveled last week."]],"quiz":[["'지난주'의 뜻은?","What does '지난주' mean?",["Next week","This week","Last week","Last month"],2],["'가다'의 자연스러운 과거형은?","What is the past form of '가다'?",["가요","갔어요","갈 거예요","가세요"],1],["'I watched a movie with a friend.'에 맞는 문장은?","Which means 'I watched a movie with a friend'?",["친구와 영화를 봤어요.","친구와 영화를 볼 거예요.","친구가 영화를 봐요.","친구와 여행했어요."],0],["'가다'의 과거형은?","Which is the past tense of 가다?",["가요","갔어요","가세요","갈 거예요"],1],["다음 문장의 뜻은? 지난주에 부산에 갔어요.","What does this sentence mean? 지난주에 부산에 갔어요.",["I watched a movie with a friend.","The trip was really fun.","I went to Busan last week.","Travel"],2]]},{"title":["쇼핑과 부탁하기","Shopping and Requests"],"desc":["가격을 묻고 정중하게 요청하기","Ask about prices and make polite requests"],"v":[["가격","Price"],["싸다","To be cheap"],["비싸다","To be expensive"],["사이즈","Size"],["색깔","Color"],["바꾸다","To exchange/change"]],"sent":[["이 옷은 얼마예요?","How much is this item of clothing?"],["다른 사이즈가 있어요?","Do you have another size?"],["이것으로 바꿔 주세요.","Please exchange it for this one."]],"grammar":[["'-아/어 주세요'는 다른 사람에게 행동을 부탁할 때 씁니다. '바꾸다 → 바꿔 주세요', '보여 주다 → 보여 주세요'와 같이 활용합니다.","Use '-아/어 주세요' to ask someone politely to do something: 바꾸다 → 바꿔 주세요, 보여 주다 → 보여 주세요."],["이것을 보여 주세요. / 다른 사이즈로 바꿔 주세요.","Please show me this. / Please exchange it for another size."]],"quiz":[["'비싸다'의 뜻은?","What does '비싸다' mean?",["To be cheap","To be expensive","To be small","To be new"],1],["'바꾸다'를 정중한 부탁으로 바꾸면?","Which is a polite request using '바꾸다'?",["바꿨어요","바꿀 거예요","바꿔 주세요","바꾸지 않아요"],2],["'Do you have another size?'에 맞는 문장은?","Which means 'Do you have another size'?",["이 옷은 얼마예요?","다른 사이즈가 있어요?","이것으로 바꿔 주세요.","이 색깔이 좋아요."],1],["'바꾸다'의 정중한 부탁은?","Which is a polite request with 바꾸다?",["바꿨어요","바꿔 주세요","바꿀 거예요","바꾸지 마세요"],1],["다음 문장의 뜻은? 이 옷은 얼마예요?","What does this sentence mean? 이 옷은 얼마예요?",["Do you have another size?","Please exchange it for this one.","How much is this item of clothing?","Price"],2]]}];
const ui={ko:{back:"← 7단계 학습관",title:"초급 2 · 집중 학습",intro:"음식 주문·약속·교통·과거 경험·쇼핑을 단어 → 문장 → 문법 → 문제 → 오답 복습으로 학습하세요.",listTitle:"학습 목차",progress:"완료한 단원",tabs:["단어","문장","문법","연습문제","오답 복습"],listen:"🔊 듣기",quizHelp:"각 문항에 답한 뒤 채점하세요. 오답은 복습함에 저장됩니다.",submit:"채점하기",retry:"다시 풀기",next:"다음 단원 →",complete:"정답",incorrect:"오답",correctAnswer:"정답",result:"점수",empty:"아직 저장된 오답이 없습니다.",retryWrong:"오답만 다시 풀기",wrongHint:"오답을 다시 풀어 정답을 맞히면 복습함에서 제거됩니다.",warning:"진도와 오답은 현재 브라우저에만 저장됩니다. 기기나 브라우저를 변경하거나 데이터를 삭제하면 기록이 사라질 수 있습니다. 발음은 기기의 한국어 음성 합성 기능을 사용합니다.",noSpeech:"이 기기는 음성 재생을 지원하지 않습니다.",choose:"모든 문항에 답을 선택해 주세요.",done:"복습 완료",all:"전체"},en:{back:"← Seven-Stage Academy",title:"Beginner 2 · Learning Lab",intro:"Study five units in order: Vocabulary → Sentences → Grammar → Practice → Mistake Review.",listTitle:"Course Units",progress:"Units completed",tabs:["Vocabulary","Sentences","Grammar","Practice","Mistake Review"],listen:"🔊 Listen",quizHelp:"Answer every question, then check your score. Incorrect answers are saved for review.",submit:"Check Answers",retry:"Try Again",next:"Next Unit →",complete:"Correct",incorrect:"Incorrect",correctAnswer:"Answer",result:"Score",empty:"No mistakes saved yet.",retryWrong:"Practice My Mistakes",wrongHint:"Correctly answering a review question removes it from your mistake list.",warning:"Progress and mistakes are stored only in this browser. Changing devices, browsers, or clearing data may erase them. Audio uses your device's Korean text-to-speech.",noSpeech:"Speech playback is not available on this device.",choose:"Please answer every question.",done:"Review complete",all:"All"}};
const $=id=>document.getElementById(id);let lang=localStorage.getItem("hs-language")==="en"?"en":"ko",unit=0,tab=0,selected={},reviewMode=false;
let state;try{state=JSON.parse(localStorage.getItem("hs-beginner2-v1")||"{}")}catch(e){state={}}if(!state.done)state.done={};if(!state.mistakes)state.mistakes={};
const key=(u,q)=>u+"-"+q;const save=()=>{try{localStorage.setItem("hs-beginner2-v1",JSON.stringify(state))}catch(e){}};
function speak(s){if(!("speechSynthesis" in window)){alert(ui[lang].noSpeech);return}speechSynthesis.cancel();const a=new SpeechSynthesisUtterance(s);a.lang="ko-KR";a.rate=.82;speechSynthesis.speak(a)}
function button(label,fn,cls="btn"){const b=document.createElement("button");b.className=cls;b.textContent=label;b.onclick=fn;return b}
function render(){const t=ui[lang],k=lang==="ko"?0:1;document.documentElement.lang=lang;$("lang").value=lang;for(const id of ["back","title","intro","listTitle","warning"])$(id).textContent=t[id];const nav=$("nav");nav.replaceChildren();units.forEach((u,i)=>nav.append(button((state.done[i]?"✓ ":"")+(i+1)+". "+u.title[k],()=>{unit=i;tab=0;reviewMode=false;selected={};render()},""+(unit===i?"active":""))));$("progressLabel").textContent=t.progress+": "+Object.keys(state.done).filter(x=>state.done[x]).length+" / "+units.length;$("progressBar").style.width=(Object.keys(state.done).filter(x=>state.done[x]).length/units.length*100)+"%";$("lessonTitle").textContent=units[unit].title[k];$("lessonDesc").textContent=units[unit].desc[k];const tabs=$("tabs");tabs.replaceChildren();t.tabs.forEach((v,i)=>tabs.append(button(v,()=>{tab=i;reviewMode=false;selected={};render()},""+(tab===i?"active":""))));const content=$("content");content.replaceChildren();if(tab===0||tab===1){for(const pair of (tab===0?units[unit].v:units[unit].sent)){const item=document.createElement("div");item.className="item";const a=document.createElement("div"),b=document.createElement("strong"),c=document.createElement("span");b.textContent=pair[0];c.textContent=pair[1];a.append(b,c);item.append(a,button(t.listen,()=>speak(pair[0]),"listen"));content.append(item)}}else if(tab===2){for(const pair of units[unit].grammar){const p=document.createElement("p");p.className="grammar";p.textContent=pair[k];content.append(p)}}else if(tab===3){renderQuiz(content,units[unit].quiz.map((q,i)=>({u:unit,i,q})),false)}else renderReview(content)}
function renderQuiz(host,items,isReview){const t=ui[lang],k=lang==="ko"?0:1;host.replaceChildren();const note=document.createElement("p");note.className="muted";note.textContent=isReview?t.wrongHint:t.quizHelp;host.append(note);if(!items.length){const p=document.createElement("p");p.className="muted";p.textContent=t.empty;host.append(p);return}items.forEach(({u,i,q},n)=>{const section=document.createElement("div");section.className="mistake";const p=document.createElement("div");p.className="question";p.textContent=(n+1)+". "+q[k];section.append(p);const opts=document.createElement("div");opts.className="choices";q[2].forEach((answer,j)=>{const b=button(answer,()=>{selected[key(u,i)]=j;renderOptions(opts,j)},"choice");b.setAttribute("aria-pressed",String(selected[key(u,i)]===j));opts.append(b)});section.append(opts);host.append(section)});const msg=document.createElement("div");msg.className="feedback";msg.setAttribute("aria-live","polite");host.append(msg);host.append(button(t.submit,()=>{if(items.some(({u,i})=>selected[key(u,i)]===undefined)){msg.textContent=t.choose;return}let good=0;items.forEach(({u,i,q})=>{const id=key(u,i);if(selected[id]===q[3]){good++;delete state.mistakes[id]}else state.mistakes[id]=true});if(!isReview&&good===items.length)state.done[unit]=true;save();msg.textContent=t.result+": "+good+" / "+items.length;const results=document.createElement("div");items.forEach(({u,i,q})=>{const p=document.createElement("p");p.className="mistake";p.textContent=(selected[key(u,i)]===q[3]?"✓ ":"✗ ")+q[k]+" — "+t.correctAnswer+": "+q[2][q[3]];results.append(p)});host.append(results);const row=document.createElement("div");row.className="row";row.append(button(t.retry,()=>{selected={};render()}, "btn secondary"));if(!isReview&&unit<units.length-1)row.append(button(t.next,()=>{unit++;tab=0;selected={};render()}));if(isReview)row.append(button(t.retryWrong,()=>{selected={};render()}));host.append(row);for(const b of host.querySelectorAll(".choice"))b.disabled=tr
