"use strict";
const units=[{"title":["음식 주문과 식당 회화","Ordering Food"],"desc":["메뉴를 고르고 음식을 주문하기","Choose dishes and order politely"],"v":[["메뉴","Menu"],["주문하다","To order"],["비빔밥","Bibimbap"],["물","Water"],["맛있다","To be delicious"],["계산하다","To pay the bill"]],"sent":[["비빔밥 하나 주세요.","One bibimbap, please."],["물도 주세요.","Please bring water, too."],["계산해 주세요.","The bill, please."]],"grammar":[["'주세요'는 물건이나 서비스를 정중하게 요청할 때 사용합니다. '도'는 'also/too'를 나타내는 보조사입니다.","Use '주세요' to make a polite request. The particle '도' means 'also/too'."],["비빔밥 하나 주세요. / 물도 주세요.","One bibimbap, please. / Water, too, please."]],"quiz":[["'계산해 주세요.'의 뜻은?","What does '계산해 주세요.' mean?",["Please sit down.","The bill, please.","Please come tomorrow.","Where is the menu?"],1],["'물___ 주세요.'에서 'also'의 의미를 더하는 조사는?","Which particle adds 'also' in '물___ 주세요.'?",["만","를","도","에"],2],["'One bibimbap, please.'에 맞는 문장은?","Which means 'One bibimbap, please.'?",["비빔밥 하나 주세요.","비빔밥이 맛있어요.","비빔밥을 먹었어요.","비빔밥이 없어요."],0],["'물도 주세요'에서 '도'의 뜻은?","What does 도 mean in 물도 주세요?",["only","also","from","until"],1],["다음 문장의 뜻은? 비빔밥 하나 주세요.","What does this sentence mean? 비빔밥 하나 주세요.",["Please bring water, too.","The bill, please.","One bibimbap, please.","Menu"],2]]},{"title":["날짜·시간·약속","Dates, Time and Appointments"],"desc":["약속 시간을 정하고 일정 이야기하기","Make plans and arrange a meeting"],"v":[["오늘","Today"],["내일","Tomorrow"],["어제","Yesterday"],["시간","Time"],["약속","Appointment"],["만나다","To meet"]],"sent":[["내일 세 시에 만나요.","Let's meet at three tomorrow."],["토요일에 시간이 있어요?","Are you free on Saturday?"],["약속이 있어서 못 가요.","I can't go because I have an appointment."]],"grammar":[["시간과 요일을 나타내는 말 뒤에는 보통 '에'를 붙입니다. 단, '오늘·내일·어제'에는 보통 붙이지 않습니다.","The time particle '에' commonly follows clock times and days, but is generally not added to 오늘, 내일, or 어제."],["세 시에 만나요. / 토요일에 만나요. / 내일 만나요.","Meet at three. / Meet on Saturday. / Meet tomorrow."]],"quiz":[["'내일'의 뜻은?","What does '내일' mean?",["Yesterday","Tomorrow","Today","Next year"],1],["'세 시___ 만나요.'에 알맞은 조사는?","Choose the particle: '세 시___ 만나요.'",["를","에서","에","은"],2],["'Are you free on Saturday?'에 맞는 문장은?","Which means 'Are you free on Saturday?'",["토요일에 시간이 있어요?","오늘 몇 시예요?","어제 만났어요?","내일 학교에 가요?"],0],["'세 시에'에서 시간 조사는?","Which particle marks time in 세 시에?",["은","에","을","도"],1],["다음 문장의 뜻은? 내일 세 시에 만나요.","What does this sentence mean? 내일 세 시에 만나요.",["Are you free on Saturday?","I can't go because I have an appointment.","Let's meet at three tomorrow.","Today"],2]]},{"title":["길 묻기와 교통수단","Directions and Transportation"],"desc":["장소의 위치를 묻고 이동하기","Ask for directions and use transportation"],"v":[["지하철","Subway"],["버스","Bus"],["정류장","Bus stop"],["오른쪽","Right"],["왼쪽","Left"],["곧장","Straight ahead"]],"sent":[["지하철역이 어디에 있어요?","Where is the subway station?"],["곧장 가다가 오른쪽으로 도세요.","Go straight, then turn right."],["버스로 학교에 가요.","I go to school by bus."]],"grammar":[["이동 방향에는 '으로/로'를 사용합니다. 일반적으로 받침이 있으면 '으로', 없으면 '로'를 씁니다. 받침 'ㄹ' 뒤에도 '로'를 씁니다.","Use '(으)로' for direction or means. Usually use '으로' after a final consonant, '로' after a vowel or a final ㄹ."],["오른쪽으로 가세요. / 버스로 가요. / 서울로 가요.","Go to the right. / Go by bus. / Go to Seoul."]],"quiz":[["'왼쪽'의 뜻은?","What does '왼쪽' mean?",["Right","Left","Straight","Behind"],1],["'버스___ 가요.' 알맞은 조사는?","Choose the particle: '버스___ 가요.'",["으로","로","에","를"],1],["'Go straight, then turn right.'에 맞는 문장은?","Which means 'Go straight, then turn right'?",["왼쪽으로 도세요.","버스를 타세요.","곧장 가다가 오른쪽으로 도세요.","지하철역이 어디예요?"],2],["'버스로'에서 수단을 나타내는 조사는?","Which particle marks means in 버스로?",["가","로","를","는"],1],["다음 문장의 뜻은? 지하철역이 어디에 있어요?","What does this sentence mean? 지하철역이 어디에 있어요?",["Go straight, then turn right.","I go to school by bus.","Where is the subway station?","Subway"],2]]},{"title":["과거 경험과 일상 이야기","Past Experiences"],"desc":["지난 일과 경험을 말하기","Talk about past events and experiences"],"v":[["여행","Travel"],["지난주","Last week"],["방문하다","To visit"],["보다","To see/watch"],["재미있다","To be interesting/fun"],["사진","Photo"]],"sent":[["지난주에 부산에 갔어요.","I ":"I repaired the broken chair."},{"speaker":"B","ko":"방을 청소해야 해요.","en":"I have to clean my room."},{"speaker":"A","ko":"빨래를 하고 있어요.","en":"I'm doing the laundry."}],"focus":["핵심 표현 '고치다'을 문맥 속에서 익히고 문장 '고장 난 의자를 고쳤어요.'에 적용하세요.","Study '고치다' in context and apply it to '고장 난 의자를 고쳤어요.'."],"task":["세 문장으로 상황 대화를 연습하고, 요청·시간·장소 표현을 바꾸어 말해 보세요.","Practice a three-line dialogue and change its requests, time, or location."]}];units.forEach((u,i)=>{u.manuscript=authoredManuscripts[i]});function renderManuscript(){const m=units[unit].manuscript,host=document.getElementById("manuscriptBody");if(!host||!m)return;host.replaceChildren();const k=lang==="ko"?0:1;document.getElementById("manuscriptHeading").textContent=lang==="ko"?"상황별 회화 원고":"Situational conversation manuscript";const h=document.createElement("h3");h.textContent=m.scene[k];host.append(h);m.dialogue.forEach(line=>{const p=document.createElement("p");p.textContent=line.speaker+": "+line.ko+" — "+line.en;host.append(p)});const p=document.createElement("p");p.textContent=m.focus[k];host.append(p);const task=document.createElement("p");task.textContent=m.task[k];host.append(task)};function renderCoach(){const u=units[unit],k=lang==="ko"?0:1,phrase=u.sent?.[0]?.[0]||u.v?.[0]?.[0]||"",translation=u.sent?.[0]?.[1]||u.v?.[0]?.[1]||"";const h=document.getElementById("coachHeading");if(!h)return;h.textContent=lang==="ko"?"오늘의 학습 목표 · 실제 사용":"Today's learning target · Use it in context";document.getElementById("coachGoal").textContent=lang==="ko"?"이번 단원의 핵심 표현을 읽고, 듣고, 의미를 확인한 뒤 자신의 상황에 맞게 바꾸어 말해 보세요. 주제: "+u.title[0]:"Read, listen and understand this unit's target expression. Then adapt it to a real situation. Topic: "+u.title[1];document.getElementById("coachPhrase").textContent=phrase;const t=document.getElementById("coachTranslation");t.textContent=translation;t.hidden=true;document.getElementById("coachChallenge").textContent=lang==="ko"?"연습 과제: 핵심 표현을 소리 내어 3번 읽고, 어휘 하나를 바꾸어 새로운 표현을 만들어 보세요.":"Practice: Say the expression aloud three times. Replace one word to create a new expression.";document.getElementById("coachListen").textContent=lang==="ko"?"🔊 핵심 표현 듣기":"🔊 Hear expression";document.getElementById("coachReveal").textContent=lang==="ko"?"표현 뜻 확인":"Reveal meaning";document.getElementById("coachGo").textContent=lang==="ko"?"실생활 상황에서 연습하기 →":"Try a real-life scenario →";document.getElementById("coachListen").onclick=()=>speak(phrase);document.getElementById("coachReveal").onclick=()=>{t.hidden=!t.hidden}}
function render(){const t=ui[lang],k=lang==="ko"?0:1;document.documentElement.lang=lang;$("lang").value=lang;for(const id of ["back","title","intro","listTitle","warning"])$(id).textContent=t[id];const nav=$("nav");nav.replaceChildren();const lessonFilter=$("filterLessons").value.trim().toLocaleLowerCase();units.forEach((u,i)=>{const label=(i+1)+". "+u.title[k];const item=button((state.done[i]?"✓ ":"")+label,()=>{unit=i;tab=0;reviewMode=false;selected={};render()},""+(unit===i?"active":""));item.style.display=!lessonFilter||label.toLocaleLowerCase().includes(lessonFilter)?"":"none";nav.append(item)});$("progressLabel").textContent=t.progress+": "+Object.keys(state.done).filter(x=>state.done[x]).length+" / "+units.length;$("progressBar").style.width=(Object.keys(state.done).filter(x=>state.done[x]).length/units.length*100)+"%";$("lessonTitle").textContent=units[unit].title[k];$("lessonDesc").textContent=units[unit].desc[k];renderCoach();renderManuscript();const tabs=$("tabs");tabs.replaceChildren();t.tabs.forEach((v,i)=>tabs.append(button(v,()=>{tab=i;reviewMode=false;selected={};render()},""+(tab===i?"active":""))));const content=$("content");content.replaceChildren();if(tab===0||tab===1){for(const pair of (tab===0?units[unit].v:units[unit].sent)){const item=document.createElement("div");item.className="item";const a=document.createElement("div"),b=document.createElement("strong"),c=document.createElement("span");b.textContent=pair[0];c.textContent=pair[1];a.append(b,c);item.append(a,button(t.listen,()=>speak(pair[0]),"listen"));content.append(item)}}else if(tab===2){for(const pair of units[unit].grammar){const p=document.createElement("p");p.className="grammar";p.textContent=pair[k];content.append(p)}}else if(tab===3){renderQuiz(content,units[unit].quiz.map((q,i)=>({u:unit,i,q})),false)}else renderReview(content)}

ue;for(const b of host.querySelectorAll("button"))if(b.textContent===t.submit)b.disabled=true;renderNavOnly()}, "btn"))}
function renderOptions(host,index){[...host.children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i===index)))}
function renderNavOnly(){const t=ui[lang],k=lang==="ko"?0:1;[...$("nav").children].forEach((b,i)=>b.textContent=(state.done[i]?"✓ ":"")+(i+1)+". "+units[i].title[k]);$("progressLabel").textContent=t.progress+": "+Object.keys(state.done).filter(x=>state.done[x]).length+" / "+units.length;$("progressBar").style.width=(Object.keys(state.done).filter(x=>state.done[x]).length/units.length*100)+"%"}
function renderReview(host){const items=[];for(const id of Object.keys(state.mistakes)){const [u,i]=id.split("-").map(Number);if(u===unit&&units[u]&&units[u].quiz[i])items.push({u,i,q:units[u].quiz[i]})}renderQuiz(host,items,true)}
$("filterLessons").addEventListener("input",()=>{const q=$("filterLessons").value.trim().toLocaleLowerCase();[...$("nav").children].forEach((b,i)=>{b.style.display=!q||((i+1)+". "+units[i].title[lang==="ko"?0:1]).toLocaleLowerCase().includes(q)?"":"none"})});$("lang").onchange=e=>{lang=e.target.value;localStorage.setItem("hs-language",lang);selected={};render()};if(new URLSearchParams(location.search).has("review")){tab=4;const first=Object.keys(state.mistakes||{}).find(id=>state.mistakes[id]&&/^\d+-\d+$/.test(id));if(first)unit=Math.min(units.length-1,Number(first.split("-")[0]))}render();
