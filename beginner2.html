@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;800&family=Outfit:wght@500;700;900&display=swap');body{font-family:'DM Sans','Noto Sans KR',sans-serif;background:#faf9ff}.hero{background:linear-gradient(115deg,#31216c,#158c88);border-radius:22px}.hero h1{font-family:Outfit,'Noto Sans KR',sans-serif}.panel{border-radius:19px}.btn{background:#6f56df;color:white;border-radius:11px}#coachPhrase{color:#2c3370}</style></head><body><header><div class="wrap"><a class="logo" href="./">한글쉽지</a><a class="back" href="./learn.html?level=2" id="back"></a><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></div></header><main class="wrap"><div class="hero"><small>BEGINNER 2 · LEARNING LAB</small><h1 id="title"></h1><p id="intro"></p></div><div class="layout"><aside class="panel"><h3 id="listTitle"></h3><div class="muted" id="progressLabel"></div><div class="bar"><div id="progressBar"></div></div><label for="filterLessons" style="display:block;font-size:13px;margin:10px 0 6px">단원 검색 / Find lesson</label><input id="filterLessons" type="search" placeholder="단원명 / Lesson title" aria-label="Search lessons" style="width:100%;max-width:100%;padding:10px;border:1px solid #c6d4ea;border-radius:8px;margin-bottom:10px"><div class="nav" id="nav"></div></aside><div><section class="panel"><h2 id="lessonTitle"></h2><p class="muted" id="lessonDesc"></p><div class="tabs" id="tabs"></div><div id="content"></div></section><section class="panel"><h2 id="manuscriptHeading"></h2><div id="manuscriptBody"></div></section><section class="panel" id="recallPanel"><h2 id="recallHeading"></h2><p id="recallHelp"></p><p id="recallPrompt"></p><label for="recallAnswer">Korean answer</label><input id="recallAnswer"><button id="recallCheck">Check</button><button id="recallReveal">Reveal</button><button id="recallReview">Review due</button><p id="recallFeedback"></p><p id="recallDue"></p><p id="recallStats"></p></section><section class="panel" id="lessonCoach" style="margin-top:17px;background:linear-gradient(135deg,#f1efff,#eafff6);border:1px solid #ddd8ff"><h2 id="coachHeading">오늘의 학습 목표</h2><p id="coachGoal" style="line-height:1.8;color:#4b5872"></p><div style="display:flex;gap:10px;flex-wrap:wrap;margin:15px 0"><button id="coachListen" class="btn" type="button">🔊 핵심 문장 듣기</button><button id="coachReveal" class="btn" type="button">표현 뜻 확인</button></div><p id="coachPhrase" style="font-size:20px;font-weight:850;line-height:1.7"></p><p id="coachTranslation" style="line-height:1.7;color:#5b6c80" hidden></p><p id="coachChallenge" style="font-size:14px;color:#596985;line-height:1.7"></p><a href="./experience.html" style="display:inline-block;margin-top:12px;background:#6c53dc;color:white;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:800" id="coachGo">실생활 상황에서 연습하기 →</a></section></div></div><p class="warning" id="warning"></p><p style="margin:18px 0"><a href="./reading.html" style="color:#087d77;font-weight:800">📚 15단계 리딩 · Reading Library →</a></p><p style="margin:18px 0"><a href="./dashboard.html" style="color:#315de5;font-weight:700">📊 My Learning Dashboard / 나의 학습 대시보드 →</a></p><section id="skillArea" class="skill-area" aria-label="Four skill practice"></section></main><script>
"use strict";
const units=[{"title":["음식 주문과 식당 회화","Ordering Food"],"desc":["메뉴를 고르고 음식을 주문하기","Choose dishes and order politely"],"v":[["메뉴","Menu"],["주문하다","To order"],["비빔밥","Bibimbap"],["물","Water"],["맛있다","To be delicious"],["계산하다","To pay the bill"]],"sent":[["비빔밥 하나 주세요.","One bibimbap, please."],["물도 주세요.","Please bring water, too."],["계산해 주세요.","The bill, please."]],"grammar":[["'주세요'는 물건이나 서비스를 정중하게 요청할 때 사용합니다. '도'는 'also/too'를 나타내는 보조사입니다.","Use '주세요' to make a polite request. The particle '도' means 'also/too'."],["비빔밥 하나 주세요. / 물도 주세요.","One bibimbap, please. / Water, too, please."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. Please bring water, too. → 물도 주세요.","Self-check: cover the Korean, say this from its meaning, then compare. Please bring water, too. → 물도 주세요."]],"quiz":[["'계산해 주세요.'의 뜻은?","What does '계산해 주세요.' mean?",["Please sit down.","Where is the menu?","The bill, please.","Please come tomorrow."],2],["'물___ 주세요.'에서 'also'의 의미를 더하는 조사는?","Which particle adds 'also' in '물___ 주세요.'?",["에","도","를","만"],1],["'One bibimbap, please.'에 맞는 문장은?","Which means 'One bibimbap, please.'?",["비빔밥이 맛있어요.","비빔밥을 먹었어요.","비빔밥이 없어요.","비빔밥 하나 주세요."],3],["'물도 주세요'에서 '도'의 뜻은?","What does 도 mean in 물도 주세요?",["also","until","from","only"],0],["다음 문장의 뜻은? 비빔밥 하나 주세요.","What does this sentence mean? 비빔밥 하나 주세요.",["Please bring water, too.","One bibimbap, please.","Menu","The bill, please."],1]]},{"title":["날짜·시간·약속","Dates, Time and Appointments"],"desc":["약속 시간을 정하고 일정 이야기하기","Make plans and arrange a meeting"],"v":[["오늘","Today"],["내일","Tomorrow"],["어제","Yesterday"],["시간","Time"],["약속","Appointment"],["만나다","To meet"]],"sent":[["내일 세 시에 만나요.","Let's meet at three tomorrow."],["토요일에 시간이 있어요?","Are you free on Saturday?"],["약속이 있어서 못 가요.","I can't go because I have an appointment."]],"grammar":[["시간과 요일을 나타내는 말 뒤에는 보통 '에'를 붙입니다. 단, '오늘·내일·어제'에는 보통 붙이지 않습니다.","The time particle '에' commonly follows clock times and days, but is generally not added to 오늘, 내일, or 어제."],["세 시에 만나요. / 토요일에 만나요. / 내일 만나요.","Meet at three. / Meet on Saturday. / Meet tomorrow."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. Are you free on Saturday? → 토요일에 시간이 있어요?","Self-check: cover the Korean, say this from its meaning, then compare. Are you free on Saturday? → 토요일에 시간이 있어요?"]],"quiz":[["'내일'의 뜻은?","What does '내일' mean?",["Yesterday","Today","Next year","Tomorrow"],3],["'세 시___ 만나요.'에 알맞은 조사는?","Choose the particle: '세 시___ 만나요.'",["를","은","에서","에"],3],["'Are you free on Saturday?'에 맞는 문장은?","Which means 'Are you free on Saturday?'",["토요일에 시간이 있어요?","오늘 몇 시예요?","내일 학교에 가요?","어제 만났어요?"],0],["'세 시에'에서 시간 조사는?","Which particle marks time in 세 시에?",["에","은","을","도"],0],["다음 문장의 뜻은? 내일 세 시에 만나요.","What does this sentence mean? 내일 세 시에 만나요.",["Today","I can't go because I have an appointment.","Are you free on Saturday?","Let's meet at three tomorrow."],3]]},{"title":["길 묻기와 교통수단","Directions and Transportation"],"desc":["장소의 위치를 묻고 이동하기","Ask for directions and use transportation"],"v":[["지하철","Subway"],["버스","Bus"],["정류장","Bus stop"],["오른쪽","Right"],["왼쪽","Left"],["곧장","Straight ahead"]],"sent":[["지하철역이 어디에 있어요?","Where is the subway station?"],["곧장 가다가 오른쪽으로 도세요.","Go straight, then turn right."],["버스로 학교에 가요.","I go to school by bus."]],"grammar":[["이동 방향에는 '으로/로'를 사용합니다. 일반적으로 받침이 있으면 '으로', 없으면 '로'를 씁니다. 받침 'ㄹ' 뒤에도 '로'를 씁니다.","Use '(으)로' for direction or means. Usually use '으로' after a final consonant, '로' after a vowel or a final ㄹ."],["오른쪽으로 가세요. / 버스로 가요. / 서울로 가요.","Go to the right. / Go by bus. / Go to Seoul."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. Go straight, then turn right. → 곧장 가다가 오른쪽으로 도세요.","Self-check: cover the Korean, say this from its meaning, then compare. Go straight, then turn right. → 곧장 가다가 오른쪽으로 도세요."]],"quiz":[["'왼쪽'의 뜻은?","What does '왼쪽' mean?",["Right","Behind","Left","Straight"],2],["'버스___ 가요.'에서 교통수단을 나타내는 조사는?","Which particle means by bus in 버스___ 가요?",["으로","로","를","에"],1],["'Go straight, then turn right.'에 맞는 문장은?","Which means 'Go straight, then turn right'?",["지하철역이 어디예요?","곧장 가다가 오른쪽으로 도세요.","버스를 타세요.","왼쪽으로 도세요."],1],["'버스로'에서 수단을 나타내는 조사는?","Which particle marks means in 버스로?",["로","를","는","가"],0],["다음 문장의 뜻은? 지하철역이 어디에 있어요?","What does this sentence mean? 지하철역이 어디에 있어요?",["Subway","Where is the subway station?","I go to school by bus.","Go straight, then turn right."],1]]},{"title":["과거 경험과 일상 이야기","Past Experiences"],"desc":["지난 일과 경험을 말하기","Talk about past events and experiences"],"v":[["여행","Travel"],["지난주","Last week"],["방문하다","To visit"],["보다","To see/watch"],["재미있다","To be interesting/fun"],["사진","Photo"]],"sent":[["지난주에 부산에 갔어요.","I went to Busan last week."],["친구와 영화를 봤어요.","I watched a movie with a friend."],["여행이 정말 재미있었어요.","The trip was really fun."]],"grammar":[["동사의 과거형은 보통 어간에 '-았/었어요'를 붙입니다. '가다 → 갔어요', '먹다 → 먹었어요'처럼 바뀝니다.","The polite past tense usually uses '-았/었어요': 가다 → 갔어요, 먹다 → 먹었어요."],["어제 영화를 봤어요. / 지난주에 여행했어요.","I watched a movie yesterday. / I traveled last week."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. I watched a movie with a friend. → 친구와 영화를 봤어요.","Self-check: cover the Korean, say this from its meaning, then compare. I watched a movie with a friend. → 친구와 영화를 봤어요."]],"quiz":[["'지난주'의 뜻은?","What does '지난주' mean?",["Last month","Next week","This week","Last week"],3],["'가다'의 자연스러운 과거형은?","What is the past form of '가다'?",["갔어요","가세요","갈 거예요","가요"],0],["'I watched a movie with a friend.'에 맞는 문장은?","Which means 'I watched a movie with a friend'?",["친구와 여행했어요.","친구가 영화를 봐요.","친구와 영화를 볼 거예요.","친구와 영화를 봤어요."],3],["어제 여행이 재미있___. 과거형으로 완성하세요.","Complete the past-tense sentence.",["으세요","어요","었어요","을 거예요"],2],["다음 문장의 뜻은? 지난주에 부산에 갔어요.","What does this sentence mean? 지난주에 부산에 갔어요.",["I watched a movie with a friend.","I went to Busan last week.","Travel","The trip was really fun."],1]]},{"title":["쇼핑과 부탁하기","Shopping and Requests"],"desc":["가격을 묻고 정중하게 요청하기","Ask about prices and make polite requests"],"v":[["가격","Price"],["싸다","To be cheap"],["비싸다","To be expensive"],["사이즈","Size"],["색깔","Color"],["바꾸다","To exchange/change"]],"sent":[["이 옷은 얼마예요?","How much is this item of clothing?"],["다른 사이즈가 있어요?","Do you have another size?"],["이것으로 바꿔 주세요.","Please exchange it for this one."]],"grammar":[["'-아/어 주세요'는 다른 사람에게 행동을 부탁할 때 씁니다. '바꾸다 → 바꿔 주세요', '보여 주다 → 보여 주세요'와 같이 활용합니다.","Use '-아/어 주세요' to ask someone politely to do something: 바꾸다 → 바꿔 주세요, 보여 주다 → 보여 주세요."],["이것을 보여 주세요. / 다른 사이즈로 바꿔 주세요.","Please show me this. / Please exchange it for another size."],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. Do you have another size? → 다른 사이즈가 있어요?","Self-check: cover the Korean, say this from its meaning, then compare. Do you have another size? → 다른 사이즈가 있어요?"]],"quiz":[["'비싸다'의 뜻은?","What does '비싸다' mean?",["To be new","To be expensive","To be cheap","To be small"],1],["'바꾸다'를 정중한 부탁으로 바꾸면?","Which is a polite request using '바꾸다'?",["바꾸지 않아요","바꿀 거예요","바꿨어요","바꿔 주세요"],3],["'Do you have another size?'에 맞는 문장은?","Which means 'Do you have another size'?",["다른 사이즈가 있어요?","이것으로 바꿔 주세요.","이 옷은 얼마예요?","이 색깔이 좋아요."],0],["물건을 바꾸기 전에 가능 여부를 묻는 말은?","Which asks whether an exchange is possible?",["바꿀 거예요.","바꿀 수 있어요?","바꿨어요.","바꾸지 마세요."],1],["다음 문장의 뜻은? 이 옷은 얼마예요?","What does this sentence mean? 이 옷은 얼마예요?",["Price","How much is this item of clothing?","Do you have another size?","Please exchange it for this one."],1]]},{"title":["식당 1 · 두 명 자리 있어요?","Restaurant 1 · reservation"],"desc":["식당의 표현과 문장을 읽고 듣고 활용합니다.","Practice expressions and sentences in Restaurant."],"v":[["예약","reservation"],["주문","order"],["반찬","side dish"],["계산","bill"],["맵다","spicy"],["추천","recommendation"]],"sent":[["두 명 자리 있어요?","Do you have a table for two?"],["이 음식은 맵지 않아요?","Isn't this dish spicy?"],["추천 메뉴가 뭐예요?","What do you recommend?"]],"grammar":[["두 명 자리는 두 사람이 앉는 자리입니다. 명 앞에서 둘은 두로 바뀌고, 있어요?는 자리가 있는지 묻습니다.","두 명 자리 means seats for two people. 둘 becomes 두 before 명; 있어요? asks about availability."],["두 명 자리 있어요?","Do you have a table for two?"],["혼자 연습: 해석만 보고 다음 문장을 말한 뒤 원문과 비교하세요. Isn const authoredManuscripts=[{"scene":["음식 주문과 식당 회화 — 실생활 대화 연습","Ordering Food — practical conversation"],"dialogue":[{"speaker":"A","ko":"오늘은 ‘음식 주문과 식당 회화’에 대해 연습해요.","en":"Let's practice Ordering Food today."},{"speaker":"B","ko":"비빔밥 하나 주세요.","en":"One bibimbap, please."},{"speaker":"A","ko":"다른 표현도 말해 볼래요?","en":"Can you try another expression?"},{"speaker":"B","ko":"물도 주세요.","en":"Please bring water, too."},{"speaker":"A","ko":"좋아요. 마지막 문장도 말해 보세요.","en":"Good. Please say the last sentence too."},{"speaker":"B","ko":"계산해 주세요.","en":"The bill, please."}],"focus":["'주세요'는 물건이나 서비스를 정중하게 요청할 때 사용합니다. '도'는 'also/too'를 나타내는 보조사입니다. 비빔밥 하나 주세요. / 물도 주세요.","Use '주세요' to make a polite request. The particle '도' means 'also/too'. One bibimbap, please. / Water, too, please."],"task":["‘비빔밥 하나 주세요.’을 소리 내어 읽고, ‘물도 주세요.’과 ‘계산해 주세요.’을 사용해 두 사람이 대화해 보세요.","Read \"One bibimbap, please.\" aloud, then role-play a conversation using \"Please bring water, too.\" and \"The bill, please.\"."],"checks":[["'계산해 주세요.'의 뜻은?","What does '계산해 주세요.' mean?",["Please sit down.","The bill, please.","Please come tomorrow.","Where is the menu?"],1],["'물___ 주세요.'에서 'also'의 의미를 더하는 조사는?","Which particle adds 'also' in '물___ 주세요.'?",["만","를","도","에"],2]]},{"scene":["날짜·시간·약속 — 실생활 대화 연습","Dates, Time and Appointments — practical conversation"],"dialogue":[{"speaker":"A","ko":"오늘은 ‘날짜·시간·약속’에 대해 연습해요.","en":"Let's practice Dates, Time and Appointments today."},{"speaker":"B","ko":"내일 세 시에 만나요.","en":"Let's meet at three tomorrow."},{"speaker":"A","ko":"다른 표현도 말해 볼래요?","en":"Can you try another expression?"},{"speaker":"B","ko":"토요일에 시간이 있어요?","en":"Are you free on Saturday?"},{"speaker":"A","ko":"좋아요. 마지막 문장도 말해 보세요.","en":"Good. Please say the last sentence too."},{"speaker":"B","ko":"약속이 있어서 못 가요.","en":"I can't go because I have an appointment."}],"focus":["시간과 요일을 나타내는 말 뒤에는 보통 '에'를 붙입니다. 단, '오늘·내일·어제'에는 보통 붙이지 않습니다. 세 시에 만나요. / 토요일에 만나요. / 내일 만나요.","The time particle '에' commonly follows clock times and days, but is generally not added to 오늘, 내일, or 어제. Meet at three. / Meet on Saturday. / Meet tomorrow."],"task":["‘내일 세 시에 만나요.’을 소리 내어 읽고, ‘토요일에 시간이 있어요?’과 ‘약속이 있어서 못 가요.’을 사용해 두 사람이 대화해 보세요.","Read \"Let's meet at three tomorrow.\" aloud, then role-play a conversation using \"Are you free on Saturday?\" and \"I can't go because I have an appointment.\"."],"checks":[["'내일'의 뜻은?","What does '내일' mean?",["Yesterday","Tomorrow","Today","Next year"],1],["'세 시___ 만나요.'에 알맞은 조사는?","Choose the particle: '세 시___ 만나요.'",["를","에서","에","은"],2]]},{"scene":["길 묻기와 교통수단 — 실생활 대화 연습","Directions and Transportation — practical conversation"],"dialogue":[{"speaker":"A","ko":"오늘은 ‘길 묻기와 교통수단’에 대해 연습해요.","en":"Let's practice Directions and Transportation today."},{"speaker":"B","ko":"지하철역이 어디에 있어요?","en":"Where is the subway station?"},{"speaker":"A","ko":"다른 표현도 말해 볼래요?","en":"Can you try another expression?"},{"speaker":"B","ko":"곧장 가다가 오른쪽으로 도세요.","en":"Go straight, then turn right."},{"speaker":"A","ko":"좋아요. 마지막 문장도 말해 보세요.","en":"Good. Please say the last sentence too."},{"speaker":"B","ko":"버스로 학교에 가요.","en":"I go to school by bus."}],"focus":["이동 방향에는 '으로/로'를 사용합니다. 일반적으로 받침이 있으면 '으로', 없으면 '로'를 씁니다. 받침 'ㄹ' 뒤에도 '로'를 씁니다. 오른쪽으로 가세요. / 버스로 가요. / 서울로 가요.","Use '(으)로' for direction or means. Usually use '으로' after a final consonant, '로' after a vowel or a final ㄹ. Go to the right. / Go by bus. / Go to Seoul."],"task":["‘지하철역이 어디에 있어요?’을 소리 내어 읽고, ‘곧장 가다가 오른쪽으로 도세요.’과 ‘버스로 학교에 가요.’을 사용해 두 사람이 대화해 보세요.","Read \"Where is the subway station?\" aloud, then role-play a conversation using \"Go straight, then turn right.\" and \"I go to school by bus.\"."],"checks":[["'왼쪽'의 뜻은?","What does '왼쪽' mean?",["Right","Left","Straight","Behind"],1],["'버스___ 가요.' 알맞은 조사는?","Choose the particle: '버스___ 가요.'",["으로","로","에","를"],1]]},{"scene":["과거 경험과 일상 이야기 — 실생활 대화 연습","Past Experiences — practical conversation"],"dialogue":[{"speaker":"A","ko":"오늘은 ‘과거 경험과 일상 이야기’에 대해 연습해요.","en":"Let's practice Past Experiences today."},{"speaker":"B","ko":"지난주에 부산에 갔어요.","en":"I went to Busan last week."},{"speaker":"A","ko":"다른 표현도 말해 볼래요?","en":"Can you try another expression?"},{"speaker":"B","ko":"친구와 영화를 봤어요.","en":"I watched a movie with a friend."},{"speaker":"A","ko":"좋아요. 마지막 문장도 말해 보세요.","en":"Good. Please say the last sentence too."},{"speaker":"B","ko":"여행이 정말 재미있었어요.","en":"The trip was really fun."}],"focus":["동사의 과거형은 보통 어간에 '-았/었어요'를 붙입니다. '가다 → 갔어요', '먹다 → 먹었어요'처럼 바뀝니다. 어제 영화를 봤어요. / 지난주에 여행했어요.","The polite past tense usually uses '-았/었어요': 가다 → 갔어요, 먹다 → 먹었어요. I watched a movie yesterday. / I traveled last week."],"task":["‘지난주에 부산에 갔어요.’을 소리 내어 읽고, ‘친구와 영화를 봤어요.’과 ‘여행이 정말 재미있었어요.’을 사용해 두 사람이 대화해 보세요.","Read \"I went to Busan last week.\" aloud, then role-play a conversation using \"I watched a movie with a friend.\" and \"The trip was really fun.\"."],"checks":[["'지난주'의 뜻은?","What does '지난주' mean?",["Next week","This week","Last week","Last month"],2],["'가다'의 자연스러운 과거형은?","What is the past form of '가다'?",["가요","갔어요","갈 거예요","가세요"],1]]},{"scene":["쇼핑과 부탁하기 — 실생활 대화 연습","Shopping and Requests — practical conversation"],"dialogue":[{"speaker":"A","ko":"오늘은 ‘쇼핑과 부탁하기’에 대해 연습해요.","en":"Let's practice Shopping and Requests today."},{"speaker":"B","ko":"이 옷은 얼마예요?","en":"How much is this item of clothing?"},{"speaker":"A","ko":"다른 표현도 말해 볼래요?","en":"Can you try another expression?"},{"speaker":"B","ko":"다른 사이즈가 있어요?","en":"Do you have another size?"},{"speaker":"A","ko":"좋아요. 마지막 문장도 말해 보세요.","en":"Good. Please say the last sentence too."},{"speaker":"B","ko":"이것으로 바꿔 주세요.","en":"Please exchange it for this one."}],"focus":["'-아/어 주세요'는 다른 사람에게 행동을 부탁할 때 씁니다. '바꾸다 → 바꿔 주세요', '보여 주다 → 보여 주세요'와 같이 활용합니다. 이것을 보여 주세요. / 다른 사이즈로 바꿔 주세요.","Use '-아/어 주세요' to ask someone politely to do something: 바꾸다 → 바꿔 주세요, 보여 주다 → 보여 주세요. Please show me this. / Please exchange it for another size."],"task":["‘이 옷은 얼마예요?’을 소리 내어 읽고, ‘다른 사이즈가 있어요?’과 ‘이것으로 바꿔 주세요.’을 사용해 두 사람이 대화해 보세요.","Read \"How much is this item of clothing?\" aloud, then role-play a conversation using \"Do you have another size?\" and \"Please exchange it for this one.\"."],"checks":[["'비싸다'의 뜻은?","What does '비싸다' mean?",["To be cheap","To be expensive","To be small","To be new"],1],["'바꾸다'를 정중한 부탁으로 바꾸면?","Which is a polite request using '바꾸다'?",["바꿨어요","바꿀 거예요","바꿔 주세요","바꾸지 않아요"],2]]},{"scene":["식당 1 · 예약 — 실생활 대화 연습","Restaurant 1 · reservation — practical conversation"],"dialogue":[{"speaker":"A","ko":"오늘은 ‘식당 1 · 예약’에 대해 연습해요.","en":"Let's practice Restaurant 1 · reservation today."},{"speaker":"B","ko":"두 명 자리 있어요?","en":"Do you have a table for two?"},{"speaker":"A","ko":"다른 표현도 말해 볼래요?","en":"Can you try another expression?"},{"speaker":"B","ko":"이 음식은 맵지 않아요?","en":"Isn't this dish spicy?"},{"speaker":"A","ko":"좋아요. 마지막 문장도 말해 보세요.","en":"Good. Please say the last sentence too."},{"speaker":"B","ko":"추천 메뉴가 뭐예요?","en":"What do you recommend?"}],"focus":["[식당 1 · 예약] 핵심 표현 '예약'을 문맥 속에서 익히고 문장 '두 명 자리 있어요?'에 적용하세요. 두 명 자리 있어요? 예문: ‘두 명 자리 있어요?’.","[Restaurant 1 · reservation] Study '예약' in context and apply it to '두 명 자리 있어요?'. Do you have a table for two? Example: \"Do you have a table for two?\"."],"task":["‘두 명 자리 있어요?’을 소리 내어 읽고, ‘이 음식은 맵지 않아요?’과 ‘추천 메뉴가 뭐예요?’을 사용해 두 사람이 대화해 보세요.","Read \"Do you have a table for two?\" aloud, then role-play a conversation using \"Isn't this dish spicy?\" and \"What do you recommend?\"."],"checks":[["다음 표현의 뜻은? 예약","What does this expression mean? 예약",["order","reservation","side dish","bill"],1],["다음 문장을 이해한 내용으로 맞는 것은? 두 명 자리 있어요?","Which interpretation matches this sentence? 두 명 자리 있어요?",["Isn't this dish spicy?","What do you recommend?","Do you have a table for two?","Please give us more side dishes."],2]]},{"scene":["식당 2 · 주문 — 실생활 대화 연습","Restaurant 2 · order — practical conversation"],"dialogue":[{"speaker":"A","ko":"오늘은 ‘식당 2 · 주문’에 대해 연습해요.","en":"Let's practice Restaurant 2 · order today."},{"speaker":"B","
