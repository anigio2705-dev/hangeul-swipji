<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한국어 진단평가 | 한글쉽지</title><style>
:root{--blue:#315de5;--ink:#152947;--muted:#64758c;--line:#e2e8f2}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:system-ui,"Noto Sans KR","Malgun Gothic",sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #93baff;outline-offset:2px}a{color:inherit;text-decoration:none}.wrap{max-width:930px;margin:auto;padding:0 22px}header{background:#fff;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;gap:16px;min-height:75px}.brand{font-weight:900;color:#234fc5;font-size:23px}.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:#77849a}.back{margin-left:auto;color:#315de5;font-size:13px;font-weight:800}.lang{border:1px solid var(--line);background:white;border-radius:10px;padding:9px}.hero{background:linear-gradient(110deg,#112954,#315cbe,#6758bc);color:white;border-radius:22px;padding:38px;margin:25px 0}.hero small{letter-spacing:1.5px;color:#cbdcff;font-weight:850}.hero h1{font-size:clamp(27px,4vw,40px);margin:10px 0}.hero p{line-height:1.8;color:#e1e9ff;font-size:14px;max-width:730px}.panel{background:white;border:1px solid var(--line);border-radius:19px;padding:30px;margin:20px 0}.panel h2{margin:0 0 15px}.muted{color:var(--muted);font-size:13px;line-height:1.8}.btn{border:0;background:var(--blue);color:white;font-weight:850;border-radius:11px;padding:13px 23px}.outline{border:1px solid #cad7f3;background:white;color:#315de5;font-weight:800;border-radius:11px;padding:12px 20px}.btn:disabled{background:#aebad0;cursor:not-allowed}.bar{height:9px;background:#e9eef8;border-radius:20px;overflow:hidden;margin:14px 0 24px}.bar>div{background:var(--blue);height:100%;transition:width .2s}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.tag{font-size:12px;color:#315de5;font-weight:850}.question{font-size:23px;line-height:1.6;margin:19px 0 23px;white-space:pre-line}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:1px solid #dce4f0;background:#fbfcff;border-radius:12px;padding:16px;text-align:left;line-height:1.6;color:#243956}.choice[aria-pressed="true"]{border:2px solid #315de5;background:#edf3ff;font-weight:800}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:25px}.score{font-size:46px;color:#315de5;font-weight:900}.resultlevel{display:inline-block;border-radius:20px;background:#eaf0ff;color:#315de5;padding:8px 15px;font-weight:850;margin:8px 0}.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.metric{background:#f3f6fc;border-radius:12px;padding:15px;text-align:center}.metric strong{display:block;font-size:23px}.metric small{font-size:11px;color:var(--muted)}.review{margin-top:24px}.review article{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.7}.review .ok{color:#19804b}.review .no{color:#c44b4b}.hidden{display:none}.disclaimer{color:#7a6b46;background:#fff9e7;border:1px solid #f0e5c7;padding:14px;border-radius:12px;font-size:12px;line-height:1.8;margin:18px 0 45px}@media(max-width:640px){.top{flex-wrap:wrap;padding:13px 0}.hero{padding:27px}.panel{padding:21px}.choices{grid-template-columns:1fr}.breakdown{grid-template-columns:repeat(2,1fr)}.question{font-size:20px}}
</style></head><body><header><div class="wrap top"><a href="./" class="brand">한글쉽지<small>HANGEUL SWIPJI</small></a><a href="./" id="home" class="back"></a><select id="lang" class="lang" aria-label="Language"><option value="ko">🇰🇷 한국어</option><option value="en">🇺🇸 English</option></select></div></header><main class="wrap"><section class="hero"><small>KOREAN PLACEMENT TEST</small><h1 id="title"></h1><p id="subtitle"></p></section>
<section id="welcome" class="panel"><h2 id="welcomeTitle"></h2><p class="muted" id="welcomeText"></p><button class="btn" id="start"></button></section>
<section id="exam" class="panel hidden"><div class="row"><span class="tag" id="counter"></span><span class="muted" id="group"></span></div><div class="bar"><div id="progress"></div></div><h2 class="question" id="question"></h2><div class="choices" id="choices"></div><div class="actions"><button class="outline" id="prev"></button><button class="btn" id="next" disabled></button></div></section>

<script>
"use strict";
const questions=[
["'ㄱ'의 이름은?","What is the name of 'ㄱ'?",["기역","니은","디귿","미음"],0],
["'ㅏ'의 소리는?","Which vowel sound is 'ㅏ'?",["어 (eo)","아 (a)","우 (u)","오 (o)"],1],
["ㄴ + ㅏ = ?","ㄴ + ㅏ = ?",["다","가","나","마"],2],
["'감사합니다'의 뜻은?","What does '감사합니다' mean?",["Hello","Sorry","Goodbye","Thank you"],3],
["'안녕하세요'는 언제 사용하나요?","When would you use '안녕하세요'?",["인사할 때 / To greet someone","사과할 때 / To apologize","작별할 때 / To say goodbye","감사할 때 / To thank someone"],0],
["'저___ 학생이에요.' 빈칸에 알맞은 것은?","Choose the correct particle: '저___ 학생이에요.'",["은","는","이","을"],1],
["'책___ 읽어요.' 빈칸에 알맞은 것은?","Choose the correct particle: '책___ 읽어요.'",["은","이","을","는"],2],
["'어제 학교에 ___.' 알맞은 과거 표현은?","Complete with the past tense: '어제 학교에 ___.'",["가요","갈 거예요","가세요","갔어요"],3],
["'내일 친구를 만날 거예요.'의 의미는?","What does '내일 친구를 만날 거예요.' mean?",["I will meet a friend tomorrow.","I met a friend yesterday.","I meet friends every day.","I cannot meet my friend."],0],
["'비가 와서 집에 있었어요.'에서 '-아서/어서'는?","What does '-아서/어서' express here: '비가 와서 집에 있었어요.'?",["대조 / Contrast","이유 / Reason","조건 / Condition","순서 / Sequence"],1],
["'피곤하지만 공부해요.'의 의미는?","What does '피곤하지만 공부해요.' mean?",["I study because I am tired.","I study after resting.","I study although I am tired.","I do not study when tired."],2],
["'천천히 말해 주세요.'의 뜻은?","What does '천천히 말해 주세요.' mean?",["Please come quickly.","Please sit here.","Please speak louder.","Please speak slowly."],3],
["'한국어를 배운 지 2년이 됐어요.'의 의미는?","What does '한국어를 배운 지 2년이 됐어요.' mean?",["It has been two years since I started learning Korean.","I will learn Korean in two years.","I stopped learning Korean two years ago.","I learn Korean twice a year."],0],
["'늦을 수도 있어요.'의 의미는?","What does '늦을 수도 있어요.' mean?",["They must be late.","They might be late.","They are never late.","They were definitely late."],1],
["'시간이 있으면 같이 가요.'의 '-으면'은?","What does '-으면' express in '시간이 있으면 같이 가요.'?",["목적 / Purpose","양보 / Concession","조건 / Condition","결과 / Result"],2],
["'비가 오더라도 출발하겠습니다.'의 의미는?","What does '비가 오더라도 출발하겠습니다.' mean?",["We will depart only if it stops raining.","We departed because it rained.","We cannot depart in the rain.","We will depart even if it rains."],3],
["'그는 이미 떠났을지도 모릅니다.'에서 나타나는 태도는?","What does '그는 이미 떠났을지도 모릅니다.' express?",["불확실한 추측 / Uncertain inference","강한 명령 / Strong command","확정된 사실 / Confirmed fact","직접적인 요청 / Direct request"],0],
["'반면에'와 가장 가까운 의미는?","Which is closest in meaning to '반면에'?",["그러므로 / Therefore","한편 대조적으로 / On the other hand","예를 들어 / For example","게다가 / Moreover"],1],
["'이 자료는 주장을 뒷받침한다.'의 의미는?","What does '이 자료는 주장을 뒷받침한다.' mean?",["The data contradict the argument.","The data are missing.","The data support the argument.","The data summarize the schedule."],2],
["'검토해 주시기 바랍니다.'의 문체는?","What is the register of '검토해 주시기 바랍니다.'?",["친구 사이의 반말 / Casual speech","유아어 / Baby talk","속어 / Slang","격식 있는 요청 / Formal request"],3]
];
const copy={ko:{home:"← 메인으로",title:"한국어 실력 진단평가",subtitle:"20문항으로 현재 한국어 이해 수준을 점검하고 추천 학습 단계를 확인하세요. 시험 중에는 정답을 공개하지 않습니다.",welcomeTitle:"시작하기 전에",welcomeText:"총 20문항 · 객관식 4지선다 · 시간 제한 없음. 입문부터 고급까지 어휘·문법·표현 이해를 확인합니다. 모르는 문제도 하나를 선택해 진행해 주세요. 이 평가는 공식 TOPIK 또는 세종학당 배치고사가 아닙니다.",start:"평가 시작하기 →",prev:"← 이전",next:"다음 문제 →",submit:"결과 확인하기",resultTitle:"진단 결과",resultText:"이 점수는 간이 진단 결과입니다. 실제 학습 단계는 듣기·말하기·읽기·쓰기 평가와 함께 결정하는 것이 좋습니다.",restart:"다시 응시하기",study:"추천 과정 공부하기 →",disclaimer:"안내: 본 평가는 한글쉽지 자체 제작의 비공식 간이 진단입니다. 공식 TOPIK 급수나 세종학당 수료·배치 수준을 인증하지 않습니다. 응답과 결과는 서버로 전송되지 않으며 현재 브라우저에서만 처리됩니다.",reviewTitle:"문항별 결과",your:"선택",answer:"정답",labels:["입문","초급 1","초급 2","중급 1","중급 2","고급 1","고급 2"],metrics:["입문","초급","중급","고급"],counter:"문항",group:"영역",levels:["입문","초급","중급","고급"]},en:{home:"← Home",title:"Korean Placement Check",subtitle:"Check your Korean knowledge with 20 questions and receive a suggested learning stage. Correct answers are hidden during the test.",welcomeTitle:"Before You Begin",welcomeText:"20 multiple-choice questions · Four options each · No time limit. The test samples vocabulary, grammar, and expression comprehension from introductory to advanced Korean. Choose an answer to continue. This is not an official TOPIK or King Sejong Institute placement exam.",start:"Start Assessment →",prev:"← Previous",next:"Next Question →",submit:"See My Results",resultTitle:"Your Results",resultText:"This is a short screening assessment. A reliable placement also needs listening, speaking, reading, and writing evaluation.",restart:"Take Again",study:"Go to Suggested Lessons →",disclaimer:"Note: This is an unofficial, independently written screening quiz by Hangeul Swipji. It does not certify a TOPIK grade or King Sejong Institute level. Responses and results are processed in your browser and are not sent to a server.",reviewTitle:"Answer Review",your:"Your choice",answer:"Correct answer",labels:["Intro","Beginner 1","Beginner 2","Intermediate 1","Intermediate 2","Advanced 1","Advanced 2"],metrics:["Intro","Beginner","Intermediate","Advanced"],counter:"Question",group:"Section",levels:["Intro","Beginner","Intermediate","Advanced"]}};
const $=id=>document.getElementById(id);let lang=localStorage.getItem("hs-language")==="en"?"en":"ko",pos=0,answers=Array(20).fill(null),mode="welcome";
function recommended(){const s=answers.reduce((sum,a,i)=>sum+(a===questions[i][3]?1:0),0);return {score:s,stage:s<=3?0:s<=6?1:s<=9?2:s<=12?3:s<=15?4:s<=17?5:6}}
function render(){const t=copy[lang];document.documentElement.lang=lang;$("lang").value=lang;for(const k of ["home","title","subtitle","welcomeTitle","welcomeText","start","resultTitle","resultText","restart","study","disclaimer"])$(k).textContent=t[k];for(const k of ["welcome","exam","results"])$(k).classList.toggle("hidden",k!==mode);if(mode==="exam")renderQuestion();if(mode==="results")renderResult()}
function renderQuestion(){const t=copy[lang],q=questions[pos];$("counter").textContent=t.counter+" "+(pos+1)+" / 20";$("group").textContent=t.group+" · "+t.levels[Math.min(3,Math.floor(pos/5))];$("progress").style.width=(100*(pos+1)/20)+"%";$("question").textContent=q[lang==="ko"?0:1];$("prev").textContent=t.prev;$("prev").disabled=pos===0;$("next").textContent=pos===19?t.submit:t.next;$("next").disabled=answers[pos]===null;const wrap=$("choices");wrap.replaceChildren();q[2].forEach((a,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+a;b.setAttribute("aria-pressed",String(answers[pos]===i));b.onclick=()=>{answers[pos]=i;renderQuestion()};wrap.append(b)})}
function renderResult(){const t=copy[lang],r=recommended();$("score").textContent=r.score+" / 20";$("level").textContent=t.labels[r.stage];const counts=[0,0,0,0];const good=[0,0,0,0];questions.forEach((q,i)=>{const group=Math.floor(i/5);counts[group]++;if(answers[i]===q[3])good[group]++});const wrap=$("breakdown");wrap.replaceChildren();t.metrics.forEach((m,i)=>{const e=document.createElement("div");e.className="metric";const a=document.createElement("strong");a.textContent=good[i]+"/"+counts[i];const b=document.createElement("small");b.textContent=m;e.append(a,b);wrap.append(e)});const review=$("review");review.replaceChildren();const h=document.createElement("h3");h.textContent=t.reviewTitle;review.append(h);questions.forEach((q,i)=>{const article=document.createElement("article"),strong=document.createElement("strong"),detail=document.createElement("div");const ok=answers[i]===q[3];strong.className=ok?"ok":"no";strong.textContent=(ok?"✓ ":"✗ ")+(i+1)+". "+q[lang==="ko"?0:1];detail.textContent=t.your+": "+q[2][answers[i]]+" · "+t.answer+": "+q[2][q[3]];article.append(strong,detail);review.append(article)});$("study").href="./learn.html?level="+r.stage}
$("start").onclick=()=>{pos=0;answers=Array(20).fill(null);mode="exam";render()};$("prev").onclick=()=>{if(pos>0){pos--;renderQuestion()}};$("next").onclick=()=>{if(answers[pos]===null)return;if(pos<19){pos++;renderQuestion()}else{mode="results";render();window.scrollTo({top:0,behavior:"smooth"})}};$("restart").onclick=()=>{mode="welcome";pos=0;answers=Array(20).fill(null);render()};$("lang").onchange=e=>{lang=e.target.value;localStorage.setItem("hs-language",lang);render()};render();
</script></body></html>
