<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7일 수업 실증 기록 | 한글쉽지</title><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:auto;padding:24px;line-height:1.65;color:#182c3a}h1{font-size:1.8rem}label{display:block;margin:14px 0}input,select,textarea{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:65px}button,a{padding:9px;margin-right:8px}section{border:1px solid #d3dbe2;border-radius:12px;padding:16px;margin:18px 0}.note{background:#f4f7fa;padding:12px}button{cursor:pointer}@media print{.no-print{display:none}body{padding:0}section{break-inside:avoid}}</style></head><body><h1>한글쉽지 · 7일 입문 수업 실증 기록표</h1><p class="note">실제 초보자와 교사가 같은 교재로 수업한 결과를 기록합니다. 글자 문제의 정답률과 발음·읽기·쓰기 능력은 별도로 평가합니다. 학생 개인정보 대신 익명 코드만 사용하세요. 저장은 현재 브라우저에만 이루어집니다.</p><p class="no-print"><a href="./hangul-week.html?mode=teacher">교사용 교재</a><a href="./hangul-week.html?mode=student">학생용 교재</a><a href="./hangul-audio-review.html?scope=week">발음 검수</a></p><form id="form"><section><label>익명 학생 코드 <input name="student" required placeholder="예: P01"></label><label>수업 날짜 <input name="date" type="date"></label><label>수업일차 <select name="day"><option value="H01">1일차 · 자음 이름</option><option value="H02">2일차 · 모음</option><option value="H03">3일차 · 가·나·다</option><option value="H04">4일차 · 모음 바꾸기</option><option value="H05">5일차 · 낱말</option><option value="H06">6일차 · 받침</option><option value="H07">7일차 · 종합</option></select></label><label>이전 한국어 학습 경험 <select name="experience"><option>없음</option><option>조금 있음</option><option>확인 필요</option></select></label></section><section><h2>수업 전·후 관찰</h2><label>수업 전 글자 찾기·합치기 (0~5) <input name="before" type="number" min="0" max="5"></label><label>수업 후 새로운 순서의 글자 찾기·합치기 (0~5) <input name="after" type="number" min="0" max="5"></label><label>다음 수업에서 다시 확인 (0~5) <input name="followup" type="number" min="0" max="5"></label><label>직접 읽기 <select name="reading"><option>미검사</option><option>독립 수행</option><option>힌트 후 수행</option><option>수행 어려움</option></select></label><label>직접 쓰기 <select name="writing"><option>미검사</option><option>독립 수행</option><option>힌트 후 수행</option><option>수행 어려움</option></select></label><label>발음 청취 <select name="pronunciation"><option>미검사</option><option>교사 확인</option><option>재지도 필요</option><option>녹음 부재로 확인 불가</option></select></label><label>교사의 도움 종류·횟수 <textarea name="help"></textarea></label><label>막힌 글자·화면·안내 문구 <textarea name="obstacles"></textarea></label><label>교재 개선 제안 <textarea name="improvements"></textarea></label></section><section><h2>최종 판단</h2><label>다음 일차 진행 <select name="decision"><option>보류 · 다시 연습</option><option>교사 확인 후 진행 가능</option><option>판단 유보</option></select></label><label>추가 확인사항 <textarea name="notes"></textarea></label><p>주의: 자동 채점만으로 발음 합격을 판정하지 않습니다. 실제 수업을 진행하지 않았다면 완료로 표시하지 않습니다.</p></section><div class="no-print"><button type="button" id="save">이 기기에 임시 저장</button><button type="button" id="export">JSON 내보내기</button><button type="button" onclick="print()">인쇄 / PDF 저장</button><p id="status" role="status"></p></div></form><script>(()=>{const f=document.getElementById('form'),status=document.getElementById('status'),key='hs-pilot-form-v1';try{const data=JSON.parse(localStorage.getItem(key)||'{}');for(const [k,v]of Object.entries(data)){if(f.elements.namedItem(k))f.elements.namedItem(k).value=v}}catch(_){}function values(){return Object.fromEntries(new FormData(f).entries())}document.getElementById('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(values()));status.textContent='이 브라우저에만 임시 저장했습니다.'}catch(_){status.textContent='저장할 수 없습니다. JSON을 내보내세요.'}};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({type:'hangul-week-pilot',version:1,record:values()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hangul-week-pilot.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}})();</script></body></html>
