<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ㅏ 발음 연습 | 한글쉽지</title><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f4f7fd;color:#16284b;margin:0}.wrap{max-width:650px;margin:8vh auto;padding:24px}.card{background:white;border-radius:22px;padding:36px;text-align:center;box-shadow:0 12px 45px #1d315016}h1{font-size:26px}.letter{font-size:120px;font-weight:800;margin:12px}button{border:0;background:#285be0;color:white;border-radius:13px;padding:16px 25px;font-size:18px;font-weight:750;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.7}a{color:#285be0}#status{min-height:28px;color:#51647e}</style></head><body><main class="wrap"><a href="./learn.html">← 학습관 돌아가기</a><section class="card"><h1>한국어 모음 발음 연습</h1><div class="letter">ㅏ</div><p>아 · a</p><button id="play" type="button">▶ 원어민 발음 듣기</button><p id="status" role="status" aria-live="polite">원어민 녹음 파일이 연결되면 재생됩니다.</p><audio id="voice" preload="none" src="./audio/vowels/a-native.mp3"></audio></section></main><script>const btn=document.getElementById('play'),audio=document.getElementById('voice'),status=document.getElementById('status');btn.onclick=async()=>{try{audio.currentTime=0;await audio.play();status.textContent='ㅏ (아) 발음 재생 중';}catch(e){status.textContent='실제 사람의 녹음 파일이 아직 등록되지 않았습니다. audio/vowels/a-native.mp3 파일을 추가해 주세요.'}};audio.onended=()=>status.textContent='다시 눌러 반복 연습하세요.';audio.onerror=()=>status.textContent='원어민 녹음 파일을 기다리고 있습니다.';</script></body></html>
