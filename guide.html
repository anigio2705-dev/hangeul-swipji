ml"],["읽기 15단계 연습","각 레벨에서 책을 골라 읽고, 듣고, 영어 해석을 확인한 뒤 독해 문제를 풀어보세요.","리딩 라이브러리","reading.html"],["한국 생활 회화","카페·식당·교통·약속 등의 생활 표현을 실제 상황처럼 연습하세요.","한국 일상 배우기","daily.html"],["드라마·K-POP·문화","창작 상황 대화와 한국 문화를 통해 배운 표현을 더 자연스럽게 사용해 보세요.","K-문화 콘텐츠","culture.html"],["진도와 오답 확인","틀린 문제를 복습하고 진도를 확인하세요. 기록은 이 브라우저에 저장됩니다.","나의 대시보드","dashboard.html"]],weekTitle:"추천 학습 루틴 · 하루 20~30분",week:[["1단계 · 10분","현재 수준의 한국어 단원 1개를 공부하고 소리 내어 읽으세요."],["2단계 · 10분","리딩 1편을 읽고 한국어 듣기와 독해 3문항에 도전하세요."],["3단계 · 5~10분","틀린 표현을 다시 보고 한국 일상 또는 K-문화 예시로 복습하세요."]],tipsTitle:"효과적으로 사용하는 방법",tips:["처음에는 한글과 발음부터 시작해도 좋습니다.","문장을 눈으로만 보지 말고 직접 소리 내어 읽어 보세요.","독해 문제를 먼저 풀고 해석을 확인하면 이해력을 점검하기 좋습니다.","정답을 맞혔더라도 새로운 문장으로 바꾸어 말해 보세요.","진도는 기기별로 저장되므로 대시보드에서 주기적으로 백업하세요."],notice:"안내: 이 사이트는 현재 교육 콘텐츠를 확장하는 시제품입니다. 15단계 리딩은 기본 이야기의 변형·확장 콘텐츠를 포함하며, 공식 TOPIK 평가나 AI 자동 작문 첨삭은 제공하지 않습니다."},en:{title:"Your guide to learning Korean.",intro:"New here? Find your level, study Korean every day, and reinforce your skills with reading and cultural content.",steps:[["Find your level","Try 20 placement questions. This is guidance, not an official certified test.","Take placement quiz","placement.html"],["Study the seven stages","Follow 50 units in each stage, from Hangul to Advanced 2.","Open Korean courses","learn.html"],["Read across 15 levels","Choose a book, read and listen, check the translation, then answer comprehension questions.","Open reading library","reading.html"],["Practice everyday Korean","Use practical language for cafés, restaurants, transport and appointments.","Everyday Korea","daily.html"],["Explore culture","Use original drama-style conversations, music themes and cultural lessons to practice naturally.","Explore K-culture","culture.html"],["Review your progress","Revisit mistakes and track your learning. Records are saved in this browser.","My dashboard","dashboard.html"]],weekTitle:"Suggested routine · 20–30 minutes a day",week:[["Step 1 · 10 minutes","Complete one unit at your level and read the expressions aloud."],["Step 2 · 10 minutes","Read one story, listen to Korean audio, and answer three questions."],["Step 3 · 5–10 minutes","Review mistakes using examples from everyday Korean or K-culture."]],tipsTitle:"How to get the most from the site",tips:["Start with Hangul and pronunciation if you are new to Korean.","Read sentences aloud instead of only looking at them.","Try comprehension questions before viewing English translations.","Turn correct answers into new sentences of your own.","Back up your browser-based progress regularly from the dashboard."],notice:"Note: This is a developing educational prototype. The 15-level reading library includes variations and expansions of core stories; official TOPIK certification and AI writing correction are not provided."}};function render(){document.documentElement.lang=lang;$("lang").value=lang;document.querySelectorAll("[data-ko]").forEach(x=>x.textContent=x.dataset[lang]);const d=data[lang];$("title").textContent=d.title;$("intro").textContent=d.intro;$("weekTitle").textContent=d.weekTitle;$("tipsTitle").textContent=d.tipsTitle;$("notice").textContent=d.notice;const steps=$("steps");steps.replaceChildren();d.steps.forEach((x,i)=>{const card=document.createElement("article");card.className="step";const n=document.createElement("span");n.className="number";n.textContent="STEP "+String(i+1).padStart(2,"0");const h=document.createElement("h2");h.textContent=x[0];const p=document.createElement("p");p.textContent=x[1];const a=document.createElement("a");a.href="./"+x[3];a.textContent=x[2]+" →";card.append(n,h,p,a);steps.append(card)});const week=$("week");week.replaceChildren();d.week.forEach(x=>{const e=document.createElement("div");e.className="day";const b=document.createElement("b");b.textContent=x[0];const p=document.createElement("p");p.textContent=x[1];e.append(b,p);week.append(e)});const tips=$("tips");tips.replaceChildren();d.tips.forEach((x,i)=>{const p=document.createElement("p");p.textContent=(i+1)+". "+x;tips.append(p)})}$("lang").onchange=e=>{lang=e.target.value;localStorage.setItem("hs-language",lang);render()};render();</script></body></html>
